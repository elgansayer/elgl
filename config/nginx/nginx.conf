events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Define rate limiting zone for WebSocket connections (e.g., 5 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=centrifugo_limit:10m rate=5r/s;

    # Define concurrent connection limiting zone (e.g., max 20 concurrent connections per IP)
    limit_conn_zone $binary_remote_addr zone=centrifugo_conn_limit:10m;

    server {
        listen 80;
        server_name localhost;

        # Frontend SPA
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend REST API
        location /api/ {
            proxy_pass http://api:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
        }

        # Centrifugo WebSocket connection
        location /centrifugo/ {
            # Apply rate limiting
            limit_req zone=centrifugo_limit burst=10 nodelay;
            limit_conn centrifugo_conn_limit 20;

            proxy_pass http://websocket:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }
}
