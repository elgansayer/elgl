port: 7880
prometheus_port: 6789

rtc:
  tcp_port: 7881
  port_range_start: 58000
  port_range_end: 58100
  use_external_ip: true
  stun_servers:
    - stun:stun.l.google.com:19302
    - stun:stun1.l.google.com:19302

# TURN is enabled for UDP and TLS fallback. Runtime deployment values for the
# public domain and certificate paths are supplied through LIVEKIT_TURN_* env
# vars by docker-compose.yml. API credentials are supplied with LIVEKIT_KEYS;
# never add key/secret material to this tracked file.
turn:
  enabled: true
  tls_port: 443
  udp_port: 3478
  external_tls: false

redis:
  address: cache:6379

logging:
  level: info
