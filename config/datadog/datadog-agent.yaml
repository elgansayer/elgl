# Datadog Agent configuration for HelloTalk
# This file is mounted into the Datadog Agent container.
# See: https://docs.datadoghq.com/agent/guide/agent-configuration-files/

api_key: ${DD_API_KEY}
site: ${DD_SITE:-datadoghq.com}

logs_enabled: false
apm_config:
  enabled: false
process_config:
  process_collection:
    enabled: false

# Scrape Prometheus / OpenMetrics endpoint from NestJS backend
prometheus_scrape:
  enabled: true
  health_service_check: true
  service_check_endpoint: http://api:3000/health
prometheus_scrape:
  - url: http://api:3000/metrics
    namespace: hellotalk
    metrics:
      # Core SRS metrics (Datadog custom metrics)
      - hellotalk_srs_flashcards_created_total: counter
      - hellotalk_srs_reviews_completed_total: counter
      - hellotalk_srs_due_cards: gauge
      - hellotalk_srs_average_easiness_factor: gauge
      - hellotalk_srs_review_success_rate: gauge
      - hellotalk_srs_cards_per_level: gauge
      - hellotalk_srs_review_duration_seconds: histogram
      - hellotalk_srs_cards_stuck: gauge
      - hellotalk_srs_decks_total: gauge
      - hellotalk_srs_decks_created_total: counter
      # Infrastructure metrics
      - hellotalk_http_request_duration_seconds: histogram
      - hellotalk_http_requests_total: counter
      - hellotalk_active_connections: gauge
      # Node.js default metrics (prefixed with hellotalk_)
      - hellotalk_nodejs_heap_size_total_bytes: gauge
      - hellotalk_nodejs_heap_size_used_bytes: gauge
      - hellotalk_nodejs_eventloop_lag_seconds: gauge
      - hellotalk_process_cpu_seconds_total: counter

tags:
  - env:${DD_ENV:-production}
  - service:hellotalk
  - version:${APP_VERSION:-1.0.0}