# Datadog Agent configuration for HelloTalk
# This file is mounted into the Datadog Agent container.
# See: https://docs.datadoghq.com/agent/guide/agent-configuration-files/

api_key: ${DD_API_KEY}
site: ${DD_SITE:-datadoghq.com}

logs_enabled: false
apm_config:
  enabled: false
process_config:
  process_collection:
    enabled: false

# Scrape Prometheus / OpenMetrics endpoint from NestJS backend
prometheus_scrape:
  enabled: true
  health_service_check: true
  service_check_endpoint: http://api:3000/health
prometheus_scrape:
  - url: http://api:3000/metrics
    namespace: hellotalk
    metrics:
      # Core SRS metrics (Datadog custom metrics)
      - hellotalk_srs_flashcards_created_total: counter
      - hellotalk_srs_reviews_completed_total: counter
      - hellotalk_srs_due_cards: gauge
      - hellotalk_srs_average_easiness_factor: gauge
      - hellotalk_srs_review_success_rate: gauge
      - hellotalk_srs_cards_per_level: gauge
      - hellotalk_srs_review_duration_seconds: histogram
      - hellotalk_srs_cards_stuck: gauge
      - hellotalk_srs_decks_total: gauge
      - hellotalk_srs_decks_created_total: counter
      # Trust & Safety metrics (Datadog custom metrics)
      - hellotalk_ts_reports_submitted_total: counter
      - hellotalk_ts_blocks_created_total: counter
      - hellotalk_ts_blocks_removed_total: counter
      - hellotalk_ts_pending_reports: gauge
      - hellotalk_ts_active_blocks_total: gauge
      - hellotalk_ts_moderation_actions_total: counter
      - hellotalk_ts_dating_risk_score: histogram
      - hellotalk_ts_reports_by_category_total: counter
      - hellotalk_ts_moderation_queue_latency_seconds: histogram
      # LingQ Reading Engine metrics (Datadog custom metrics)
      - hellotalk_reading_engine_sessions_total: counter
      - hellotalk_reading_engine_words_parsed_total: counter
      - hellotalk_reading_engine_tokenisation_duration_seconds: histogram
      - hellotalk_reading_engine_ai_requests_total: counter
      - hellotalk_reading_engine_ai_request_duration_seconds: histogram
      - hellotalk_reading_engine_ai_errors_total: counter
      - hellotalk_reading_engine_flashcard_saves_total: counter
      - hellotalk_reading_engine_session_duration_seconds: histogram
      - hellotalk_reading_engine_words_looked_up_total: counter
      - hellotalk_reading_engine_daily_active_readers: gauge
      # Escrow Payment metrics (Datadog custom metrics, #2381)
      - hellotalk_escrow_transactions_created_total: counter
      - hellotalk_escrow_transactions_released_total: counter
      - hellotalk_escrow_transactions_refunded_total: counter
      - hellotalk_escrow_transactions_cancelled_total: counter
      - hellotalk_escrow_total_held: gauge
      - hellotalk_escrow_total_coins_held: gauge
      - hellotalk_escrow_amount_per_transaction: histogram
      - hellotalk_escrow_stale_held_count: gauge
      - hellotalk_escrow_auto_refund_total: counter
      - hellotalk_escrow_degraded_queue_size: gauge
      # Discovery Map metrics (Datadog custom metrics)
      - hellotalk_discovery_search_requests_total: counter
      - hellotalk_discovery_search_duration_seconds: histogram
      - hellotalk_discovery_search_result_count: histogram
      - hellotalk_discovery_fallback_to_mock_total: counter
      - hellotalk_discovery_postgis_queries_total: counter
      - hellotalk_discovery_postgis_query_duration_seconds: histogram
      - hellotalk_discovery_daily_recs_duration_seconds: histogram
      - hellotalk_discovery_daily_recs_users_processed: gauge
      - hellotalk_discovery_partner_of_week_calc_duration_seconds: histogram
      - hellotalk_discovery_audio_intro_requests_total: counter
      - hellotalk_discovery_recent_native_speaker_requests_total: counter
      - hellotalk_discovery_spotlight_requests_total: counter
      - hellotalk_discovery_language_pair_requests_total: counter
      - hellotalk_discovery_location_search_requests_total: counter
      - hellotalk_discovery_error_rate: gauge
      # Infrastructure metrics
      - hellotalk_http_request_duration_seconds: histogram
      - hellotalk_http_requests_total: counter
      - hellotalk_active_connections: gauge
      # Matchmaking / Recommendations metrics (Datadog custom metrics, #2280)
      - hellotalk_matchmaking_recommendations_generated_total: counter
      - hellotalk_matchmaking_recommendations_per_request: histogram
      - hellotalk_matchmaking_fallback_tier_used_total: counter
      - hellotalk_matchmaking_empty_results_total: counter
      - hellotalk_matchmaking_request_duration_seconds: histogram
      - hellotalk_matchmaking_daily_cache_misses_total: counter
      - hellotalk_matchmaking_tier_success_rate: gauge
      # Coin economy metrics (Datadog custom metrics)
      - hellotalk_coin_purchases_total: counter
      - hellotalk_coin_purchase_value_total: counter
      - hellotalk_coin_balance_total: gauge
      - hellotalk_coin_high_balance_users: gauge
      - hellotalk_coin_daily_claims_total: counter
      - hellotalk_coin_gifts_total: counter
      - hellotalk_coin_gift_value_total: counter
      - hellotalk_coin_sticker_purchases_total: counter
      - hellotalk_coin_sticker_revenue_total: counter
      - hellotalk_coin_purchase_errors_total: counter
      - hellotalk_coin_fraud_attempts_total: counter
      - hellotalk_coin_transaction_latency_seconds: histogram
      # Video Classrooms metrics (Datadog custom metrics, #2230)
      - hellotalk_video_classrooms_created_total: counter
      - hellotalk_video_classrooms_joined_total: counter
      - hellotalk_video_classrooms_active_rooms: gauge
      - hellotalk_video_classrooms_failed_creations_total: counter
      - hellotalk_video_classrooms_failed_joins_total: counter
      - hellotalk_video_classrooms_room_duration_seconds: histogram
      - hellotalk_video_classrooms_token_generation_duration_seconds: histogram
      - hellotalk_video_classrooms_participant_max: gauge
      # Tutor Profiles metrics (Datadog custom metrics, #2092)
      - hellotalk_tutor_profiles_created_total: counter
      - hellotalk_tutor_profiles_updated_total: counter
      - hellotalk_tutor_profiles_verification_failures_total: counter
      - hellotalk_tutor_profiles_incomplete_total: gauge
      - hellotalk_tutor_profiles_total: gauge
      - hellotalk_tutor_profiles_search_requests_total: counter
      - hellotalk_tutor_profiles_search_duration_seconds: histogram
      - hellotalk_tutor_profiles_search_empty_results_total: counter
      - hellotalk_tutor_profiles_sessions_booked_total: counter
      - hellotalk_tutor_profiles_sessions_completed_total: counter
      - hellotalk_tutor_profiles_sessions_cancelled_total: counter
      - hellotalk_tutor_profiles_sessions_refunded_total: counter
      - hellotalk_tutor_profiles_pending_sessions: gauge
      - hellotalk_tutor_profiles_availability_stale: gauge
      - hellotalk_tutor_profiles_api_errors_total: counter
      - hellotalk_tutor_profiles_booking_duration_seconds: histogram
      # Node.js default metrics (prefixed with hellotalk_)
      - hellotalk_nodejs_heap_size_total_bytes: gauge
      - hellotalk_nodejs_heap_size_used_bytes: gauge
      - hellotalk_nodejs_eventloop_lag_seconds: gauge
      - hellotalk_process_cpu_seconds_total: counter

tags:
  - env:${DD_ENV:-production}
  - service:hellotalk
  - version:${APP_VERSION:-1.0.0}