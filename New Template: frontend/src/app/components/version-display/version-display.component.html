<div class="version-display">
  <p>{{ 'current_version' | t }}: {{ versionInfo()?.current }}</p>
  <p>{{ 'latest_version' | t }}: {{ versionInfo()?.latest }}</p>
  <a
    *ngIf="updateAvailable && versionInfo()?.updateUrl"
    [href]="versionInfo()?.updateUrl"
    target="_blank"
    rel="noopener noreferrer"
  >
    {{ 'update_available' | t }}
  </a>
</div>
