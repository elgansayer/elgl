<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay + Spartan component system</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 2rem; background: Canvas; color: CanvasText; }
      main { max-width: 52rem; margin-inline: auto; display: grid; gap: 1.5rem; }
      section { border: 1px solid ButtonBorder; border-radius: 0.75rem; padding: 1rem; display: grid; gap: 0.75rem; }
      .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
      button, input, textarea { min-block-size: 44px; border: 1px solid ButtonBorder; padding-inline: 0.875rem; font: inherit; }
      button { background: ButtonFace; color: ButtonText; border-radius: 0.75rem; }
      input, textarea { border-radius: 0.5rem; }
      button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
      input, textarea { background: Field; color: FieldText; inline-size: min(100%, 22rem); }
      textarea { min-block-size: 6rem; padding-block: 0.75rem; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
      @media (forced-colors: active) { section { border-color: CanvasText; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Relay + Spartan component system</h1>
        <p>Reference states for the canonical Helm-owned interaction layer. Buttons use the Relay application-radius role at the Helm boundary.</p>
      </header>
      <section>
        <h2>Buttons</h2>
        <div class="row"><button>Primary</button><button>Secondary</button><button disabled>Disabled</button></div>
      </section>
      <section>
        <h2>Fields</h2>
        <label>Input <input value="Spartan-owned input" /></label>
        <label>Textarea <textarea>Relay content</textarea></label>
      </section>
      <section dir="rtl">
        <h2>RTL</h2>
        <div class="row"><button>إجراء</button><input value="نص" /></div>
      </section>
    </main>
  </body>
</html>
