<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay - Correction Modal</title>
    <style>
      :root {
        --surface-100: 228, 231, 237;
        --surface-200: 253, 253, 254;
        --surface-300: 241, 243, 247;
        --surface-400: 249, 250, 252;
        --surface-500: 246, 247, 250;
        --text-primary: 18, 21, 28;
        --text-secondary: 74, 81, 99;
        --text-muted: 112, 119, 137;
        --primary: 198, 82, 48;
        --secondary: 163, 73, 201;
        --warning: 181, 118, 20;
        --on-fill: 255, 255, 255;
        --shadow: 16, 19, 28;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: rgb(var(--surface-100));
        color: rgb(var(--text-primary));
        font-family: system-ui, sans-serif;
      }
      .states {
        display: grid;
        gap: 24px;
        grid-template-columns: minmax(0, 390px) minmax(0, 720px);
        align-items: start;
        justify-content: center;
      }
      .correction-modal-preview {
        min-width: 0;
        padding: 16px;
        border-radius: 20px;
        background: rgb(var(--surface-500));
      }
      .correction-modal-preview.light { color-scheme: light; }
      .correction-modal-preview.dark {
        --surface-100: 46, 52, 68;
        --surface-200: 30, 35, 48;
        --surface-300: 35, 40, 56;
        --surface-400: 24, 28, 39;
        --surface-500: 18, 21, 28;
        --text-primary: 243, 244, 247;
        --text-secondary: 180, 186, 201;
        --text-muted: 146, 153, 172;
        --primary: 255, 122, 82;
        --secondary: 211, 116, 247;
        --warning: 244, 181, 63;
        --on-fill: 18, 21, 28;
        --shadow: 0, 0, 0;
        color-scheme: dark;
      }
      .label {
        margin-block-end: 8px;
        color: rgb(var(--text-secondary));
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .modal {
        width: 100%;
        max-width: 512px;
        margin-inline: auto;
        overflow: hidden;
        border: 1px solid rgb(var(--surface-100));
        border-radius: 24px;
        background: rgb(var(--surface-500));
        box-shadow: 0 18px 48px rgb(var(--shadow) / 0.18);
      }
      .correction-modal-preview.wide .modal { max-width: 560px; }
      header,
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: rgb(var(--surface-400));
      }
      header { justify-content: space-between; border-block-end: 1px solid rgb(var(--surface-100)); }
      footer { justify-content: flex-end; flex-wrap: wrap; border-block-start: 1px solid rgb(var(--surface-100)); }
      h1 { min-width: 0; margin: 0; font-size: 16px; overflow-wrap: anywhere; }
      .body { display: grid; gap: 16px; padding: 16px; }
      .field-label {
        display: block;
        margin-block-end: 6px;
        color: rgb(var(--text-secondary));
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .ghost,
      textarea,
      input {
        width: 100%;
        min-width: 0;
        border: 1px solid rgb(var(--surface-100));
        border-radius: 14px;
        background: rgb(var(--surface-300));
        color: rgb(var(--text-primary));
        padding: 12px;
        font: inherit;
      }
      .ghost { position: relative; color: rgb(var(--text-muted)); font-style: italic; overflow-wrap: anywhere; }
      .ghost-badge {
        position: absolute;
        inset-block-start: 8px;
        inset-inline-end: 8px;
        border-radius: 999px;
        background: rgb(var(--warning) / 0.12);
        color: rgb(var(--warning));
        padding: 2px 8px;
        font-size: 10px;
        font-style: normal;
        font-weight: 700;
      }
      textarea { min-height: 96px; resize: vertical; }
      textarea:focus-visible,
      input:focus-visible,
      button:focus-visible { outline: 3px solid rgb(var(--primary)); outline-offset: 2px; }
      .diff { border-radius: 14px; background: rgb(var(--surface-200)); padding: 12px; font-size: 14px; }
      .removed { color: rgb(var(--text-secondary)); text-decoration: line-through; }
      .added { color: rgb(var(--primary)); font-weight: 700; }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 8px; }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        background: transparent;
        color: rgb(var(--text-primary));
        font: inherit;
        font-weight: 700;
      }
      .tag { min-height: 36px; border: 1px solid rgb(var(--surface-100)); padding: 6px 10px; color: rgb(var(--text-secondary)); font-size: 11px; }
      .send { background: linear-gradient(90deg, rgb(var(--primary)), rgb(var(--secondary))); color: rgb(var(--on-fill)); }
      @media (max-width: 900px) { .states { grid-template-columns: minmax(0, 390px); } }
      @media (max-width: 420px) {
        body { padding: 12px; }
        .correction-modal-preview { padding: 8px; }
        footer button { flex: 1 1 auto; }
      }
    </style>
  </head>
  <body>
    <div class="states">
      <section>
        <div class="label">Light / 390px mobile</div>
        <div class="correction-modal-preview light mobile" aria-label="Correction modal light mobile preview">
          <article class="modal" role="dialog" aria-labelledby="correction-mobile-title">
            <header>
              <h1 id="correction-mobile-title">✏️ Correct sentence</h1>
              <button aria-label="Cancel">✕</button>
            </header>
            <div class="body">
              <div>
                <span class="field-label">Original</span>
                <div class="ghost" dir="auto">“I goes to market yesterday.”<span class="ghost-badge">Original</span></div>
              </div>
              <label>
                <span class="field-label">Corrected sentence</span>
                <textarea readonly dir="auto">I went to the market yesterday.</textarea>
              </label>
              <div>
                <span class="field-label">Live diff preview</span>
                <div class="diff"><span class="removed">goes</span> <span class="added">went</span></div>
              </div>
              <label>
                <span class="field-label">Explanation · optional</span>
                <input readonly value="Use the past tense for yesterday." dir="auto" />
              </label>
              <div class="tags" aria-label="Quick explanation tags">
                <button class="tag">+ Grammar</button>
                <button class="tag">+ Natural phrasing</button>
              </div>
            </div>
            <footer>
              <button>Cancel</button>
              <button class="send">Send correction</button>
            </footer>
          </article>
        </div>
      </section>

      <section>
        <div class="label">Dark / wide</div>
        <div class="correction-modal-preview dark wide" aria-label="Correction modal dark wide preview">
          <article class="modal" role="dialog" aria-labelledby="correction-wide-title">
            <header>
              <h1 id="correction-wide-title">✏️ Correct sentence</h1>
              <button aria-label="Cancel">✕</button>
            </header>
            <div class="body">
              <div>
                <span class="field-label">Original</span>
                <div class="ghost" dir="auto">“She study English every night.”<span class="ghost-badge">Original</span></div>
              </div>
              <label>
                <span class="field-label">Corrected sentence</span>
                <textarea readonly dir="auto">She studies English every night.</textarea>
              </label>
              <div>
                <span class="field-label">Live diff preview</span>
                <div class="diff"><span class="removed">study</span> <span class="added">studies</span></div>
              </div>
              <label>
                <span class="field-label">Explanation · optional</span>
                <input readonly value="Third-person singular takes -s." dir="auto" />
              </label>
              <div class="tags" aria-label="Quick explanation tags">
                <button class="tag">+ Grammar</button>
                <button class="tag">+ Vocabulary</button>
              </div>
            </div>
            <footer>
              <button>Cancel</button>
              <button class="send">Send correction</button>
            </footer>
          </article>
        </div>
      </section>
    </div>
  </body>
</html>
