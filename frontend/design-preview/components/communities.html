<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay - Communities</title>
    <style>
      :root {
        --surface-100: 228, 231, 237;
        --surface-200: 253, 253, 254;
        --surface-300: 241, 243, 247;
        --surface-500: 246, 247, 250;
        --text-primary: 18, 21, 28;
        --text-secondary: 74, 81, 99;
        --primary: 198, 82, 48;
        --danger: 217, 58, 58;
        --on-fill: 255, 255, 255;
        --shadow: 16, 19, 28;
      }
      .dark {
        --surface-100: 46, 52, 68;
        --surface-200: 30, 35, 48;
        --surface-300: 35, 40, 56;
        --surface-500: 18, 21, 28;
        --text-primary: 243, 244, 247;
        --text-secondary: 180, 186, 201;
        --primary: 255, 122, 82;
        --danger: 255, 107, 107;
        --on-fill: 18, 21, 28;
        --shadow: 0, 0, 0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: rgb(var(--surface-100));
        color: rgb(var(--text-primary));
        font-family: system-ui, sans-serif;
      }
      .states {
        display: grid;
        gap: 24px;
        grid-template-columns: minmax(0, 390px) minmax(0, 720px);
        align-items: start;
        justify-content: center;
      }
      .state {
        background: rgb(var(--surface-500));
        padding: 24px 16px;
        border-radius: 20px;
      }
      .dark { color-scheme: dark; }
      h1 { margin: 0 0 24px; font-size: 28px; }
      .form,
      .community-card {
        border: 1px solid rgb(var(--surface-100));
        background: rgb(var(--surface-200));
        border-radius: 16px;
        box-shadow: 0 8px 24px rgb(var(--shadow) / 0.08);
      }
      .form {
        display: grid;
        gap: 12px;
        padding: 16px;
      }
      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid rgb(var(--surface-100));
        background: rgb(var(--surface-300));
        color: rgb(var(--text-primary));
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid rgb(var(--primary));
        outline-offset: 2px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .create { width: 100%; background: rgb(var(--primary)); color: rgb(var(--on-fill)); }
      .delete { width: 100%; background: transparent; color: rgb(var(--danger)); }
      .grid { display: grid; gap: 12px; margin-top: 20px; }
      .community-card { min-width: 0; padding: 16px; }
      .row { display: flex; min-width: 0; flex-direction: column; gap: 12px; }
      .name,
      .description { overflow-wrap: anywhere; }
      .name { min-width: 0; font-weight: 700; }
      .description { margin: 8px 0 0; color: rgb(var(--text-secondary)); font-size: 14px; }
      .label { margin-bottom: 8px; color: rgb(var(--text-secondary)); font-size: 12px; font-weight: 700; text-transform: uppercase; }
      @media (min-width: 640px) {
        .row { flex-direction: row; align-items: flex-start; justify-content: space-between; }
        .delete { width: auto; }
      }
      @media (min-width: 720px) {
        .desktop .form { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) auto; align-items: end; }
        .desktop .create { width: auto; }
        .desktop .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 900px) {
        .states { grid-template-columns: minmax(0, 390px); }
      }
    </style>
  </head>
  <body>
    <div class="states">
      <section>
        <div class="label">Light / 390px mobile</div>
        <main class="state" aria-labelledby="communities-title-mobile">
          <h1 id="communities-title-mobile">Communities</h1>
          <div class="form">
            <label>
              <span class="sr-only">Community name</span>
              <input value="Japanese learners" readonly />
            </label>
            <label>
              <span class="sr-only">Community description</span>
              <input value="Weekly language practice" readonly />
            </label>
            <button class="create">Create</button>
          </div>
          <div class="grid">
            <article class="community-card">
              <div class="row">
                <span class="name">Japanese learners</span>
                <button class="delete" aria-label="Delete Japanese learners">Delete</button>
              </div>
              <p class="description">Weekly language practice</p>
            </article>
          </div>
        </main>
      </section>

      <section>
        <div class="label">Dark / wide</div>
        <main class="state dark desktop" aria-labelledby="communities-title-desktop">
          <h1 id="communities-title-desktop">Communities</h1>
          <div class="form">
            <label>
              <span class="sr-only">Community name</span>
              <input value="Japanese learners" readonly />
            </label>
            <label>
              <span class="sr-only">Community description</span>
              <input value="Weekly language practice" readonly />
            </label>
            <button class="create">Create</button>
          </div>
          <div class="grid">
            <article class="community-card">
              <div class="row">
                <span class="name">Japanese learners</span>
                <button class="delete" aria-label="Delete Japanese learners">Delete</button>
              </div>
              <p class="description">Weekly language practice</p>
            </article>
            <article class="community-card">
              <div class="row">
                <span class="name">Spanish exchange</span>
                <button class="delete" aria-label="Delete Spanish exchange">Delete</button>
              </div>
              <p class="description">Conversation and meetup planning</p>
            </article>
          </div>
        </main>
      </section>
    </div>
  </body>
</html>
