<div class="flex h-full flex-col bg-[#121212] text-white">
  <header class="border-b border-white/10 px-4 py-3">
    <h2 class="text-base font-semibold">{{ 'rooms.roomChat.title' | t }}</h2>
  </header>
  <div #messagesContainer class="flex-1 overflow-y-auto p-4">
    @if (messages().length === 0) {
      <p class="text-sm text-slate-400">{{ 'rooms.roomChat.empty' | t }}</p>
    } @else {
      @for (msg of messages(); track (msg.id ?? msg.sender_id ?? $index)) {
        <div class="mb-3 flex ps-2">
          <div class="max-w-[80%] rounded-lg bg-white/10 px-3 py-2">
            <p class="text-sm whitespace-pre-wrap">{{ msg.content }}</p>
          </div>
        </div>
      }
    }
  </div>
  <form class="flex items-center gap-2 border-t border-white/10 p-3" (submit)="sendMessage()">
    <input
      type="text"
      [value]="inputText()"
      (input)="onInput($event)"
      placeholder="{{ 'rooms.roomChat.placeholder' | t }}"
      class="flex-1 rounded-full bg-white/10 px-4 py-2 text-sm outline-none focus:bg-white/20"
     [attr.aria-label]=\"'rooms.roomChat.send' | t\"/>
    <button
      type="submit"
      class="rounded-full bg-purple-500 px-4 py-2 text-sm font-medium text-white disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="!inputText().trim()"
     [attr.aria-label]="'rooms.roomChat.send' | t">
      {{ 'rooms.roomChat.send' | t }}
    </button>
  </form>
</div>
