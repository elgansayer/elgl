<div class="max-w-2xl mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Edit Profile</h1>

  @if (loading()) {
    <div class="text-center py-8">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  }

  @if (error(); as err) {
    <div class="alert alert-error mb-4">
      <span>{{ err }}</span>
    </div>
  }

  @if (success()) {
    <div class="alert alert-success mb-4">
      <span>Profile updated successfully.</span>
    </div>
  }

  @if (profile(); as p) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Display Name -->
      <div>
        <label for="display_name" class="block text-sm font-medium mb-1">Display Name</label>
        <input
          id="display_name"
          formControlName="display_name"
          type="text"
          class="input input-bordered w-full"
          maxlength="50"
        />
      </div>

      <!-- Native Language -->
      <div>
        <label for="native_language" class="block text-sm font-medium mb-1">Native Language (ISO 639-1)</label>
        <input
          id="native_language"
          formControlName="native_language"
          type="text"
          class="input input-bordered w-full"
          required
        />
      </div>

      <!-- Target Languages -->
      <div>
        <label for="target_languages" class="block text-sm font-medium mb-1">Target Languages (comma separated)</label>
        <input
          id="target_languages"
          formControlName="target_languages"
          type="text"
          class="input input-bordered w-full"
          required
        />
        <p class="text-xs text-text-muted mt-1">Free users: max 1 language. VIP: up to 3 languages.</p>
      </div>

      <!-- Bio -->
      <div>
        <label for="bio_text" class="block text-sm font-medium mb-1">Bio</label>
        <textarea
          id="bio_text"
          formControlName="bio_text"
          class="textarea textarea-bordered w-full"
          rows="3"
          maxlength="500"
        ></textarea>
      </div>

      <!-- Privacy Settings -->
      <fieldset class="border border-base-300 rounded p-4">
        <legend class="text-sm font-medium">Privacy Settings</legend>
        <div class="form-control">
          <label class="label cursor-pointer">
            <span class="label-text">Hide Age</span>
            <input type="checkbox" formControlName="privacy_hide_age" class="checkbox" />
          </label>
        </div>
        <div class="form-control">
          <label class="label cursor-pointer">
            <span class="label-text">Hide Location</span>
            <input type="checkbox" formControlName="privacy_hide_location" class="checkbox" />
          </label>
        </div>
        <div class="form-control">
          <label class="label cursor-pointer">
            <span class="label-text">Hide from Search</span>
            <input type="checkbox" formControlName="privacy_hide_from_search" class="checkbox" />
          </label>
        </div>
      </fieldset>

      <!-- Submit -->
      <div class="flex justify-end">
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <span class="loading loading-spinner"></span>
          }
          Save Changes
        </button>
      </div>
    </form>
  }
</div>
