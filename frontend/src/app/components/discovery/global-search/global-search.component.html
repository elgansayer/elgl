<div
  class="flex flex-col gap-4 rounded-card border border-surface-100 border-s-4 border-s-secondary bg-surface-200 p-4 shadow-card sm:p-5 lg:p-6"
  role="search"
  [attr.aria-label]="'discovery.global_search_title' | t"
>
  <h2 class="text-lg font-bold text-text-primary sm:text-xl">
    {{ 'discovery.global_search_title' | t }}
  </h2>

  <div class="flex flex-col gap-1.5">
    <label for="global-nativeLanguages" class="text-sm font-medium text-text-secondary">
      {{ 'discovery.native_languages' | t }}
    </label>
    <hlm-native-select
      selectId="global-nativeLanguages"
      [value]="nativeLanguages()"
      (valueChange)="nativeLanguages.set($event ?? '')"
      class="w-full"
      selectClass="min-h-11 rounded-app border-surface-100 bg-surface-50 text-text-primary hover:bg-surface-100 focus-visible:border-primary focus-visible:ring-primary/40"
    >
      <option value="">{{ 'discovery.any_language' | t }}</option>
      @for (lang of availableLanguages(); track lang.code) {
        <option [value]="lang.code">{{ lang.flag }} {{ lang.translatedName }}</option>
      }
    </hlm-native-select>
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="global-targetLanguage" class="text-sm font-medium text-text-secondary">
      {{ 'discovery.target_language' | t }}
    </label>
    <hlm-native-select
      selectId="global-targetLanguage"
      [value]="targetLanguage()"
      (valueChange)="targetLanguage.set($event ?? '')"
      class="w-full"
      selectClass="min-h-11 rounded-app border-surface-100 bg-surface-50 text-text-primary hover:bg-surface-100 focus-visible:border-primary focus-visible:ring-primary/40"
    >
      <option value="">{{ 'discovery.any_language' | t }}</option>
      @for (lang of availableLanguages(); track lang.code) {
        <option [value]="lang.code">{{ lang.flag }} {{ lang.translatedName }}</option>
      }
    </hlm-native-select>
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="global-proficiencyLevel" class="text-sm font-medium text-text-secondary">
      {{ 'discovery.proficiency_level' | t }}
    </label>
    <hlm-native-select
      selectId="global-proficiencyLevel"
      [value]="level()"
      (valueChange)="level.set($event ?? '')"
      class="w-full"
      selectClass="min-h-11 rounded-app border-surface-100 bg-surface-50 text-text-primary hover:bg-surface-100 focus-visible:border-primary focus-visible:ring-primary/40"
    >
      <option value="">{{ 'discovery.any_level' | t }}</option>
      @for (lvl of levels; track lvl.value) {
        <option [value]="lvl.value">{{ lvl.key | t }}</option>
      }
    </hlm-native-select>
  </div>

  <div
    class="flex min-h-11 flex-wrap items-center gap-3 rounded-app border border-surface-100 bg-surface-50 px-3 py-2.5"
  >
    <hlm-checkbox
      [inputId]="audioIntroId"
      [checked]="hasAudioIntro()"
      (checkedChange)="onAudioIntroChange($event)"
    />
    <label [for]="audioIntroId" class="text-sm font-medium text-text-secondary">
      {{ 'audioIntro.title' | t }}
    </label>
  </div>

  <button
    hlmBtn
    type="button"
    size="touch"
    (click)="applyFilters()"
    class="mt-1 w-full bg-primary font-semibold text-on-fill hover:bg-primary/90 sm:text-base"
  >
    {{ 'discovery.search_button' | t }}
  </button>
</div>

<div class="mt-4">
  <app-topic-following />
</div>

<app-recommended-for-you-carousel />
<span id="discovery-results" class="sr-only" aria-hidden="true"></span>
