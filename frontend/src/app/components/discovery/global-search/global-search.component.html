<div class="flex flex-col gap-4 p-4 bg-surface rounded-xl shadow-sm border border-surface-100" role="search" [attr.aria-label]="'discovery.global_search_title' | t">
  <h2 class="text-lg font-bold text-text-primary" id="global-search-title">
    {{ 'discovery.global_search_title' | t }}
  </h2>

  <!-- Native Language Dropdown -->
  <div class="flex flex-col gap-1.5">
    <label for="global-nativeLanguages" class="text-sm font-medium text-text-primary">
      {{ 'discovery.native_languages' | t }}
    </label>
    <select
      id="global-nativeLanguages"
      [value]="nativeLanguages()"
      (change)="nativeLanguages.set($any($event.target).value)"
      class="w-full p-2.5 rounded-lg border border-surface-100 bg-surface-200 text-text-primary focus:ring-2 focus:ring-blue-500 outline-none"
    >
      <option value="">{{ 'discovery.any_language' | t }}</option>
      @for (lang of availableLanguages(); track lang.code) {
        <option [value]="lang.code">{{ lang.flag }} {{ lang.translatedName }}</option>
      }
    </select>
  </div>

  <!-- Target Language Dropdown -->
  <div class="flex flex-col gap-1.5">
    <label for="global-targetLanguage" class="text-sm font-medium text-text-primary">
      {{ 'discovery.target_language' | t }}
    </label>
    <select
      id="global-targetLanguage"
      [value]="targetLanguage()"
      (change)="targetLanguage.set($any($event.target).value)"
      class="w-full p-2.5 rounded-lg border border-surface-100 bg-surface-200 text-text-primary focus:ring-2 focus:ring-blue-500 outline-none"
    >
      <option value="">{{ 'discovery.any_language' | t }}</option>
      @for (lang of availableLanguages(); track lang.code) {
        <option [value]="lang.code">{{ lang.flag }} {{ lang.translatedName }}</option>
      }
    </select>
  </div>

  <!-- Level Dropdown -->
  <div class="flex flex-col gap-1.5">
    <label for="global-proficiencyLevel" class="text-sm font-medium text-text-primary">
      {{ 'discovery.proficiency_level' | t }}
    </label>
    <select
      id="global-proficiencyLevel"
      [value]="level()"
      (change)="level.set($any($event.target).value)"
      class="w-full p-2.5 rounded-lg border border-surface-100 bg-surface-200 text-text-primary focus:ring-2 focus:ring-blue-500 outline-none"
    >
      <option value="">{{ 'discovery.any_level' | t }}</option>
      @for (lvl of levels; track lvl.value) {
        <option [value]="lvl.value">{{ lvl.key | t }}</option>
      }
    </select>
  </div>

  <button
    (click)="applyFilters()"
    class="mt-2 w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors focus:ring-2 focus:ring-accent-500 focus:ring-offset-2"
    [attr.aria-label]="'discovery.search_button' | t"
  >
    {{ 'discovery.search_button' | t }}
  </button>
</div>
