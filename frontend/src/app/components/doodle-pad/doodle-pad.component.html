<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-200 dark:border-slate-700 max-w-2xl mx-auto">
  <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3 mb-4">
    <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
      <span>🎨 Interactive Doodle Pad</span>
    </h3>
    <button (click)="cancel()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold text-xl">✕</button>
  </div>

  <div class="border-2 border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden bg-white shadow-inner flex justify-center">
    <canvas
      #canvas
      (mousedown)="startDrawing($event)"
      (mousemove)="draw($event)"
      (mouseup)="stopDrawing()"
      (mouseleave)="stopDrawing()"
      (touchstart)="startDrawing($event)"
      (touchmove)="draw($event)"
      (touchend)="stopDrawing()"
      class="cursor-crosshair max-w-full h-auto bg-white"
    ></canvas>
  </div>

  <!-- Tools bar -->
  <div class="flex flex-wrap items-center justify-between gap-4 mt-4 pt-3 border-t border-slate-200 dark:border-slate-700">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Colour:</span>
      <button
        *ngFor="let color of colors"
        (click)="setColor(color)"
        class="w-7 h-7 rounded-full border-2 transition-transform hover:scale-110"
        [ngStyle]="{'background-color': color}"
        [ngClass]="currentColor === color ? 'border-primary ring-2 ring-primary/40 scale-110' : 'border-slate-300'"
      ></button>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Brush:</span>
      <button
        *ngFor="let w of [2, 4, 8, 14]"
        (click)="setBrushWidth(w)"
        class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all"
        [ngClass]="brushWidth === w ? 'bg-primary text-white shadow' : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200'"
      >
        {{ w }}px
      </button>
    </div>
  </div>

  <!-- Actions -->
  <div class="flex justify-between items-center mt-6">
    <button
      (click)="clearCanvas()"
      class="px-4 py-2 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-xl text-sm font-bold hover:bg-red-200 transition-colors"
    >
      🗑️ Clear Canvas
    </button>

    <div class="flex gap-3">
      <button
        (click)="cancel()"
        class="px-5 py-2 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-sm font-bold hover:bg-slate-300 transition-colors"
      >
        Cancel
      </button>
      <button
        (click)="save()"
        class="px-6 py-2 bg-primary hover:bg-primary-dark text-white rounded-xl text-sm font-bold shadow-md transition-colors flex items-center gap-2"
      >
        <span>📤 Send Doodle</span>
      </button>
    </div>
  </div>
</div>
