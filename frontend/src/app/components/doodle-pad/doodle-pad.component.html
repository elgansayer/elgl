<div class="app-card p-6 max-w-2xl mx-auto shadow-lift">
  <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
    <h3 class="app-section-title flex items-center gap-2">
      <span>🎨 Interactive Doodle Pad</span>
    </h3>
    <button
      (click)="cancel()"
      class="text-slate-400 hover:text-slate-600 font-bold text-xl"
    >
      ✕
    </button>
  </div>

  <div
    class="border-2 border-slate-200 rounded-app overflow-hidden bg-white shadow-inner flex justify-center"
  >
    <canvas
      #canvas
      (mousedown)="startDrawing($event)"
      (mousemove)="draw($event)"
      (mouseup)="stopDrawing()"
      (mouseleave)="stopDrawing()"
      (touchstart)="startDrawing($event)"
      (touchmove)="draw($event)"
      (touchend)="stopDrawing()"
      class="cursor-crosshair max-w-full h-auto bg-white"
    ></canvas>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-4 mt-4 pt-3 border-t border-slate-200">
    <div class="flex items-center gap-2">
      <span class="app-muted font-bold uppercase tracking-wider">Colour</span>
      @for (color of colors; track color) {
        <button
          (click)="setColor(color)"
          [class]="
            'w-7 h-7 rounded-full border-2 transition-transform hover:scale-110 ' +
            (currentColor === color
              ? 'border-primary ring-2 ring-primary/40 scale-110'
              : 'border-slate-300')
          "
          [style.background-color]="color"
        ></button>
      }
    </div>

    <div class="flex items-center gap-2">
      <span class="app-muted font-bold uppercase tracking-wider">Brush</span>
      @for (w of [2, 4, 8, 14]; track w) {
        <button
          (click)="setBrushWidth(w)"
          [class]="
            'px-2.5 py-1 rounded-lg text-xs font-bold transition-all ' +
            (brushWidth === w
              ? 'bg-primary text-white shadow'
              : 'bg-slate-100 text-slate-700 hover:bg-slate-200')
          "
        >
          {{ w }}px
        </button>
      }
    </div>
  </div>

  <div class="flex justify-between items-center mt-6">
    <button
      (click)="clearCanvas()"
      class="app-button-secondary bg-red-100 text-red-700 px-4 py-2 text-sm hover:bg-red-200"
    >
      🗑️ Clear canvas
    </button>

    <div class="flex gap-3">
      <button (click)="cancel()" class="app-button-secondary px-5 py-2 text-sm">
        Cancel
      </button>
      <button (click)="save()" class="app-button-primary px-6 py-2 text-sm flex items-center gap-2">
        <span>📤 Send doodle</span>
      </button>
    </div>
  </div>
</div>
