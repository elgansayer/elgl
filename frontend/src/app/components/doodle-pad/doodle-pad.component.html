<div class="app-card p-6 max-w-2xl mx-auto shadow-lift">
  <div class="flex items-center justify-between border-b border-surface-100 pb-3 mb-4">
    <h3 class="app-section-title flex items-center gap-2">
      <span>{{ 'doodle.title' | t }}</span>
    </h3>
    <button aria-label="Cancel doodle" (click)="cancel()" class="text-text-muted hover:text-text-secondary font-bold text-xl">
      ✕
    </button>
  </div>

  <div
    class="border-2 border-surface-100 rounded-app overflow-hidden bg-surface-200 shadow-inner flex justify-center"
  >
    <canvas
      #canvas
      (mousedown)="startDrawing($event)"
      (mousemove)="draw($event)"
      (mouseup)="stopDrawing()"
      (mouseleave)="stopDrawing()"
      (touchstart)="startDrawing($event)"
      (touchmove)="draw($event)"
      (touchend)="stopDrawing()"
      class="cursor-crosshair max-w-full h-auto bg-surface-200"
    ></canvas>
  </div>

  <div
    class="flex flex-wrap items-center justify-between gap-4 mt-4 pt-3 border-t border-surface-100"
  >
    <div class="flex items-center gap-2">
      <span class="app-muted font-bold uppercase tracking-wider">{{
        'doodle.colorLabel' | t
      }}</span>
      @for (color of colors; track color) {
        <button [attr.aria-label]="'Select ' + color"
          (click)="setColor(color)"
          [class]="
            'w-7 h-7 rounded-full border-2 transition-transform hover:scale-110 ' +
            (currentColor === color
              ? 'border-primary ring-2 ring-primary/40 scale-110'
              : 'border-surface-100')
          "
          [style.background-color]="color"
        ></button>
      }
    </div>

    <div class="flex items-center gap-2">
      <span class="app-muted font-bold uppercase tracking-wider">{{
        'doodle.brushLabel' | t
      }}</span>
      @for (w of [2, 4, 8, 14]; track w) {
        <button
          (click)="setBrushWidth(w)"
          [class]="
            'px-2.5 py-1 rounded-lg text-xs font-bold transition-all ' +
            (brushWidth === w
              ? 'bg-primary text-white shadow'
              : 'bg-surface-100 text-text-primary hover:bg-surface-100')
          "
        >
          {{ w }}px
        </button>
      }
    </div>
  </div>

  <div class="flex justify-between items-center mt-6">
    <button
      (click)="clearCanvas()"
      class="app-button-secondary bg-red-500/20 text-red-400 px-4 py-2 text-sm hover:bg-red-500/30"
    >
      {{ 'doodle.clearBtn' | t }}
    </button>

    <div class="flex gap-3">
      <button (click)="cancel()" class="app-button-secondary px-5 py-2 text-sm">
        {{ 'doodle.cancelBtn' | t }}
      </button>
      <button (click)="save()" class="app-button-primary px-6 py-2 text-sm flex items-center gap-2">
        <span>{{ 'doodle.sendBtn' | t }}</span>
      </button>
    </div>
  </div>
</div>
