<div class="p-4 max-w-4xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Sticker Store</h2>
    <app-pill colour="warning" size="md">
      <span class="flex items-center gap-1">
        🪙 {{ userCoins() }} Coins
      </span>
    </app-pill>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    @for (sticker of stickers(); track sticker.id) {
      <app-card variant="elevated" padding="md" class="flex flex-col items-center text-center">
        <div class="relative w-24 h-24 mb-3">
          <img [src]="sticker.imageUrl" [alt]="sticker.name" class="w-full h-full object-contain drop-shadow-md" />
          @if (sticker.isPremium) {
            <div class="absolute -top-2 -end-2">
              <app-pill colour="primary" size="sm" label="VIP"></app-pill>
            </div>
          }
        </div>
        
        <h3 class="font-semibold text-slate-700 dark:text-slate-200 mb-2">{{ sticker.name }}</h3>
        
        <div class="mt-auto w-full">
          <app-button-secondary 
            size="sm" 
            class="w-full"
            [disabled]="userCoins() < sticker.coinPrice"
            (clicked)="purchaseSticker(sticker)">
            🪙 {{ sticker.coinPrice }}
          </app-button-secondary>
        </div>
      </app-card>
    }
  </div>
</div>
