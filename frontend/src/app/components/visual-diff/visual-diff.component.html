<div class="bg-amber-50/50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-800/60 rounded-2xl p-4 shadow-sm my-2">
  <div class="flex items-center justify-between border-b border-amber-200/60 dark:border-amber-800/40 pb-2 mb-3">
    <span class="text-xs font-extrabold text-amber-800 dark:text-amber-300 uppercase tracking-wider flex items-center gap-1.5">
      <span>✏️ Language Correction Diff</span>
    </span>
    <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400">Intl.Segmenter Word Engine</span>
  </div>

  <div class="text-sm md:text-base leading-relaxed break-words font-medium">
    <span *ngFor="let seg of segments()">
      <span *ngIf="seg.type === 'unchanged'" class="text-slate-800 dark:text-slate-200">{{ seg.text }}</span>
      <span
        *ngIf="seg.type === 'removed'"
        class="line-through text-red-600 dark:text-red-400 bg-red-100 dark:bg-red-900/40 px-1 py-0.5 rounded mx-0.5 select-none"
      >{{ seg.text }}</span>
      <span
        *ngIf="seg.type === 'added'"
        class="text-emerald-800 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/50 font-bold px-1 py-0.5 rounded mx-0.5 shadow-sm"
      >{{ seg.text }}</span>
    </span>
  </div>

  <div *ngIf="explanation" class="mt-3 pt-3 border-t border-amber-200/60 dark:border-amber-800/40 text-xs text-slate-600 dark:text-slate-300 bg-white/70 dark:bg-slate-900/50 p-2.5 rounded-xl">
    <span class="font-bold text-amber-900 dark:text-amber-200 block mb-0.5">💡 Tutor Explanation:</span>
    {{ explanation }}
  </div>
</div>
