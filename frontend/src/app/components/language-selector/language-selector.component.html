<div class="relative" (keydown.escape)="close()">
  <button
    hlmBtn
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    class="w-full flex items-center justify-between gap-2 bg-surface-200 border border-surface-300 rounded-xl px-4 py-2.5 text-sm font-medium text-text-primary transition-colors hover:bg-surface-300 cursor-pointer"
    [attr.aria-label]="'settings.changeLanguage' | t"
  >
    <span class="flex items-center gap-2">
      <span class="text-lg leading-none">{{ currentLanguage().flag }}</span>
      <span>{{ currentLanguage().name }}</span>
    </span>
    <span class="text-xs text-text-secondary uppercase tracking-wide">{{
      'settings.changeLanguage' | t
    }}</span>
    <span class="text-xs text-text-secondary">{{ isOpen() ? '▲' : '▼' }}</span>
  </button>

  @if (isOpen()) {
    <div
      class="absolute start-0 z-30 mt-2 w-full overflow-hidden rounded-2xl border border-surface-200 bg-surface-100 shadow-xl"
      role="listbox"
      [attr.aria-label]="'settings.changeLanguage' | t"
    >
      @if (hasError()) {
        <p
          role="alert"
          class="m-3 rounded-card border border-danger/30 bg-danger/10 p-3 text-sm text-danger"
        >
          {{ 'common.error_generic' | t }}
        </p>
      }
      <div class="p-3 border-b border-surface-200">
        <input
          hlmInput
          type="search"
          [value]="searchQuery()"
          (input)="onSearch($event)"
          placeholder="{{ 'lang.searchPlaceholder' | t }}"
          class="w-full bg-surface-200 border border-surface-300 rounded-lg px-3 py-2 text-sm text-text-primary outline-none focus:ring-2 focus:ring-primary/30 placeholder-text-secondary"
          aria-label="{{ 'lang.searchPlaceholder' | t }}"
        />
      </div>
      <ul class="max-h-72 overflow-y-auto py-1" role="presentation">
        @for (lang of filteredLanguages(); track lang.code) {
          <li role="none">
            <button
              hlmBtn
              type="button"
              role="option"
              [attr.aria-selected]="lang.code === currentLang()"
              (click)="selectLanguage(lang.code)"
              [disabled]="isChanging()"
              class="w-full flex items-center justify-between gap-2 text-start px-4 py-2.5 text-sm hover:bg-surface-200 transition-colors cursor-pointer"
              [attr.aria-label]="getLanguageAriaLabel(lang)"
            >
              <span class="flex items-center gap-2">
                <span class="text-base leading-none">{{ lang.flag }}</span>
                <span>
                  <span class="block font-medium text-text-primary">{{ lang.name }}</span>
                  <span class="block text-xs text-text-secondary">{{ lang.nativeName }}</span>
                </span>
              </span>
              @if (lang.code === currentLang()) {
                <span class="text-xs font-semibold text-primary">{{ 'common.selected' | t }}</span>
              }
            </button>
          </li>
        }
      </ul>
    </div>
  }
</div>
