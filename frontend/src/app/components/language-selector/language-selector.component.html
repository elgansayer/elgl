<div class="relative inline-block">
  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleModal()"
    class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold text-sm hover:bg-slate-200 dark:hover:bg-slate-600 transition-all border border-slate-300 dark:border-slate-600 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen()"
    aria-label="Select App Language"
  >
    <span class="text-base">🌐</span>
    <span class="uppercase tracking-wider">{{ i18n.currentLang() }}</span>
    <span class="text-xs text-slate-500 dark:text-slate-400">▼</span>
  </button>

  <!-- Modal Overlay -->
  @if (isOpen()) {
    <div
      class="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fadeIn"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lang-modal-title"
    >
      <div
        class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden"
      >
        <!-- Modal Header -->
        <div
          class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80"
        >
          <div class="flex items-center gap-3">
            <span class="text-2xl">🌍</span>
            <div>
              <h3 id="lang-modal-title" class="text-lg font-black text-slate-900 dark:text-white">
                {{ 'lang.selectTitle' | t }}
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">
                {{ 'lang.label' | t }}: <strong class="text-primary uppercase">{{ i18n.currentLang() }}</strong>
              </p>
            </div>
          </div>
          <button
            type="button"
            (click)="closeModal()"
            class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
            aria-label="Close dialog"
          >
            ✕
          </button>
        </div>

        <!-- Modal Body -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
          <!-- Quick Select Language Grid -->
          <div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
              @for (lang of i18n.availableLanguages; track lang.code) {
                <button
                  type="button"
                  (click)="selectLanguage(lang.code)"
                  [class]="'flex items-center gap-2.5 p-3 rounded-2xl border text-start transition-all ' + (i18n.currentLang() === lang.code ? 'bg-primary/10 border-primary text-primary font-black shadow-sm' : 'bg-slate-50 dark:bg-slate-700/50 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700')"
                >
                  <span class="text-2xl shrink-0">{{ lang.flag }}</span>
                  <div class="min-w-0 flex-1">
                    <div class="text-sm font-bold truncate">{{ lang.name }}</div>
                    <div class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ lang.nativeName }}</div>
                  </div>
                </button>
              }
            </div>
          </div>

          <!-- Custom / ANY Language Input Box -->
          <div
            class="bg-gradient-to-r from-primary/10 via-purple-500/10 to-primary/10 p-5 rounded-2xl border border-primary/20 space-y-3"
          >
            <div class="flex items-center gap-2">
              <span class="text-lg">✨</span>
              <span class="text-sm font-extrabold text-slate-900 dark:text-white">
                {{ 'lang.selectTitle' | t }}
              </span>
            </div>
            <div class="flex gap-2">
              <input
                type="text"
                [value]="customCode()"
                (input)="onCustomCodeInput($event)"
                (keydown.enter)="applyCustomLanguage()"
                [placeholder]="'lang.customPlaceholder' | t"
                class="flex-1 px-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-sm font-medium text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary shadow-inner"
              />
              <button
                type="button"
                (click)="applyCustomLanguage()"
                [disabled]="isSwitching()"
                class="px-5 py-2.5 rounded-xl bg-primary text-white font-bold text-sm hover:bg-primary/90 transition-all shadow-md shrink-0 disabled:opacity-50"
              >
                @if (isSwitching()) {
                  <span>⏳</span>
                } @else {
                  <span>{{ 'lang.applyCustom' | t }}</span>
                }
              </button>
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div
          class="px-6 py-3 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-700 flex justify-end"
        >
          <button
            type="button"
            (click)="closeModal()"
            class="px-5 py-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-sm hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors"
          >
            ✕
          </button>
        </div>
      </div>
    </div>
  }
</div>
