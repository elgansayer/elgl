<div class="p-4">
  <h2 class="text-lg font-semibold">{{ 'notification_customization.title' | t }}</h2>

  @if (loading()) {
    <p>{{ 'common.loading' | t }}</p>
  } @else {
    <form (ngSubmit)="save()" class="mt-4 space-y-4">
      <div>
        <label for="customToneUrl" class="block text-sm font-medium">
          {{ 'notification_customization.tone_url_label' | t }}
        </label>
        <input
          hlmInput
          id="customToneUrl"
          type="url"
          [value]="customToneUrl()"
          (input)="onToneChange($event)"
          class="mt-1 block w-full rounded-md border-s border-surface-300 bg-surface px-3 py-2 text-sm"
          placeholder="{{ 'notification_customization.tone_url_placeholder' | t }}"
        />
      </div>

      <div>
        <label for="vibrationPattern" class="block text-sm font-medium">
          {{ 'notification_customization.vibration_pattern_label' | t }}
        </label>
        <input
          hlmInput
          id="vibrationPattern"
          type="text"
          [value]="vibrationPattern()"
          (input)="onVibrationChange($event)"
          class="mt-1 block w-full rounded-md border-s border-surface-300 bg-surface px-3 py-2 text-sm"
          placeholder="{{ 'notification_customization.vibration_pattern_placeholder' | t }}"
        />
      </div>

      @if (error()) {
        <p class="text-error">{{ error() }}</p>
      }

      @if (saved()) {
        <p class="text-success">{{ 'common.saved' | t }}</p>
      }

      <button
        hlmBtn
        type="submit"
        [disabled]="saving()"
        class="rounded-md bg-primary px-4 py-2 text-on-fill"
        [attr.aria-label]="'common.save' | t"
      >
        {{ 'common.save' | t }}
      </button>
    </form>
  }
</div>
