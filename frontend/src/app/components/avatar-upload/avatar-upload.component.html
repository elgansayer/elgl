<div class="ps-4 pe-4 space-y-4">
  <h2 class="text-lg font-heading">{{ 'avatar.upload_title' | t }}</h2>

  @if (!previewUrl()) {
    <label
      class="inline-flex items-center justify-center w-20 h-20 rounded-full border-2 border-dashed border-slate-500 cursor-pointer hover:border-blue-400 transition"
    >
      <input type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" />
      <svg
        class="w-6 h-6 text-slate-300"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 6v6m0 0v6m0-6h6m-6 0H6"
        />
      </svg>
    </label>
  } @else {
    <div
      class="relative inline-block max-w-sm w-full overflow-hidden"
      (mousedown)="onImageMouseDown($event)"
      (mousemove)="onImageMouseMove($event)"
      (mouseup)="onImageMouseUp($event)"
      (mouseleave)="onImageMouseUp($event)"
    >
      <img
        [src]="previewUrl()"
        class="w-full h-auto rounded cursor-crosshair"
        alt="{{ 'avatar.preview' | t }}"
        (load)="onImageLoad($event)"
      />
      <div
        class="absolute border-2 border-blue-400 pointer-events-none"
        [style.left.px]="cropX()"
        [style.top.px]="cropY()"
        [style.width.px]="cropSize()"
        [style.height.px]="cropSize()"
      ></div>
    </div>

    <div class="flex gap-2 mt-2">
      <button
        class="app-button-primary"
        [disabled]="uploading()"
        (click)="confirmCrop()"
        [attr.aria-label]="'avatar.crop_and_upload' | t"
      >
        {{ 'avatar.crop_and_upload' | t }}
      </button>
      <button
        class="app-button-secondary"
        (click)="previewUrl.set(null)"
        [attr.aria-label]="'avatar.cancel' | t"
      >
        {{ 'avatar.cancel' | t }}
      </button>
    </div>
  }
</div>
