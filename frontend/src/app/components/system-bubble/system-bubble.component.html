<ng-container *ngIf="bubbles().length; else noBubbles">
  <div
    class="system-bubble fixed bottom-6 start-6 z-50 flex max-w-xs items-start gap-3 rounded-2xl bg-surface-elevated p-4 shadow-xl ring-1 ring-white/10"
    *ngFor="let bubble of bubbles(); trackBy: trackById"
  >
    <span class="text-lg">💬</span>
    <div class="flex-1 overflow-hidden">
      <p class="text-sm font-medium text-content-primary">
        {{ bubble.text }}
      </p>
      <p
        *ngIf="bubble.i18nKey"
        class="text-xs mt-1 text-content-tertiary"
      >
        {{ translate(bubble.i18nKey, bubble.i18nArgs) }}
      </p>
      <button
        (click)="dismiss(bubble.id)"
        class="absolute top-2 end-2 text-content-tertiary hover:text-content-primary"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>
</ng-container>
<ng-template #noBubbles></ng-template>
