<div class="relative inline-block">
  <button
    hlmBtn
    type="button"
    variant="secondary"
    size="touch"
    class="w-full min-w-[140px] justify-between shadow-card"
    (click)="openModal()"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="'lang.selectPlaceholder' | t"
  >
    <span class="flex items-center gap-2 truncate">
      @if (selectedLanguage()) {
        <span class="text-base leading-none">{{ selectedLanguage()?.flag }}</span>
        <span class="truncate">{{ selectedLanguage()?.name }}</span>
      } @else {
        <span class="truncate">{{ 'lang.selectPlaceholder' | t }}</span>
      }
    </span>
    <span class="ms-2 text-xs text-text-muted" aria-hidden="true">▼</span>
  </button>

  @if (isOpen()) {
    <div
      class="animate-fadeIn fixed inset-0 z-[120] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lang-picker-title"
    >
      <div
        class="flex max-h-[85vh] w-full max-w-md flex-col overflow-hidden rounded-sheet border border-surface-100 bg-surface-200 shadow-lift"
      >
        <div class="flex items-center justify-between border-b border-surface-100 bg-surface-300/80 px-6 py-4">
          <h3 id="lang-picker-title" class="text-lg font-bold text-text-primary">
            {{ 'lang.selectLanguage' | t }}
          </h3>
          <button
            hlmBtn
            type="button"
            variant="ghost"
            size="icon-touch"
            (click)="closeModal()"
            [attr.aria-label]="'common.close' | t"
          >
            <span aria-hidden="true">✕</span>
          </button>
        </div>

        <div class="border-b border-surface-100 px-6 py-4">
          <input
            hlmInput
            type="text"
            [value]="searchQuery()"
            (input)="onSearchInput($event)"
            [placeholder]="'lang.searchPlaceholder' | t"
            [attr.aria-label]="'lang.searchPlaceholder' | t"
          />
        </div>

        <div class="flex-1 space-y-1 overflow-y-auto p-4">
          @for (lang of filteredLanguages(); track lang.code) {
            <button
              hlmBtn
              type="button"
              variant="ghost"
              size="touch"
              class="w-full justify-between text-start"
              (click)="selectLanguage(lang.code)"
              [class.bg-primary]="selectedCode() === lang.code"
              [class.bg-opacity-10]="selectedCode() === lang.code"
              [class.text-primary]="selectedCode() === lang.code"
              [attr.aria-label]="lang.name || lang.nativeName"
              [attr.aria-pressed]="selectedCode() === lang.code"
            >
              <span class="flex items-center gap-3">
                <span class="text-2xl leading-none" aria-hidden="true">{{ lang.flag }}</span>
                <span class="flex flex-col items-start">
                  <span
                    class="text-sm font-bold"
                    [class.text-primary]="selectedCode() === lang.code"
                    [class.text-text-primary]="selectedCode() !== lang.code"
                  >
                    {{ lang.name }}
                  </span>
                  <span
                    class="mt-0.5 text-xs"
                    [class.text-primary]="selectedCode() === lang.code"
                    [class.text-text-secondary]="selectedCode() !== lang.code"
                    [class.opacity-80]="selectedCode() === lang.code"
                  >
                    {{ lang.nativeName }}
                  </span>
                </span>
              </span>
              @if (selectedCode() === lang.code) {
                <span class="font-bold text-primary" aria-hidden="true">✓</span>
              }
            </button>
          } @empty {
            <div class="px-4 py-8 text-center text-sm text-text-muted">
              {{ 'discovery.noMatches' | t }}
            </div>
          }
        </div>
      </div>
    </div>
  }
</div>
