<!-- Collapsed state: floating chat button -->
@if (!isExpanded()) {
  <button
    (click)="toggle()"
    class="absolute bottom-4 end-4 z-50 rounded-full bg-purple-600 w-14 h-14 flex items-center justify-center shadow-lg hover:bg-purple-500 transition-colors pointer-events-auto"
    [attr.aria-label]="'roomChat.openChatOverlay' | t"
  >
    <span class="text-xl">💬</span>
    @if (messages().length > 0) {
      <span class="absolute -top-1 -end-1 inline-flex items-center justify-center w-5 h-5 rounded-full bg-red-500 text-[10px] font-bold text-white">
        {{ messages().length > 99 ? '99+' : messages().length }}
      </span>
    }
  </button>
}

<!-- Expanded state: full chat overlay panel -->
@if (isExpanded()) {
  <div class="absolute bottom-0 start-0 w-full pointer-events-auto z-50 flex flex-col rounded-t-2xl border border-white/10 bg-[#121212]/95 backdrop-blur-lg shadow-2xl"
       style="max-height: 60vh;">
    <!-- Header bar -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
      <h3 class="text-sm font-bold text-white">{{ 'roomChat.overlayTitle' | t }}</h3>
      <div class="flex items-center gap-2">
        <span class="text-[10px] text-slate-400">
          {{ messages().length }} {{ 'roomChat.messagesCount' | t }}
        </span>
        <button
          (click)="toggle()"
          class="text-slate-400 hover:text-white transition-colors text-lg leading-none"
          [attr.aria-label]="'roomChat.closeChatOverlay' | t"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Scrollable message list -->
    <div
      #scrollContainer
      class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5 scrollbar-hide mask-image-fade-top"
    >
      @if (messages().length === 0) {
        <div class="flex flex-col items-center justify-center py-8 text-center">
          <span class="text-3xl mb-2">💬</span>
          <p class="text-xs text-slate-400">{{ 'roomChat.overlayEmpty' | t }}</p>
        </div>
      }
      @for (msg of messages(); track msg.id) {
        <div class="flex flex-col bg-white/5 rounded-xl px-3 py-2 max-w-[90%] border border-white/5 animate-fade-in">
          <span class="text-[10px] font-semibold text-purple-300 mb-0.5">{{ msg.senderName }}</span>
          <span class="text-sm text-white/90 leading-snug break-words">{{ msg.text }}</span>
        </div>
      }
    </div>

    <!-- Input bar -->
    <div class="flex items-center gap-2 border-t border-white/10 px-3 py-3">
      <input
        type="text"
        [value]="inputText()"
        [placeholder]="'roomChat.overlayPlaceholder' | t"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        class="flex-1 rounded-full bg-white/10 px-4 py-2 text-sm text-white outline-none placeholder:text-slate-500 focus:bg-white/15 focus:ring-1 focus:ring-purple-500 transition-colors"
        maxlength="500"
      />
      <button
        (click)="sendMessage()"
        class="rounded-full bg-purple-600 px-4 py-2 text-sm font-semibold text-white hover:bg-purple-500 disabled:cursor-not-allowed disabled:opacity-40 transition-colors shrink-0"
        [disabled]="!inputText().trim()"
      >
        {{ 'roomChat.overlaySend' | t }}
      </button>
    </div>
  </div>
}
