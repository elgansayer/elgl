@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" role="dialog" aria-modal="true" [attr.aria-label]="'events.createTitle' | t">
    <div class="bg-surface rounded-lg p-6 w-full max-w-md shadow-xl">
      <h2 class="text-xl font-bold text-white mb-4">{{ 'events.createTitle' | t }}</h2>
      
      <div class="mb-4">
        <label class="block text-sm text-gray-300 mb-1" for="event-title">{{ 'events.title' | t }}</label>
        <input id="event-title" type="text" class="w-full bg-gray-800 text-white rounded p-2" [value]="title()" (input)="onTitleChange($event)" />
      </div>

      <div class="mb-4">
        <label class="block text-sm text-gray-300 mb-1" for="event-datetime">{{ 'events.datetime' | t }}</label>
        <input id="event-datetime" type="datetime-local" class="w-full bg-gray-800 text-white rounded p-2" [value]="datetime()" (input)="onDatetimeChange($event)" />
      </div>

      <div class="mb-4">
        <label class="block text-sm text-gray-300 mb-1" for="event-location">{{ 'events.location' | t }}</label>
        <select id="event-location" class="w-full bg-gray-800 text-white rounded p-2" [value]="location()" (change)="onLocationChange($event)">
          <option value="audio_room">{{ 'events.locationAudio' | t }}</option>
          <option value="zoom">{{ 'events.locationZoom' | t }}</option>
          <option value="in_person">{{ 'events.locationInPerson' | t }}</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-sm text-gray-300 mb-1" for="event-desc">{{ 'events.description' | t }}</label>
        <textarea id="event-desc" class="w-full bg-gray-800 text-white rounded p-2" rows="3" [value]="description()" (input)="onDescriptionChange($event)"></textarea>
      </div>

      <div class="flex justify-end space-x-2 rtl:space-x-reverse">
        <button class="px-4 py-2 text-gray-300 hover:text-white" (click)="closeModal.emit()" [attr.aria-label]="'common.cancel' | t">{{ 'common.cancel' | t }}</button>
        <button class="px-4 py-2 bg-primary-600 text-white rounded hover:bg-primary-500" (click)="submit()" [attr.aria-label]="'common.save' | t">{{ 'common.save' | t }}</button>
      </div>
    </div>
  </div>
}
