<div
  class="p-4 bg-surface-200 rounded-lg shadow-sm border border-surface-100"
  [dir]="i18n.direction()"
>
  <h2 class="text-xl font-bold mb-4 text-primary">{{ 'topics.title' | t }}</h2>
  <div class="flex flex-col gap-2">
    @for (topic of topics(); track topic.id) {
      <div class="flex justify-between items-center bg-surface-300 p-3 rounded-md">
        <span class="text-text-primary font-medium">{{ topic.name }}</span>
        <button
          hlmBtn
          (click)="toggleFollow(topic.id)"
          class="px-4 py-1.5 rounded-full text-sm font-bold transition-colors"
          [class.bg-primary]="!topic.isFollowing"
          [class.text-white]="!topic.isFollowing"
          [class.bg-surface-100]="topic.isFollowing"
          [class.text-text-secondary]="topic.isFollowing"
          [attr.aria-label]="'topics.following' | t"
        >
          {{ topic.isFollowing ? ('topics.following' | t) : ('topics.follow' | t) }}
        </button>
      </div>
    } @empty {
      <div class="text-text-muted text-center py-4">{{ 'topics.empty' | t }}</div>
    }
  </div>
</div>
