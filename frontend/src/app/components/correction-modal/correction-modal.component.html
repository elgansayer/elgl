<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4"
  (click)="closeModal()"
>
  <div
    class="bg-surface-500 border border-surface-100 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <header
      class="p-4 bg-surface-400 border-b border-surface-100 flex items-center justify-between"
    >
      <div class="flex items-center gap-2">
        <span class="text-xl">✏️</span>
        <h2 class="text-base font-bold text-text-primary">
          {{ 'moments.correctSentenceTitle' | t }}
        </h2>
      </div>
      <button
        hlmBtn
        aria-label="Close modal"
        (click)="closeModal()"
        class="p-1 rounded-full text-text-secondary hover:text-text-primary hover:bg-surface-300 transition-colors"
      >
        ✕
      </button>
    </header>

    <!-- Modal Body -->
    <div class="p-4 overflow-y-auto space-y-4 flex-1">
      <!-- Original Ghost Text Box -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-bold text-text-secondary uppercase tracking-wider">
            {{ 'moments.ghostOriginal' | t }}
          </label>
          <button
            hlmBtn
            (click)="onOriginalClick()"
            class="text-[11px] text-neon-blue hover:underline"
            [attr.aria-label]="'moments.resetGhost' | t"
          >
            {{ 'moments.resetGhost' | t }}
          </button>
        </div>
        <div
          class="bg-surface-400/80 border border-surface-100/50 rounded-2xl p-3 text-sm text-text-muted italic relative"
        >
          <span class="opacity-70">"{{ originalText() }}"</span>
          <span
            class="absolute top-2 end-2 text-[10px] text-warning bg-warning/10 px-2 py-0.5 rounded-full font-bold"
            >{{ 'correction.ghostTextLabel' | t }}</span
          >
        </div>
      </div>

      <!-- Edit Correction Box -->
      <div>
        <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">
          {{ 'moments.correctedSentence' | t }}
        </label>
        <textarea
          hlmTextarea
          [ngModel]="correctedText()"
          (ngModelChange)="correctedText.set($event)"
          rows="3"
          [placeholder]="'correction.editPlaceholder' | t"
          class="w-full bg-surface-300 border border-neon-blue/40 rounded-2xl p-3 text-sm text-text-primary placeholder:text-text-secondary/50 focus:outline-none focus:ring-2 focus:ring-neon-blue resize-none"
          [attr.aria-label]="'correction.editPlaceholder' | t"
        >
        </textarea>
      </div>

      <!-- Live Diff Preview -->
      @if (correctedText().trim() && correctedText().trim() !== originalText().trim()) {
        <div>
          <label class="block text-xs font-bold text-warning uppercase tracking-wider mb-1">
            {{ 'moments.liveDiffPreview' | t }}
          </label>
          <app-visual-diff
            [original]="originalText()"
            [corrected]="correctedText()"
            [showActions]="true"
          >
          </app-visual-diff>
        </div>
      }

      <!-- Tutor Explanation Notes -->
      <div>
        <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">
          {{ 'moments.explanation' | t }} ({{ 'common.optional' | t }})
        </label>
        <input
          hlmInput
          type="text"
          [ngModel]="explanation()"
          (ngModelChange)="explanation.set($event)"
          [placeholder]="'correction.explainPlaceholder' | t"
          class="w-full bg-surface-300 border border-surface-100 rounded-2xl px-4 py-2.5 text-xs text-text-primary placeholder:text-text-secondary/50 focus:outline-none focus:ring-1 focus:ring-surface-100"
          [attr.aria-label]="'correction.explainPlaceholder' | t"
        />
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <footer
      class="p-4 bg-surface-400 border-t border-surface-100 flex items-center justify-end gap-3"
    >
      <button
        hlmBtn
        aria-label="Close modal"
        (click)="closeModal()"
        class="px-4 py-2 text-xs font-bold text-text-secondary hover:text-text-primary rounded-full hover:bg-surface-300 transition-colors"
      >
        {{ 'common.cancel' | t }}
      </button>
      <button
        hlmBtn
        (click)="submitCorrection()"
        [disabled]="!correctedText().trim() || correctedText().trim() === originalText().trim()"
        class="px-5 py-2 text-xs font-bold text-on-fill bg-gradient-to-r from-primary to-secondary rounded-full hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-md"
        [attr.aria-label]="'moments.sendCorrection' | t"
      >
        {{ 'moments.sendCorrection' | t }}
      </button>
    </footer>
  </div>
</div>
