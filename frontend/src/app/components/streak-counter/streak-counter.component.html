<section
  class="bg-surface rounded-xl p-4 space-y-2"
  role="region"
  aria-label="{{ 'streak.counter' | t }}"
>
  <h2 class="text-sm uppercase tracking-wider text-gray-400 font-medium">
    {{ 'streak.title' | t }}
  </h2>
  <div class="flex items-center gap-3">
    <span class="text-3xl font-bold text-accent">{{ streak() }}</span>
    <span class="text-lg text-gray-300">{{ 'streak.days' | t }}</span>
  </div>
</section>
