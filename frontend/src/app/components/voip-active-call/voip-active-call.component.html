<div class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-surface-900 text-white">
  <div class="ps-3 pe-3 sm:ps-4 sm:pe-4 w-full max-w-md">
    <!-- caller info -->
    <div class="text-center mb-6 sm:mb-8">
      <img
        loading="lazy"
        [src]="avatarUrl()"
        [alt]="callerName()"
        class="w-20 h-20 sm:w-24 sm:h-24 rounded-full mx-auto object-cover ring-4 ring-secondary"
      />
      <p class="text-lg sm:text-xl font-semibold mt-2">{{ callerName() }}</p>
      <p class="text-xs sm:text-sm text-white/60">{{ formattedDuration() }}</p>
      <div
        class="mt-2 inline-flex items-center gap-1.5 ps-2.5 pe-2.5 pt-0.5 pb-0.5 rounded-full bg-white/10 text-success text-xs font-medium"
        role="status"
      >
        <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
            clip-rule="evenodd"
          />
        </svg>
        <span>{{ 'calls.e2eeSecured' | t }}</span>
      </div>
    </div>

    <!-- call controls -->
    <div class="flex items-center justify-center gap-3 sm:gap-6">
      <!-- Mute -->
      <button
        hlmBtn
        (click)="toggleMute()"
        class="flex flex-col items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-full transition-colors"
        [class.bg-secondary]="!isMuted()"
        [class.bg-danger]="isMuted()"
        [attr.aria-label]="'call.mute' | t"
      >
        <ng-icon
          [name]="isMuted() ? 'lucideMicOff' : 'lucideMic'"
          class="text-xl sm:text-2xl"
          aria-hidden="true"
        />
        <span class="text-[10px] sm:text-xs mt-0.5 sm:mt-1">{{
          isMuted() ? ('call.unmute' | t) : ('call.mute' | t)
        }}</span>
      </button>

      <!-- Speakerphone -->
      <button
        hlmBtn
        (click)="toggleSpeaker()"
        class="flex flex-col items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-full transition-colors"
        [class.bg-secondary]="isSpeakerOn()"
        [class.bg-white/20]="!isSpeakerOn()"
        [attr.aria-label]="'call.speaker' | t"
      >
        <ng-icon
          [name]="isSpeakerOn() ? 'lucideVolume2' : 'lucideVolumeX'"
          class="text-xl sm:text-2xl"
          aria-hidden="true"
        />
        <span class="text-[10px] sm:text-xs mt-0.5 sm:mt-1">{{ 'call.speaker' | t }}</span>
      </button>

      <!-- End Call -->
      <button
        hlmBtn
        (click)="endCall.emit()"
        class="flex flex-col items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-danger hover:bg-danger/90 transition-colors"
        [attr.aria-label]="'call.hang_up' | t"
      >
        <ng-icon name="lucidePhoneOff" class="text-xl sm:text-2xl" aria-hidden="true" />
        <span class="text-[10px] sm:text-xs mt-0.5 sm:mt-1">{{ 'call.hang_up' | t }}</span>
      </button>
    </div>
  </div>
</div>
