<div class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gray-900 text-white">
  <div class="ps-4 pe-4 w-full max-w-md">
    <!-- caller info -->
    <div class="text-center mb-8">
      <img
        [src]="avatarUrl()"
        [alt]="callerName()"
        class="w-24 h-24 rounded-full mx-auto object-cover ring-4 ring-blue-500"
      />
      <p class="text-xl font-semibold mt-2">{{ callerName() }}</p>
      <p class="text-sm text-white/60">{{ formattedDuration() }}</p>
    </div>

    <!-- call controls -->
    <div class="flex items-center justify-center gap-6">
      <!-- Mute -->
      <button
        (click)="toggleMute()"
        class="flex flex-col items-center justify-center w-16 h-16 rounded-full transition-colors"
        [class.bg-blue-600]="!isMuted()"
        [class.bg-red-600]="isMuted()"
        [attr.aria-label]="'call.mute' | t"
      >
        <span class="material-icons text-2xl">
          {{ isMuted() ? 'mic_off' : 'mic' }}
        </span>
        <span class="text-xs mt-1">{{ isMuted() ? ('call.unmute' | t) : ('call.mute' | t) }}</span>
      </button>

      <!-- Speakerphone -->
      <button
        (click)="toggleSpeaker()"
        class="flex flex-col items-center justify-center w-16 h-16 rounded-full transition-colors"
        [class.bg-blue-600]="isSpeakerOn()"
        [class.bg-gray-700]="!isSpeakerOn()"
        [attr.aria-label]="'call.speaker' | t"
      >
        <span class="material-icons text-2xl">
          {{ isSpeakerOn() ? 'volume_up' : 'volume_off' }}
        </span>
        <span class="text-xs mt-1">{{ 'call.speaker' | t }}</span>
      </button>

      <!-- End Call -->
      <button
        (click)="endCall.emit()"
        class="flex flex-col items-center justify-center w-16 h-16 rounded-full bg-red-600 hover:bg-red-700 transition-colors"
        [attr.aria-label]="'call.hang_up' | t"
      >
        <span class="material-icons text-2xl">call_end</span>
        <span class="text-xs mt-1">{{ 'call.hang_up' | t }}</span>
      </button>
    </div>
  </div>
</div>
