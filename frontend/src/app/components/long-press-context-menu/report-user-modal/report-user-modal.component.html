<h2 mat-dialog-title>Report {{ data.reportedUserName || 'User' }}</h2>

<mat-dialog-content>
  <p>
    You are about to report
    <strong>{{ data.reportedUserName || 'this user' }}</strong>.
    Please provide a reason and a brief description.
  </p>

  <form [formGroup]="reportForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Reason</mat-label>
      <mat-select formControlName="reasonCategory" required>
        <mat-option *ngFor="let opt of reasonOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="4" maxlength="500" required></textarea>
      <mat-hint align="end">{{ reportForm.get('description')?.value?.length || 0 }}/500</mat-hint>
      <mat-error *ngIf="reportForm.get('description')?.hasError('required')">
        Description is required.
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="reportForm.invalid" (click)="submitReport()">
    Submit Report
  </button>
</mat-dialog-actions>
