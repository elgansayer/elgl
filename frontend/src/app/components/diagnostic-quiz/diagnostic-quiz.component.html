<div
  class="max-w-2xl mx-auto p-6 bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800"
>
  <!-- Header & Progress -->
  <div class="mb-8">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-4 text-start">
      Language Level Diagnostic
    </h2>
    <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-2.5 mb-2">
      <div
        class="bg-blue-600 h-2.5 rounded-full transition-all duration-300 ease-out"
        [style.width.%]="progressPercentage()"
      ></div>
    </div>
    <p class="text-sm text-slate-500 dark:text-slate-400 text-end">
      Question {{ currentIndex() + 1 }} of {{ questions().length }}
    </p>
  </div>

  <!-- Question Area -->
  <div class="mb-8 min-h-[200px]">
    <h3 class="text-lg font-medium text-slate-800 dark:text-slate-200 mb-6 text-start">
      {{ currentQuestion().text }}
    </h3>

    <div class="flex flex-col gap-3">
      @for (option of currentQuestion().options; track option.id) {
        <button
          type="button"
          (click)="selectOption(currentQuestion().id, option.points)"
          class="w-full text-start p-4 rounded-xl border-2 transition-all duration-200"
          [class.border-blue-500]="answers()[currentQuestion().id] === option.points"
          [class.bg-blue-50]="answers()[currentQuestion().id] === option.points"
          [class.dark:bg-blue-900/20]="answers()[currentQuestion().id] === option.points"
          [class.border-slate-200]="answers()[currentQuestion().id] !== option.points"
          [class.dark:border-slate-700]="answers()[currentQuestion().id] !== option.points"
          [class.hover:border-blue-300]="answers()[currentQuestion().id] !== option.points"
        >
          <span class="text-slate-700 dark:text-slate-300 font-medium">
            {{ option.text }}
          </span>
        </button>
      }
    </div>
  </div>

  <!-- Navigation Actions -->
  <div
    class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800"
  >
    <button
      type="button"
      (click)="previous()"
      [disabled]="currentIndex() === 0"
      class="px-5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      Previous
    </button>

    <button
      type="button"
      (click)="next()"
      [disabled]="!canProceed()"
      class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      {{ isLastQuestion() ? 'Finish' : 'Next' }}
    </button>
  </div>
</div>
