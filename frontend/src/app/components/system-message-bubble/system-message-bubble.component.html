<div class="system-message-overlay" *ngIf="bubbles.length">
  <div
    *ngFor="let bubble of bubbles"
    class="system-message-bubble"
  >
    <span class="message-content">
      {{ bubble.i18nKey ? (bubble.i18nKey | translate : bubble.i18nArgs) : bubble.text }}
    </span>
    <button class="dismiss-btn" (click)="dismiss(bubble.id)">x</button>
  </div>
</div>
