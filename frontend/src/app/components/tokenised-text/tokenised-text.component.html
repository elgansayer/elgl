<div class="inline leading-relaxed select-text font-medium text-base" role="text" [attr.aria-label]="'tokenisedText.textContentAriaLabel' | t">
  @for (token of tokens(); track token.index) {
    <span
      (click)="onTokenClick(token)"
      (keydown.enter)="onTokenClick(token)"
      (keydown.space)="onTokenClick(token); $event.preventDefault()"
      [attr.tabindex]="token.isWordLike ? 0 : null"
      [attr.role]="token.isWordLike ? 'button' : null"
      [attr.aria-label]="token.isWordLike ? ('tokenisedText.lookupWordAriaLabel' | t: { word: token.segment }) : null"
      [class]="
        'transition-colors rounded px-0.5 focus-visible:outline-2 focus-visible:outline-primary ' +
        (token.isWordLike ? vocabStore.getWordStatus(token.segment).colorClass : '')
      "
    >
      {{ token.segment }}
    </span>
  }
  @if (transliteration()) {
    <div class="transliteration mt-1 text-xs leading-snug text-slate-500" dir="ltr" [attr.aria-label]="'tokenisedText.transliterationAriaLabel' | t: { text: transliteration() }">
      {{ transliteration() }}
    </div>
  }
</div>
