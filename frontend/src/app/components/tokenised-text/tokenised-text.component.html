<div class="inline leading-relaxed select-text font-medium text-base">
  <span
    *ngFor="let token of tokens()"
    (click)="onTokenClick(token)"
    class="transition-colors rounded px-0.5"
    [ngClass]="token.isWordLike ? vocabStore.getWordStatus(token.segment).colorClass : ''"
  >
    {{ token.segment }}
  </span>
</div>
