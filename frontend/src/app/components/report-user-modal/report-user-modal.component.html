<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm" (click)="cancel()">
  <div class="w-full sm:max-w-md mx-auto bg-slate-800 rounded-t-2xl sm:rounded-2xl shadow-2xl border border-slate-700 max-h-[90vh] overflow-y-auto p-6" (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold text-white">Report user</h2>
      <button type="button" class="text-slate-400 hover:text-white transition-colors" (click)="cancel()" aria-label="Close">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Category loading -->
    @if (loadingCategories()) {
      <div class="flex items-center justify-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-2 border-slate-600 border-t-red-500"></div>
      </div>
    } @else if (loadError()) {
      <div class="text-center py-6">
        <p class="text-slate-400 mb-3">Could not load report categories</p>
        <button class="px-4 py-2 rounded-full bg-slate-700 text-sm font-medium text-white hover:bg-slate-600" (click)="retryLoadCategories()">
          Retry
        </button>
      </div>
    } @else {
      <!-- Reason selection -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-300 mb-2">Reason</label>
        <div class="grid grid-cols-2 gap-2">
          @for (cat of categoriesToShow(); track cat.value) {
            <label
              [class]="selectedCategory() === cat.value
                ? 'bg-red-600/20 border-red-500 text-red-300'
                : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'"
              class="flex items-center justify-center p-3 rounded-full border cursor-pointer text-sm font-medium transition-colors"
            >
              <input
                type="radio"
                [value]="cat.value"
                class="sr-only"
                [checked]="selectedCategory() === cat.value"
                (change)="selectCategory(cat.value)"
              />
              {{ cat.label }}
            </label>
          }
        </div>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label for="reportDesc" class="block text-sm font-medium text-slate-300 mb-1">Additional details (optional)</label>
        <textarea
          id="reportDesc"
          rows="3"
          class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent resize-none text-sm"
          placeholder="Add any context..."
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
        ></textarea>
      </div>

      <!-- Block user toggle -->
      <label class="flex items-center gap-3 mb-6 cursor-pointer">
        <input type="checkbox" class="w-4 h-4 rounded border-slate-500 text-red-500 focus:ring-red-500 bg-slate-700" [checked]="blockUser()" (change)="blockUser.set(!blockUser())" />
        <span class="text-sm text-slate-300">Also block this user</span>
      </label>

      <!-- Actions -->
      <div class="flex justify-end gap-3">
        <button
          type="button"
          class="px-5 py-2 rounded-full text-sm font-semibold bg-slate-700 hover:bg-slate-600 text-white transition-colors"
          (click)="cancel()"
        >
          Cancel
        </button>
        <button
          type="button"
          [disabled]="!selectedCategory() || submitting()"
          class="px-5 py-2 rounded-full text-sm font-semibold bg-red-600 hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed text-white transition-colors"
          (click)="submitReport()"
        >
          {{ submitting() ? 'Submitting...' : 'Submit report' }}
        </button>
      </div>
    }
  </div>
</div>
