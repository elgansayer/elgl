@if (show()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full mx-4 overflow-hidden">
      <!-- Header -->
      <div class="bg-red-50 dark:bg-red-900/20 px-6 py-4 border-b border-red-200 dark:border-red-800">
        <h3 class="text-lg font-bold text-red-700 dark:text-red-300">Report User</h3>
        <p class="text-sm text-red-600/80 dark:text-red-300/70 mt-1">Help us keep HelloTalk safe</p>
      </div>

      <!-- Form body -->
      <div class="px-6 py-5 space-y-5">
        <!-- Reason selection -->
        <fieldset>
          <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Reason for report</legend>
          <div class="grid grid-cols-1 gap-2">
            @for (cat of reasonCategories; track cat.value) {
              <label class="flex items-center p-2.5 rounded-lg border border-gray-200 dark:border-gray-600 hover:border-red-400 dark:hover:border-red-500 transition cursor-pointer"
                     [class.border-red-500]="selectedCategory() === cat.value"
                     [class.bg-red-50]="selectedCategory() === cat.value">
                <input
                  type="radio"
                  name="reportCategory"
                  [value]="cat.value"
                  [checked]="selectedCategory() === cat.value"
                  (change)="selectedCategory.set(cat.value)"
                  class="w-4 h-4 text-red-600 focus:ring-red-500"
                />
                <span class="ms-2 text-sm text-gray-800 dark:text-gray-200">{{ cat.label }}</span>
              </label>
            }
          </div>
        </fieldset>

        <!-- Description (optional) -->
        <div>
          <label for="reportDesc" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">
            Additional details <span class="text-gray-400 dark:text-gray-500">(optional)</span>
          </label>
          <textarea
            id="reportDesc"
            rows="3"
            [ngModel]="description()"
            (ngModelChange)="description.set($event)"
            placeholder="Tell us more about why you are reporting this user..."
            class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-red-400 focus:border-red-400 resize-none"
          ></textarea>
        </div>
      </div>

      <!-- Footer buttons -->
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50">
        <button
          (click)="cancel()"
          class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition"
        >
          Cancel
        </button>
        <button
          (click)="submitReport()"
          [disabled]="!selectedCategory() || submitting()"
          class="px-4 py-2 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg transition"
        >
          {{ submitting() ? 'Submitting...' : 'Submit Report' }}
        </button>
      </div>
    </div>
  </div>
}
