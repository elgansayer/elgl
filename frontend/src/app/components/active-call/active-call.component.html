<div
  class="fixed inset-0 z-50 flex flex-col items-center justify-between bg-[#121212] ps-4 pe-4 pt-12 pb-8"
>
  <!-- Top section: caller info -->
  <div class="flex flex-col items-center">
    @if (callerAvatar()) {
      <img loading="lazy"
        [src]="callerAvatar()"
        alt=""
        class="w-24 h-24 rounded-full object-cover mb-4"
      />
    }
    <h2 class="text-xl font-semibold text-white mb-1">{{ callerName() }}</h2>
    <p class="text-sm text-gray-400">{{ 'voip.connecting' | t }}</p>
  </div>

  <!-- Bottom controls -->
  <div class="flex items-center justify-center gap-x-8 w-full">

    <!-- Mute / Unmute button -->
    <div class="flex flex-col items-center">
      <button
        class="flex flex-col items-center bg-gray-800 rounded-full p-4 w-16 h-16 justify-center"
        (click)="onToggleMute()"
        [class.bg-red-800]="isMuted()"
        [attr.aria-label]="(isMuted() ? 'voip.unmute' : 'voip.mute') | t"
      >
        <span class="text-white text-2xl">
          {{ isMuted() ? '🔇' : '🎤' }}
        </span>
      </button>
      <span class="text-xs text-gray-300 mt-2">
        {{ (isMuted() ? 'voip.unmute' : 'voip.mute') | t }}
      </span>
    </div>

    <!-- Speakerphone button -->
    <div class="flex flex-col items-center">
      <button
        class="flex flex-col items-center bg-gray-800 rounded-full p-4 w-16 h-16 justify-center"
        (click)="onToggleSpeaker()"
        [class.bg-blue-800]="isSpeakerphone()"
        [attr.aria-label]="(isSpeakerphone() ? 'voip.speaker_off' : 'voip.speaker_on') | t"
      >
        <span class="text-white text-2xl">
          {{ isSpeakerphone() ? '🔊' : '🔉' }}
        </span>
      </button>
      <span class="text-xs text-gray-300 mt-2">
        {{ (isSpeakerphone() ? 'voip.speaker_off' : 'voip.speaker_on') | t }}
      </span>
    </div>

    <!-- End call button -->
    <div class="flex flex-col items-center">
      <button
        class="flex flex-col items-center bg-red-700 hover:bg-red-600 rounded-full p-4 w-16 h-16 justify-center"
        (click)="onEndCall()"
        [attr.aria-label]="'voip.endCall' | t"
      >
        <span class="text-white text-2xl">📞</span>
      </button>
      <span class="text-xs text-gray-300 mt-2">{{ 'voip.endCall' | t }}</span>
    </div>

  </div>
</div>
