<hlm-dialog [state]="dialogState()" (stateChanged)="onDialogStateChanged($event)">
  <hlm-dialog-content
    *hlmDialogPortal
    [showCloseButton]="false"
    class="w-full max-w-sm space-y-4 overflow-hidden rounded-2xl border border-surface-100 bg-surface-200 p-0 shadow-xl motion-reduce:animate-none"
    [dir]="i18n.direction()"
  >
    <!-- Header -->
    <hlm-dialog-header class="flex flex-row items-center justify-between border-b border-surface-100 p-4">
      <h2 hlmDialogTitle class="text-lg font-bold text-text-primary">{{ 'share.title' | t }}</h2>
      <button
        hlmBtn
        type="button"
        variant="ghost"
        size="icon"
        class="rounded-full text-text-secondary hover:bg-surface-300"
        (click)="closed.emit()"
        [attr.aria-label]="'common.close' | t"
      >
        ✕
      </button>
    </hlm-dialog-header>

    <!-- Preview Card -->
    <div class="px-4">
      <div
        class="flex items-center gap-3 rounded-lg border border-surface-100 bg-surface-300 p-3"
      >
        @if (entity().thumbnailUrl) {
          <img
            [src]="entity().thumbnailUrl"
            class="h-12 w-12 rounded object-cover"
            alt=""
          />
        } @else {
          <div
            class="flex h-12 w-12 items-center justify-center rounded bg-primary/20 text-xl text-primary"
            aria-hidden="true"
          >
            🔗
          </div>
        }
        <div class="min-w-0 flex-1">
          <h3 class="truncate text-sm font-bold text-text-primary">{{ entity().title }}</h3>
          @if (entity().subtitle) {
            <p class="truncate text-xs text-text-secondary">{{ entity().subtitle }}</p>
          }
        </div>
      </div>
    </div>

    <!-- Share Targets -->
    <div class="px-4 pb-4">
      <div class="mb-4 grid grid-cols-4 gap-2">
        <button
          hlmBtn
          type="button"
          variant="ghost"
          class="group flex h-auto flex-col items-center gap-1 p-2"
          (click)="shareToDirectMessage()"
          [attr.aria-label]="'share.dm' | t"
        >
          <div
            class="flex h-12 w-12 items-center justify-center rounded-full bg-secondary text-xl text-on-fill shadow transition-transform group-hover:scale-105"
            aria-hidden="true"
          >
            💬
          </div>
          <span class="text-center text-[10px] font-bold text-text-secondary">{{
            'share.dm' | t
          }}</span>
        </button>

        <button
          hlmBtn
          type="button"
          variant="ghost"
          class="group flex h-auto flex-col items-center gap-1 p-2"
          (click)="shareToFeed()"
          [attr.aria-label]="'share.moments' | t"
        >
          <div
            class="flex h-12 w-12 items-center justify-center rounded-full bg-warning text-xl text-on-fill shadow transition-transform group-hover:scale-105"
            aria-hidden="true"
          >
            ⭕
          </div>
          <span class="text-center text-[10px] font-bold text-text-secondary">{{
            'share.moments' | t
          }}</span>
        </button>
      </div>

      <!-- Copy Link Box -->
      <div class="flex items-center gap-2 rounded-lg bg-surface-100 p-2">
        <input
          hlmInput
          type="text"
          [value]="shareUrl()"
          readonly
          class="flex-1 bg-transparent px-2 text-sm text-text-primary outline-none"
          [attr.aria-label]="'share.copy' | t"
        />
        <button
          hlmBtn
          type="button"
          size="sm"
          class="rounded-md px-4 py-2 text-sm font-bold text-on-fill transition-colors"
          [class.bg-primary]="!isCopying()"
          [class.bg-success]="isCopying()"
          (click)="copyLink()"
          [attr.aria-label]="isCopying() ? ('share.copied' | t) : ('share.copy' | t)"
        >
          {{ isCopying() ? ('share.copied' | t) : ('share.copy' | t) }}
        </button>
      </div>
    </div>
  </hlm-dialog-content>
</hlm-dialog>
