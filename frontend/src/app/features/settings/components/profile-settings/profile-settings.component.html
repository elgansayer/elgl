<form [formGroup]="profileForm" (ngSubmit)="save()" class="space-y-4">
  <label class="block">
    <span class="text-sm font-medium">{{ 'settings.profile.bio' | t }}</span>
    <textarea
      hlmTextarea
      formControlName="bio"
      class="mt-1 w-full rounded-app bg-surface-200 p-3"
    ></textarea>
  </label>

  <label class="block">
    <span class="text-sm font-medium">{{ 'settings.profile.nativeLanguage' | t }}</span>
    <input
      hlmInput
      formControlName="nativeLanguage"
      class="mt-1 w-full rounded-app bg-surface-200 p-3"
    />
  </label>

  <div formGroupName="ageFilter" class="grid grid-cols-2 gap-3">
    <label class="block">
      <span class="text-sm font-medium">{{ 'settings.profile.minimumAge' | t }}</span>
      <input
        hlmInput
        type="number"
        formControlName="min"
        class="mt-1 w-full rounded-app bg-surface-200 p-3"
      />
    </label>
    <label class="block">
      <span class="text-sm font-medium">{{ 'settings.profile.maximumAge' | t }}</span>
      <input
        hlmInput
        type="number"
        formControlName="max"
        class="mt-1 w-full rounded-app bg-surface-200 p-3"
      />
    </label>
  </div>

  <label class="flex items-center gap-2">
    <hlm-checkbox formControlName="displayKana" />
    <span>{{ 'settings.profile.displayKana' | t }}</span>
  </label>

  <button hlmBtn type="submit" class="rounded-app bg-primary px-4 py-2 text-on-fill">
    {{ 'common.save' | t }}
  </button>
</form>
