<div class="min-h-screen bg-surface p-4 md:px-6 lg:px-8 max-w-xl mx-auto">
  <h1 class="text-start text-xl font-bold ps-4 pe-4 mb-4">{{ 'dataStorage.title' | t }}</h1>
  <div class="space-y-4">
    <button
      class="btn-primary w-full text-start"
      (click)="clearCache()"
    >
      {{ 'dataStorage.clearCache' | t }}
    </button>
    <div class="flex items-center justify-between ps-4 pe-4">
      <span class="me-2">{{ 'dataStorage.cellularAutoDownload' | t }}</span>
      <label class="switch inline-flex items-center cursor-pointer">
        <input type="checkbox" [checked]="dataStorageService.cellularAutoDownload()" (change)="toggleCellular()" class="sr-only peer" />
        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
      </label>
    </div>
  </div>
</div>
