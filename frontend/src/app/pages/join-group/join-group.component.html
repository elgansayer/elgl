<section class="flex flex-col items-center justify-center px-6 py-10">
  @if (roomInfo.hasValue()) {
    <h1 class="text-2xl font-bold mb-4">{{ 'join.groupTitle' | t }}</h1>
    <p class="mb-6 text-text-secondary">{{ roomInfo.value().title }}</p>
    <button
      hlmBtn
      (click)="join(roomInfo.value().roomId)"
      [disabled]="joinPending()"
      class="rounded-full bg-primary px-8 py-3 font-semibold text-on-fill disabled:cursor-not-allowed disabled:opacity-60"
      [attr.aria-label]="'join.joining' | t"
    >
      @if (joinPending()) {
        {{ 'join.joining' | t }}
      } @else {
        {{ 'join.joinButton' | t }}
      }
    </button>
    @if (joinFailed()) {
      <p class="mt-4 text-danger">{{ 'join.error' | t }}</p>
    }
  } @else if (roomInfo.isLoading()) {
    <p class="text-text-muted">{{ 'join.loading' | t }}</p>
  } @else {
    <p class="text-danger">{{ 'join.invalidLink' | t }}</p>
    <a
      routerLink="/groups"
      class="mt-4 text-primary underline"
      [attr.aria-label]="'join.backToGroups' | t"
    >
      {{ 'join.backToGroups' | t }}
    </a>
  }
</section>
