<section class="rounded-card border border-surface-100 bg-surface-300 p-6 max-w-md">
  <h2 class="mb-4 text-lg font-semibold text-text-primary">
    {{ 'audioIntro.title' | t }}
  </h2>

  @if (audioUrl(); as url) {
    <div class="mb-4">
      <audio
        #audioPlayer
        [src]="url"
        (play)="isPlaying.set(true)"
        (pause)="isPlaying.set(false)"
        class="w-full"
      ></audio>
      <div class="mt-2 flex items-center gap-2">
        <button
          type="button"
          (click)="togglePlayback()"
          class="rounded bg-primary px-4 py-2 text-sm font-medium text-on-fill transition hover:bg-primary/80"
          [attr.aria-label]="'audioIntro.pause' | t"
        >
          {{ isPlaying() ? ('audioIntro.pause' | t) : ('audioIntro.play' | t) }}
        </button>
      </div>
    </div>
  } @else {
    <p class="mb-4 text-text-secondary">{{ 'audioIntro.noRecording' | t }}</p>
  }

  @if (isRecording()) {
    <div class="mb-4">
      <p class="text-sm text-text-secondary">
        {{ 'audioIntro.recording' | t: { seconds: remainingSeconds() } }}
      </p>
    </div>
  } @else {
    <button
      type="button"
      (click)="startRecording()"
      class="rounded bg-primary px-4 py-2 text-sm font-medium text-on-fill transition hover:bg-primary/80"
      [attr.aria-label]="'audioIntro.record' | t"
    >
      {{ 'audioIntro.record' | t }}
    </button>
  }

  @if (isRecording()) {
    <button
      type="button"
      (click)="stopRecording()"
      class="rounded bg-danger px-4 py-2 text-sm font-medium text-on-fill transition hover:bg-danger/80 ms-2 me-2"
      [attr.aria-label]="'audioIntro.stop' | t"
    >
      {{ 'audioIntro.stop' | t }}
    </button>
  }

  @if (errorMessage(); as message) {
    <p class="mt-4 text-sm text-danger">{{ message }}</p>
  }
</section>
