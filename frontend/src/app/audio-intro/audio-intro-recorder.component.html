<section class="rounded-xl border border-slate-700 bg-slate-900 p-6 max-w-md">
  <h2 class="mb-4 text-lg font-semibold text-slate-100">
    {{ 'audioIntro.title' | t }}
  </h2>

  @if (audioUrl(); as url) {
    <div class="mb-4">
      <audio
        #audioPlayer
        [src]="url"
        (play)="isPlaying.set(true)"
        (pause)="isPlaying.set(false)"
        class="w-full"
      ></audio>
      <div class="mt-2 flex items-center gap-2">
        <button
          type="button"
          (click)="togglePlayback()"
          class="rounded bg-purple-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-purple-500"
          [attr.aria-label]="'audioIntro.pause' | t"
        >
          {{ isPlaying() ? ('audioIntro.pause' | t) : ('audioIntro.play' | t) }}
        </button>
      </div>
    </div>
  } @else {
    <p class="mb-4 text-slate-400">{{ 'audioIntro.noRecording' | t }}</p>
  }

  @if (isRecording()) {
    <div class="mb-4">
      <p class="text-sm text-slate-300">
        {{ 'audioIntro.recording' | t: { seconds: remainingSeconds() } }}
      </p>
    </div>
  } @else {
    <button
      type="button"
      (click)="startRecording()"
      class="rounded bg-green-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-green-500"
      [attr.aria-label]="'audioIntro.record' | t"
    >
      {{ 'audioIntro.record' | t }}
    </button>
  }

  @if (isRecording()) {
    <button
      type="button"
      (click)="stopRecording()"
      class="rounded bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-500 ms-2 me-2"
      [attr.aria-label]="'audioIntro.stop' | t"
    >
      {{ 'audioIntro.stop' | t }}
    </button>
  }

  @if (errorMessage(); as message) {
    <p class="mt-4 text-sm text-red-400">{{ message }}</p>
  }
</section>
