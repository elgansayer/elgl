<div class="min-h-screen flex flex-col bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans">
  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-50 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a routerLink="/" class="flex items-center gap-2 text-xl font-extrabold text-primary tracking-tight">
          <span class="text-2xl">🗣️</span>
          <span>HelloTalk <span class="text-xs uppercase bg-primary/10 text-primary px-1.5 py-0.5 rounded">Open-Core</span></span>
        </a>

        <nav class="hidden sm:flex items-center gap-1">
          <a
            routerLink="/discovery"
            routerLinkActive="bg-primary/10 text-primary font-bold"
            class="px-3.5 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
          >
            🌍 Discover
          </a>
          <a
            routerLink="/visitors"
            routerLinkActive="bg-primary/10 text-primary font-bold"
            class="px-3.5 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
          >
            👀 Visitors
          </a>
          <a
            routerLink="/profile"
            routerLinkActive="bg-primary/10 text-primary font-bold"
            class="px-3.5 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
          >
            👤 Profile
          </a>
        </nav>
      </div>

      <!-- Auth State & VIP Badge -->
      <div class="flex items-center gap-3">
        <div *ngIf="authService.currentUser() as user; else loginPrompt" class="flex items-center gap-3">
          <span class="text-xs font-bold bg-amber-500 text-white px-2 py-0.5 rounded-full shadow-sm">
            8 UKP / $10 USD VIP
          </span>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300 hidden md:inline">
            {{ user.email }}
          </span>
          <button
            (click)="authService.signOut()"
            class="text-xs font-bold text-red-600 dark:text-red-400 hover:underline px-2 py-1"
          >
            Sign out
          </button>
        </div>
        <ng-template #loginPrompt>
          <span class="text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-slate-700 px-2.5 py-1 rounded-lg">
            Demo / Mock Auth Active
          </span>
        </ng-template>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 pb-12">
    <router-outlet></router-outlet>
  </main>
</div>
