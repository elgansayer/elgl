<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="msgBg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="msgAccent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="msgGlow1">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ambient circle -->
  <circle cx="100" cy="70" r="58" fill="url(#msgBg1)"/>
  <!-- Envelope body -->
  <rect x="42" y="42" width="116" height="76" rx="13" fill="#181828" stroke="#2A2A40" stroke-width="1.5"/>
  <!-- Envelope inner shadow -->
  <rect x="42" y="42" width="116" height="76" rx="13" fill="none" stroke="#0F0F1A" stroke-width="2" opacity="0.5"/>
  <!-- Envelope flap -->
  <path d="M42 42L100 86L158 42" fill="#131420" stroke="#2A2A40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chat bubble -->
  <rect x="72" y="56" width="56" height="38" rx="11" fill="#0F0F1E" stroke="#353550" stroke-width="1.2"/>
  <!-- Bubble tail -->
  <path d="M84 94L80 102L76 94" fill="#0F0F1E" stroke="#353550" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three dots (waiting indicator) -->
  <circle cx="90" cy="75" r="3" fill="#3D3D5E"/>
  <circle cx="100" cy="75" r="3" fill="#2D2D48"/>
  <circle cx="110" cy="75" r="3" fill="#3D3D5E"/>
  <!-- Neon accent bar -->
  <path d="M56 112L144 112" stroke="url(#msgAccent1)" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#msgGlow1)"/>
  <circle cx="100" cy="112" r="3.5" fill="#00E5A0" opacity="0.55" filter="url(#msgGlow1)"/>
  <!-- Sparkle top right -->
  <path d="M136 32L136.6 34.5L139 35L136.6 35.5L136 38L135.4 35.5L133 35L135.4 34.5Z" fill="#00E5A0" opacity="0.4"/>
  <!-- Sparkle top left -->
  <path d="M62 36L62.4 38L64 38.3L62.4 38.6L62 40.5L61.6 38.6L60 38.3L61.6 38Z" fill="#00B4D8" opacity="0.25"/>
</svg>
