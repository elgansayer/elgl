version: '3.8'

services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - websocket

  api:
    build:
      context: ./backend
      target: production
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - cache
      - websocket

  web:
    build:
      context: ./frontend
      target: production
    restart: always
    ports:
      - '8080:80'
    depends_on:
      - api

  cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_prod_data:/data

  websocket:
    image: centrifugo/centrifugo:v5
    restart: always
    command: centrifugo -c /centrifugo/config.json
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - ./config/centrifugo:/centrifugo
    depends_on:
      - cache

  sfu:
    image: livekit/livekit-server:latest
    restart: always
    command: --config /livekit/config.yaml
    network_mode: host
    volumes:
      - ./config/livekit:/livekit

volumes:
  redis_prod_data:
