services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - websocket

  api:
    build:
      context: ./backend
      target: production
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    depends_on:
      - cache
      - websocket

  web:
    build:
      context: ./frontend
      target: production
    restart: always
    depends_on:
      - api

  cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data

  websocket:
    image: centrifugo/centrifugo:v5
    restart: always
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./config/centrifugo:/centrifugo
    depends_on:
      - cache

  sfu:
    image: livekit/livekit-server:latest
    restart: always
    command: --config /livekit/config.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "58000-58100:58000-58100/udp"
    volumes:
      - ./config/livekit:/livekit
    depends_on:
      - cache

volumes:
  redis_prod_data:
