name: Cloudflare R2 final branch patch

on:
  push:
    branches:
      - feat/cloudflare-native-r2-gateway
    paths:
      - .github/workflows/cloudflare-r2-final-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-native-r2-gateway
          fetch-depth: 0

      - name: Remove the fabricated archive URL
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'backend/src/audio-rooms/audio-rooms.service.ts';
          const source = fs.readFileSync(file, 'utf8');
          const pattern = /    const recordingUrl =\n      egressRecordingUrl \|\|\n      dto\.recording_url \|\|\n      `https:\/\/r2\.hellotalk\.mock\/archive\/\$\{room\.room_name\}\.webm`;\n\n    \/\/ Generate full transcript[^\n]*\n    let transcriptText =\n      await this\.transcriptEgress\.generateTranscriptFromAudioUrl\(recordingUrl\);/;
          const replacement = [
            '    const recordingUrl = egressRecordingUrl || dto.recording_url || null;',
            '',
            '    // Generate a transcript only when an authoritative recording exists.',
            '    let transcriptText = recordingUrl',
            '      ? await this.transcriptEgress.generateTranscriptFromAudioUrl(',
            '          recordingUrl,',
            '        )',
            "      : '';",
          ].join('\n');
          if (!pattern.test(source)) {
            throw new Error('Expected fabricated archive URL block was not found');
          }
          fs.writeFileSync(file, source.replace(pattern, replacement));
          NODE

      - name: Commit the patched source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/audio-rooms/audio-rooms.service.ts
          git commit -m 'fix(recording): remove fabricated archive URL'
          git push origin HEAD:feat/cloudflare-native-r2-gateway
