name: Frontend container CI

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/frontend-container-ci.yml
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: frontend-container-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: frontend-container / production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production web image
        run: docker build --pull --target production --tag "elgl-web-ci:${GITHUB_SHA}" frontend

      # Released images up to 82f20b959 served nginx's default welcome page
      # because the SSR build names the client shell index.csr.html.
      - name: Verify production image serves the application shell
        run: |
          set -euo pipefail
          container=$(docker run -d -p 127.0.0.1:8080:80 "elgl-web-ci:${GITHUB_SHA}")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break; sleep 1; done
          for route in / /chat /settings; do
            body=$(curl -fsS "http://127.0.0.1:8080${route}")
            if ! grep -q '<app-root' <<<"$body" || grep -qi 'Welcome to nginx' <<<"$body"; then
              echo "Route ${route} did not return the application shell"
              exit 1
            fi
          done

      - name: Report production runtime package versions
        run: |
          docker run --rm "elgl-web-ci:${GITHUB_SHA}" sh -ec '
            echo "=== Alpine release ==="
            cat /etc/alpine-release
            echo "=== security-relevant runtime packages ==="
            apk info -v nginx nginx-module-* libcrypto3 libssl3 libexpat musl zlib pcre2 2>/dev/null || true
          '

      - name: Scan production web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "elgl-web-ci:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m