name: Frontend container CI

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/frontend-container-ci.yml
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: frontend-container-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: frontend-container / production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production frontend image
        run: docker build --target production --tag "elgl-web-ci:${GITHUB_SHA}" frontend
