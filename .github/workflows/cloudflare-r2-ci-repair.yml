name: Cloudflare R2 CI repair

on:
  push:
    branches:
      - feat/cloudflare-native-r2-gateway
    paths:
      - .github/workflows/cloudflare-r2-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cloudflare-native-r2-gateway
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Repair typed headers and control-character validation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(file, search, replacement, label) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(search)) {
              throw new Error(`${label} was not found in ${file}`);
            }
            fs.writeFileSync(file, source.replace(search, replacement));
          }

          replaceRequired(
            'backend/src/cloudflare-stream/cloudflare-stream.service.ts',
            `  ): Promise<T> {
              const response = await fetch(`,
            `  ): Promise<T> {
              const headers = new Headers(init.headers);
              headers.set('Authorization', \`Bearer \${this.apiToken}\`);
              headers.set('Content-Type', 'application/json');
              headers.set('Accept', 'application/json');

              const response = await fetch(`,
            'Cloudflare Stream request header insertion',
          );

          replaceRequired(
            'backend/src/cloudflare-stream/cloudflare-stream.service.ts',
            `        headers: {
                      Authorization: \`Bearer \${this.apiToken}\`,
                      'Content-Type': 'application/json',
                      Accept: 'application/json',
                      ...(init.headers ?? {}),
                    },`,
            `        headers,`,
            'Cloudflare Stream HeadersInit replacement',
          );

          const controlHelper = `function containsControlCharacter(value: string): boolean {
            for (let index = 0; index < value.length; index += 1) {
              const code = value.charCodeAt(index);
              if (code <= 0x1f || code === 0x7f) {
                return true;
              }
            }
            return false;
          }

          `;

          for (const file of [
            'backend/src/cloudflare-r2/r2.service.ts',
            'backend/src/cloudflare-r2/r2-object.service.ts',
            'backend/src/cloudflare-stream/cloudflare-stream.service.ts',
          ]) {
            let source = fs.readFileSync(file, 'utf8');
            source = source.replace(
              /\/\[\\u0000-\\u001f\\u007f\]\/\.test\(([^)]+)\)/g,
              'containsControlCharacter($1)',
            );
            if (!source.includes('function containsControlCharacter')) {
              const insertionPoint = source.indexOf('function isRecord(');
              if (insertionPoint === -1) {
                throw new Error(`Helper insertion point missing in ${file}`);
              }
              source =
                source.slice(0, insertionPoint) +
                controlHelper +
                source.slice(insertionPoint);
            }
            fs.writeFileSync(file, source);
          }

          const constitutionFile = 'docs/learner_knowledge_model.md';
          const constitutionSource = fs.readFileSync(constitutionFile, 'utf8');
          fs.writeFileSync(
            constitutionFile,
            constitutionSource.replaceAll('\u2014', '-'),
          );
          NODE

      - name: Format the flagged backend files
        working-directory: backend
        run: |
          npx prettier --write \
            src/ai-conversation/ai-conversation.module.ts \
            src/ai-conversation/ai-conversation.service.spec.ts \
            src/ai-conversation/ai-conversation.service.ts \
            src/audio-rooms/audio-rooms.service.ts \
            src/audio-rooms/transcript-egress.service.ts \
            src/cloudflare-r2/r2-object.service.ts \
            src/cloudflare-r2/r2-object.service.spec.ts \
            src/cloudflare-r2/r2.service.ts \
            src/cloudflare-r2/r2.service.spec.ts \
            src/cloudflare-stream/cloudflare-stream.service.ts \
            src/cloudflare-stream/cloudflare-stream.service.spec.ts \
            src/config/validation.schema.ts \
            src/config/validation.schema.spec.ts \
            src/learner-knowledge/learner-knowledge.service.ts \
            src/media/media.service.ts \
            src/media/media.service.spec.ts

      - name: Verify backend and Worker changes
        run: |
          cd backend
          npm run lint:check
          npm run build
          npx vitest run \
            src/cloudflare-r2/r2.service.spec.ts \
            src/cloudflare-r2/r2-object.service.spec.ts \
            src/cloudflare-stream/cloudflare-stream.service.spec.ts \
            src/media/media.service.spec.ts \
            src/config/validation.schema.spec.ts
          cd ../workers/r2-gateway
          npm test
          cd ../..
          node scripts/verify-no-aws-sdk.mjs
          node scripts/verify-constitution.mjs

      - name: Commit repaired files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src docs/learner_knowledge_model.md
          if git diff --cached --quiet; then
            echo 'No repairs required.'
            exit 0
          fi
          git commit -m 'fix(storage): satisfy build and canonical quality gates'
          git push origin HEAD:feat/cloudflare-native-r2-gateway
