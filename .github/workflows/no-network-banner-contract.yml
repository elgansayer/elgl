name: No Network Banner Contract

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/src/app/app.component.ts'
      - 'frontend/src/app/components/primitives/no-network-banner/**'
      - 'frontend/src/app/services/network-status.service.ts'
      - 'scripts/tests/no-network-banner-contract.test.mjs'
      - '.github/workflows/no-network-banner-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/app/app.component.ts'
      - 'frontend/src/app/components/primitives/no-network-banner/**'
      - 'frontend/src/app/services/network-status.service.ts'
      - 'scripts/tests/no-network-banner-contract.test.mjs'
      - '.github/workflows/no-network-banner-contract.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: no-network-banner-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: frontend / no-network-banner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify global offline banner contract
        run: node --test scripts/tests/no-network-banner-contract.test.mjs
