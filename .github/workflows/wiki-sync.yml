name: Auto-Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'SPEC.md'
      - 'README.md'

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v7
        with:
          path: main-repo

      - name: Checkout Wiki Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
        continue-on-error: true # If the wiki hasn't been initialized yet, don't crash

      - name: Sync Files to Wiki
        run: |
          # Check if the wiki repo was successfully cloned (it only exists if the user clicked "Create first page")
          if [ ! -d "wiki-repo/.git" ]; then
            echo "Wiki repository not found. Please initialize the wiki by creating the first page on GitHub."
            exit 0
          fi

          # Copy the core documentation files to the Wiki
          cp main-repo/README.md wiki-repo/Home.md
          cp main-repo/AGENTS.md wiki-repo/AI-Constitution.md
          cp main-repo/SPEC.md wiki-repo/Product-Spec.md
          # Tasks moved to GitHub Issues when TODO.md was retired.
          rm -f wiki-repo/Live-Task-Board.md

          cd wiki-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add .
          # Only commit and push if there are actual changes
          git commit -m "docs(wiki): auto-sync documentation from main repo" || echo "No changes to commit"

          # actions/checkout leaves a valid-looking local .git dir even when the wiki
          # remote itself doesn't exist yet - GitHub only provisions the wiki.git
          # repository after a human creates the first page via the web UI (there is
          # no git-only or API way to do this). Detect that case up front so a repo
          # whose wiki was never initialised gets a clear one-time instruction
          # instead of a failed job on every push.
          if ! git ls-remote origin &> /dev/null; then
            echo "Wiki repository does not exist on GitHub yet."
            echo "One-time manual step required: visit https://github.com/${{ github.repository }}/wiki and click 'Create the first page', then this workflow will sync automatically on the next push."
            exit 0
          fi

          git push -u origin HEAD
