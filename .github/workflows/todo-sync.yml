name: Full Two-Way Sync (TODO.md <-> Issues)

on:
  push:
    branches:
      - main
    paths:
      - 'TODO.md'

permissions:
  issues: write
  contents: read

concurrency:
  group: todo-sync
  cancel-in-progress: false

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync TODO.md to GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Scanning TODO.md to mirror state to GitHub Issues..."

          # Fetch every existing issue (open + closed) ONCE up front and match against
          # this local snapshot instead of calling `gh issue list --search` per TODO
          # line. The search API is fuzzy full-text search over an index that lags
          # behind recent writes (especially right after bulk-creating issues in a
          # prior run), and titles containing backticks/parens/colons don't reliably
          # exact-match through it either. That combination meant almost every push
          # re-created every task as a brand new issue instead of finding the
          # existing one, so nothing was ever found to close: 491 distinct TODO tasks
          # had ballooned into 935 open issues with zero closures before this fix.
          # A local snapshot is instant, exact, and immune to indexing lag.
          echo "Fetching existing issue snapshot..."
          ISSUES_JSON=$(gh api repos/${{ github.repository }}/issues \
            --paginate -X GET -f state=all -f per_page=100 \
            --jq '[.[] | select(.pull_request == null) | {number, title, state}]' \
            | jq -s 'add // []')
          echo "Snapshot contains $(echo "$ISSUES_JSON" | jq 'length') existing issues."

          while IFS= read -r line; do
            # Parse markdown checkboxes: - [ ] or - [x] or - [STUCK]
            if [[ "$line" =~ ^-[[:space:]]\[([ xX]|STUCK)\][[:space:]]+(.*)$ ]]; then
              STATUS="${BASH_REMATCH[1]}"
              TITLE="${BASH_REMATCH[2]}"
              TITLE=$(echo "$TITLE" | xargs) # Trim whitespace

              if [ -z "$TITLE" ]; then continue; fi

              # Exact (not fuzzy) title match against the local snapshot.
              MATCH=$(echo "$ISSUES_JSON" | jq -c --arg t "$TITLE" '[.[] | select(.title == $t)] | sort_by(.number) | .[0]')

              if [ -z "$MATCH" ] || [ "$MATCH" == "null" ]; then
                ISSUE_NUM=""
                ISSUE_STATE=""
              else
                ISSUE_NUM=$(echo "$MATCH" | jq -r '.number')
                ISSUE_STATE=$(echo "$MATCH" | jq -r '.state')
              fi

              if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" == "null" ]; then
                # GitHub issue titles are capped at 256 characters; gh issue create
                # 422s on anything longer, which - if unguarded - leaves ISSUE_NUM
                # empty and, worse, made the jq --argjson append below error out and
                # silently wipe the entire in-memory snapshot, corrupting matching
                # for every remaining TODO.md line in the run (this is how 924 open
                # issues became 1500+ in a single push: one oversized title early in
                # the file broke state tracking for everything after it). Truncate
                # defensively instead of letting gh issue create reject it outright.
                CREATE_TITLE="$TITLE"
                if [ "${#CREATE_TITLE}" -gt 256 ]; then
                  CREATE_TITLE="${CREATE_TITLE:0:253}..."
                fi

                echo "Creating new issue for: $TITLE"
                ISSUE_URL=$(gh issue create --title "$CREATE_TITLE" --body "Tracked in TODO.md by the AI Swarm pipeline.")
                ISSUE_NUM=${ISSUE_URL##*/}

                # Never trust a create that didn't return a real numeric issue ID -
                # skip recording it rather than feed a non-numeric value into
                # --argjson, which would corrupt ISSUES_JSON for the rest of the run.
                if ! [[ "$ISSUE_NUM" =~ ^[0-9]+$ ]]; then
                  echo "::warning::gh issue create did not return a valid issue number for: $TITLE (got '$ISSUE_URL') - skipping snapshot update for this item."
                  continue
                fi

                NEW_STATE="open"
                # If the task was already completed in TODO.md, close the newly created issue immediately
                if [[ "$STATUS" == "x" || "$STATUS" == "X" || "$STATUS" == "STUCK" ]]; then
                  gh issue close "$ISSUE_NUM" -m "Completed in TODO.md"
                  NEW_STATE="closed"
                fi

                # Record it in the in-memory snapshot so a duplicate title later in
                # this same TODO.md pass is matched instead of creating another copy.
                # Use the original (untruncated) $TITLE here so later exact matches
                # against TODO.md still work even though GitHub stored the
                # truncated version.
                UPDATED_JSON=$(echo "$ISSUES_JSON" | jq --arg t "$TITLE" --argjson n "$ISSUE_NUM" --arg s "$NEW_STATE" '. + [{number: $n, title: $t, state: $s}]')
                if [ -n "$UPDATED_JSON" ]; then
                  ISSUES_JSON="$UPDATED_JSON"
                else
                  echo "::warning::Failed to update in-memory issue snapshot after creating #$ISSUE_NUM - leaving snapshot unchanged rather than corrupting it."
                fi
              else
                # Issue exists, enforce state sync. The REST API (gh api) returns
                # lowercase state values ("open"/"closed"), unlike `gh issue list
                # --json state` which normalises to uppercase - do not mix the two.
                if [[ "$STATUS" == "x" || "$STATUS" == "X" || "$STATUS" == "STUCK" ]]; then
                  if [ "$ISSUE_STATE" == "open" ]; then
                    echo "Closing issue #$ISSUE_NUM ($TITLE)"
                    gh issue close "$ISSUE_NUM" -m "This task was completed and verified autonomously by the AI Swarm pipeline."
                  fi
                else
                  if [ "$ISSUE_STATE" == "closed" ]; then
                    echo "Reopening issue #$ISSUE_NUM ($TITLE)"
                    gh issue reopen "$ISSUE_NUM"
                  fi
                fi
              fi
            fi
          done < TODO.md
