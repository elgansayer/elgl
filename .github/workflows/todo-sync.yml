name: Full Two-Way Sync (TODO.md <-> Issues)

on:
  push:
    branches:
      - main
    paths:
      - 'TODO.md'

permissions:
  issues: write
  contents: read

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync TODO.md to GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Scanning TODO.md to mirror state to GitHub Issues..."

          while IFS= read -r line; do
            # Parse markdown checkboxes: - [ ] or - [x] or - [STUCK]
            if [[ "$line" =~ ^-[[:space:]]\[([ xX]|STUCK)\][[:space:]]+(.*)$ ]]; then
              STATUS="${BASH_REMATCH[1]}"
              TITLE="${BASH_REMATCH[2]}"
              TITLE=$(echo "$TITLE" | xargs) # Trim whitespace
              
              if [ -z "$TITLE" ]; then continue; fi
              
              # Strip quotes from the search query to prevent breaking gh search syntax
              SEARCH_TITLE=$(echo "$TITLE" | tr -d '"' | tr -d "'")
              
              # Search for exact issue title in both open and closed issues (hide errors)
              ISSUE_JSON=$(gh issue list --search "\"$SEARCH_TITLE\" in:title" --state all --json number,state --jq '.[0]' 2>/dev/null || true)
              
              if [ -z "$ISSUE_JSON" ] || [ "$ISSUE_JSON" == "null" ]; then
                ISSUE_NUM=""
                ISSUE_STATE=""
              else
                ISSUE_NUM=$(echo "$ISSUE_JSON" | jq -r '.number')
                ISSUE_STATE=$(echo "$ISSUE_JSON" | jq -r '.state')
              fi
              
              if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" == "null" ]; then
                echo "Creating new issue for: $TITLE"
                ISSUE_URL=$(gh issue create --title "$TITLE" --body "Tracked in TODO.md by the AI Swarm pipeline.")
                ISSUE_NUM=${ISSUE_URL##*/}
                sleep 3 # Bypass GitHub anti-spam rate limits
                
                # If the task was already completed in TODO.md, close the newly created issue immediately
                if [[ "$STATUS" == "x" || "$STATUS" == "X" || "$STATUS" == "STUCK" ]]; then
                  gh issue close "$ISSUE_NUM" -m "Completed in TODO.md"
                fi
              else
                # Issue exists, enforce state sync
                if [[ "$STATUS" == "x" || "$STATUS" == "X" || "$STATUS" == "STUCK" ]]; then
                  if [ "$ISSUE_STATE" == "OPEN" ]; then
                    echo "Closing issue #$ISSUE_NUM ($TITLE)"
                    gh issue close "$ISSUE_NUM" -m "This task was completed and verified autonomously by the AI Swarm pipeline."
                  fi
                else
                  if [ "$ISSUE_STATE" == "CLOSED" ]; then
                    echo "Reopening issue #$ISSUE_NUM ($TITLE)"
                    gh issue reopen "$ISSUE_NUM"
                  fi
                fi
              fi
            fi
          done < TODO.md
