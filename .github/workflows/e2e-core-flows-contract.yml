name: E2E Core Product Flows Contract

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: e2e-core-flows-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  core-flows:
    name: e2e / core-product-flows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Verify core flow contract
        run: node scripts/verify-core-e2e-flows.mjs

      - name: Install E2E dependencies
        run: npm ci --legacy-peer-deps
        working-directory: e2e

      - name: Verify Playwright discovers core product flows
        run: npm test -- --list tests/auth.spec.ts tests/chat-messaging.spec.ts tests/moment-creation.spec.ts
        working-directory: e2e
