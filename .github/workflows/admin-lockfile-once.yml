name: Admin lockfile once

on:
  push:
    branches:
      - ci/admin-portal-lockfile-20260815

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/admin-portal-lockfile-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package lock
        working-directory: admin-portal
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-portal/package-lock.json
          git commit -m "chore(admin-portal): add deterministic npm lockfile"
          git push origin HEAD:ci/admin-portal-lockfile-20260815
