name: Discovery UI Contract

on:
  pull_request:
    paths:
      - 'frontend/src/app/components/discovery/discovery.component.ts'
      - 'frontend/src/app/components/discovery/discovery.component.html'
      - 'frontend/scripts/check-discovery-ui-contract.mjs'
      - '.github/workflows/discovery-ui-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/src/app/components/discovery/discovery.component.ts'
      - 'frontend/src/app/components/discovery/discovery.component.html'
      - 'frontend/scripts/check-discovery-ui-contract.mjs'
      - '.github/workflows/discovery-ui-contract.yml'
  merge_group:

permissions:
  contents: read

jobs:
  discovery-ui-contract:
    name: Matchmaking and Discovery UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Discovery UI contract
        run: node scripts/check-discovery-ui-contract.mjs
