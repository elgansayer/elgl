name: Auth Throttling Contract

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/src/app.module.ts'
      - 'backend/src/auth/**'
      - 'backend/src/password-reset/**'
      - 'backend/src/two-factor/**'
      - 'backend/src/transfer/**'
      - 'backend/src/users/**'
      - 'scripts/auth-throttling-contract.test.mjs'
      - 'docs/api-auth-throttling.md'
      - '.github/workflows/auth-throttling-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/app.module.ts'
      - 'backend/src/auth/**'
      - 'backend/src/password-reset/**'
      - 'backend/src/two-factor/**'
      - 'backend/src/transfer/**'
      - 'backend/src/users/**'
      - 'scripts/auth-throttling-contract.test.mjs'
      - 'docs/api-auth-throttling.md'
      - '.github/workflows/auth-throttling-contract.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: auth-throttling-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: backend / auth-throttling-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify sensitive endpoint throttling
        run: node --test scripts/auth-throttling-contract.test.mjs
