name: AI Architect Planner

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  architect_planning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Tier 1 - Gemini Flash Architect (Routine Planning)
        id: primary
        continue-on-error: true
        uses: All-Hands-AI/OpenHands@main
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini/gemini-3.6-flash"
          max_iterations: 15
          task: >
            You are the Lead AI Architect for this project.
            Your job is to evaluate the current state of the app against its goals.
            
            1. Read AGENTS.md, SPEC.md (if available), and the README.md to understand the project goals.
            2. Explore the codebase to assess the current implementation status.
            3. Identify gaps between the planned features and the current state.
            4. Self-modify any architecture or planning .md files (like SPEC.md or a new ROADMAP.md) to reflect the current state and next steps.
            5. Use the `gh issue create --title "..." --body "..."` command to create new actionable GitHub Issues for the missing features or bugs you found.
            
            IMPORTANT: Do not write code for these issues! Just plan, update the documentation, and create the tickets. Other agents will pick up the tickets and do the coding.

      - name: Tier 2 - Claude Sonnet Escalation (Complex Architecture)
        id: escalation
        if: steps.primary.outcome == 'failure'
        uses: anthropics/claude-code-base-action@beta
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          prompt: >
            You are the Lead AI Architect for this project.
            Your job is to evaluate the current state of the app against its goals.
            
            1. Read AGENTS.md, SPEC.md (if available), and the README.md to understand the project goals.
            2. Explore the codebase to assess the current implementation status.
            3. Identify gaps between the planned features and the current state.
            4. Self-modify any architecture or planning .md files (like SPEC.md or a new ROADMAP.md) to reflect the current state and next steps.
            5. Use the `gh issue create --title "..." --body "..."` command to create new actionable GitHub Issues for the missing features or bugs you found.
            
            IMPORTANT: Do not write code for these issues! Just plan, update the documentation, and create the tickets. Other agents will pick up the tickets and do the coding.
