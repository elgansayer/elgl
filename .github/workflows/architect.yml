name: AI Architect Planner

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  architect_planning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── TIER 1: Claude Code ────────────────────────────────────────────────
      - name: Tier 1 - Claude Code (Claude Pro via OAuth)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            You are the Lead AI Architect for this project.
            Your job is to evaluate the current state of the app against its goals.

            1. Read AGENTS.md, SPEC.md (if available), and the README.md to understand the project goals.
            2. Explore the codebase to assess the current implementation status.
            3. Identify gaps between the planned features and the current state.
            4. Self-modify ROADMAP.md or SPEC.md to reflect next steps.
            5. For each gap, create a GitHub issue using this exact command format:
               gh issue create --title "..." --body "..." --label "ai-agent-task,priority:high"
               Use priority:high for core features/bugs, priority:medium for enhancements, priority:low for nice-to-haves.

            IMPORTANT: Do NOT write code. Only plan and create tickets. Other agents handle coding.

      - name: Check if Claude created issues
        id: check_claude
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          COUNT=$(gh issue list --repo ${{ github.repository }} --label "ai-agent-task" \
            --state open --limit 1 --json number -q 'length' 2>/dev/null || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
            echo "Claude created issues successfully."
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "Claude did not create issues — falling through to Tier 2."
          fi

      # ── TIER 2: DeepSeek V3 Chat (paid fallback) ──────────────────────────
      - name: Tier 2 - OpenHands (DeepSeek V3 — paid fallback)
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.check_claude.outputs.has_issues == 'false'
        continue-on-error: true
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "deepseek/deepseek-v4-pro"
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            You are the Lead AI Architect for this project.
            Your job is to evaluate the current state of the app against its goals.

            1. Read AGENTS.md, SPEC.md (if available), and the README.md to understand the project goals.
            2. Explore the codebase to assess the current implementation status.
            3. Identify gaps between the planned features and the current state.
            4. Self-modify ROADMAP.md or SPEC.md to reflect next steps.
            5. For each gap, create a GitHub issue using this exact command format:
               gh issue create --title "..." --body "..." --label "ai-agent-task,priority:high"
               Use priority:high for core features/bugs, priority:medium for enhancements, priority:low for nice-to-haves.

            IMPORTANT: Do NOT write code. Only plan and create tickets.
          cli_args: "--max-iterations 50"

      # ── TIER 3: Gemini 3.6 Flash (last resort) ────────────────────────────
      - name: Tier 3 - OpenHands (Gemini 3.6 Flash — last resort)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.5-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            You are the Lead AI Architect for this project.

            1. Read README.md to understand the project goals.
            2. Identify the most important missing features or bugs.
            3. Create GitHub issues: gh issue create --title "..." --body "..." --label "ai-agent-task,priority:high"

            IMPORTANT: Do NOT write code. Only create tickets.
          cli_args: "--max-iterations 30"
