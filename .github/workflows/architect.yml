name: AI Architect Planner

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: architect-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Tier 1 - Claude Code (Claude Pro via OAuth)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            You are the Lead AI Architect.
            1. Read SPEC.md and ROADMAP.md.
            2. Survey the codebase to see what is missing.
            3. Use `gh issue create` to create actionable, atomic GitHub issues for missing features.
            4. Do NOT write any project code. Your only job is planning and issue creation.

      - name: Tier 2 - OpenHands (Gemini 3.6 Flash Fallback)
        id: secondary
        if: steps.primary.outcome == 'failure'
        continue-on-error: true
        uses: xinbenlv/openhands-action@main
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.6-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            You are the Lead AI Architect.
            1. Read SPEC.md and ROADMAP.md.
            2. Survey the codebase to see what is missing.
            3. Use `gh issue create` to create actionable, atomic GitHub issues for missing features.
            4. Do NOT write any project code. Your only job is planning and issue creation.
          cli_args: "--max-iterations 30"

      - name: Tier 3 - OpenHands (DeepSeek Coder Final Fallback)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@main
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "deepseek/deepseek-coder"
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            You are the Lead AI Architect.
            1. Read SPEC.md and ROADMAP.md.
            2. Survey the codebase to see what is missing.
            3. Use `gh issue create` to create actionable, atomic GitHub issues for missing features.
            4. Do NOT write any project code. Your only job is planning and issue creation.
          cli_args: "--max-iterations 30"
