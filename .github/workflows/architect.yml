name: AI Architect Planner

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  architect_planning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Tier 1 - Claude Code (Claude Pro)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            You are the Lead AI Architect for this project.
            Your job is to evaluate the current state of the app against its goals.
            
            1. Read AGENTS.md, SPEC.md (if available), and the README.md to understand the project goals.
            2. Explore the codebase to assess the current implementation status.
            3. Identify gaps between the planned features and the current state.
            4. Self-modify any architecture or planning .md files (like SPEC.md or a new ROADMAP.md) to reflect the current state and next steps.
            5. Use the `gh issue create --title "..." --body "..."` command to create new actionable GitHub Issues for the missing features or bugs you found.
            
            IMPORTANT: Do not write code for these issues! Just plan, update the documentation, and create the tickets. Other agents will pick up the tickets and do the coding.

      - name: Tier 2 - OpenHands (Gemini 3.6 Flash Fallback)
        id: secondary
        if: steps.primary.outcome == 'failure'
        continue-on-error: true
        uses: xinbenlv/openhands-action@main
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.6-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            You are the Lead AI Architect for this project.
            Your job is to evaluate the current state of the app against its goals.
            
            1. Read AGENTS.md, SPEC.md (if available), and the README.md to understand the project goals.
            2. Explore the codebase to assess the current implementation status.
            3. Identify gaps between the planned features and the current state.
            4. Self-modify any architecture or planning .md files (like SPEC.md or a new ROADMAP.md) to reflect the current state and next steps.
            5. Use the `gh issue create --title "..." --body "..."` command to create new actionable GitHub Issues for the missing features or bugs you found.
            
            IMPORTANT: Do not write code for these issues! Just plan, update the documentation, and create the tickets. Other agents will pick up the tickets and do the coding.
          cli_args: "--max-iterations 30"

      - name: Tier 3 - OpenHands (DeepSeek Coder Fallback)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@main
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "deepseek/deepseek-coder"
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            You are the Lead AI Architect for this project.
            Your job is to evaluate the current state of the app against its goals.
            
            1. Read AGENTS.md, SPEC.md (if available), and the README.md to understand the project goals.
            2. Explore the codebase to assess the current implementation status.
            3. Identify gaps between the planned features and the current state.
            4. Self-modify any architecture or planning .md files (like SPEC.md or a new ROADMAP.md) to reflect the current state and next steps.
            5. Use the `gh issue create --title "..." --body "..."` command to create new actionable GitHub Issues for the missing features or bugs you found.
            
            IMPORTANT: Do not write code for these issues! Just plan, update the documentation, and create the tickets. Other agents will pick up the tickets and do the coding.
          cli_args: "--max-iterations 50"
