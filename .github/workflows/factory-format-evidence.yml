name: Factory format evidence

on:
  pull_request:
    branches: [main]
    # This evidence job only copies, formats, diffs and uploads daemon.py. The
    # canonical Factory CI already runs Ruff format across all automation Python,
    # so starting a Python/uv runner for unrelated Factory modules cannot produce
    # additional evidence. Keep this specialised artifact only when its actual
    # input or the workflow itself changes.
    paths:
      - 'automation/openhands_factory/daemon.py'
      - '.github/workflows/factory-format-evidence.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: automation/uv.lock
      - run: uv sync --frozen --extra development
        working-directory: automation
      - run: |
          mkdir -p test-results
          cp openhands_factory/daemon.py test-results/daemon.before.py
          uv run --frozen ruff format openhands_factory/daemon.py
          diff -u test-results/daemon.before.py openhands_factory/daemon.py > test-results/daemon-format.patch || true
        working-directory: automation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: factory-format-patch-${{ github.sha }}
          path: |
            automation/test-results/daemon-format.patch
            automation/openhands_factory/daemon.py
          if-no-files-found: error
          retention-days: 1
