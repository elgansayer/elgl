name: Weekly Agent Automations

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  queue-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Queue Weekly Tasks for AI Swarm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Queueing weekly tasks..."
          
          tasks=(
            "task-weekly-dependency-update.md"
            "task-weekly-code-smell-audit.md"
            "task-weekly-database-index-optimization.md"
            "task-weekly-ui-component-audit.md"
            "task-weekly-translations-coverage.md"
            "task-weekly-e2e-coverage-report.md"
            "task-weekly-backend-memory-leak-check.md"
            "task-weekly-webrtc-latency-test.md"
            "task-weekly-seo-audit.md"
            "task-weekly-technical-debt-review.md"
          )
          
          for task in "${tasks[@]}"; do
            title=$(head -n 1 "$task" | sed 's/^# //')
            
            existing=$(gh issue list --state open --search "$title" --json number -q '.[0].number')
            
            if [ -z "$existing" ]; then
              echo "Creating new issue for: $title"
              gh issue create --title "[Weekly] $title" --body-file "$task" --label "ai-agent-task,weekly"
            else
              echo "Issue already open for $title (#$existing). Skipping."
            fi
          done
