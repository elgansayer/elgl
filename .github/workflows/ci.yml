name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A burst of serial Factory merges should test the newest integrated main,
  # not consume runners validating every superseded intermediate push.
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: CI / impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_application: ${{ steps.impact.outputs.run_application }}
      run_backend: ${{ steps.impact.outputs.run_backend }}
      run_frontend: ${{ steps.impact.outputs.run_frontend }}
      run_admin: ${{ steps.impact.outputs.run_admin }}
      run_factory: ${{ steps.impact.outputs.run_factory }}
      run_governance: ${{ steps.impact.outputs.run_governance }}
      run_database: ${{ steps.impact.outputs.run_database }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify impact classifier regression suite
        run: bash scripts/classify-ci-impact.test.sh

      - name: Classify pull-request impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Pushes and merge-queue candidates remain full health checks. Only PRs
          # receive path-sensitive savings. The shared classifier fails open for
          # unknown paths and for an empty/unreadable pull-request diff.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" \
              | bash scripts/classify-ci-impact.sh "$GITHUB_OUTPUT"
          else
            {
              echo "run_application=true"
              echo "run_backend=true"
              echo "run_frontend=true"
              echo "run_admin=true"
              echo "run_factory=true"
              echo "run_governance=true"
              echo "run_database=true"
            } >> "$GITHUB_OUTPUT"
            echo "Application verification required: true"
            echo "Factory verification required: true"
          fi

  backend-checks:
    name: backend / ${{ matrix.check }}
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSFER_SECRET: ci-test-transfer-secret
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: npm run lint:check
          - check: build
            command: npm run build
          - check: unit
            command: mkdir -p test-results && npm run test:cov -- --reporter=default --reporter=github-actions --reporter=json --outputFile=test-results/unit.json
          - check: e2e
            command: mkdir -p test-results && npm run test:e2e -- --reporter=default --reporter=github-actions --reporter=json --outputFile=test-results/e2e.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Run ${{ matrix.check }}
        id: application-check
        run: ${{ matrix.command }}
        working-directory: backend

      - name: Summarize application check
        if: always()
        env:
          CHECK_DIRECTORY: backend
          CHECK_NAME: ${{ matrix.check }}
          CHECK_OUTCOME: ${{ steps.application-check.outcome }}
        run: |
          failed_checks=0
          if [ "$CHECK_OUTCOME" != "success" ]; then
            failed_checks=1
          fi

          report=""
          if [ "$CHECK_DIRECTORY" = "backend" ] && { [ "$CHECK_NAME" = "unit" ] || [ "$CHECK_NAME" = "e2e" ]; }; then
            report="backend/test-results/${CHECK_NAME}.json"
          elif [ "$CHECK_DIRECTORY" = "frontend" ] && [ "$CHECK_NAME" = "unit" ]; then
            report="frontend/test-results/unit.json"
          elif [ "$CHECK_DIRECTORY" = "admin-portal" ] && [ "$CHECK_NAME" = "unit" ]; then
            report="admin-portal/test-results/unit.json"
          fi

          failing_suites="n/a"
          failing_tests="n/a"
          if [ -n "$report" ] && [ -f "$report" ]; then
            metrics=$(node - "$report" <<'NODE'
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const suites = report.numFailedTestSuites ?? report.numFailedTestFiles ?? 'n/a';
            const tests = report.numFailedTests ?? 'n/a';
            process.stdout.write(`${suites}\t${tests}`);
          } catch {
            process.stdout.write('n/a\tn/a');
          }
          NODE
            )
            IFS=$'\t' read -r failing_suites failing_tests <<< "$metrics"
          fi

          {
            echo "### ${CHECK_DIRECTORY} / ${CHECK_NAME}"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Outcome | ${CHECK_OUTCOME} |"
            echo "| Failing checks | ${failed_checks} |"
            echo "| Failing suites | ${failing_suites} |"
            echo "| Failing tests | ${failing_tests} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage
        if: success() && matrix.check == 'unit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed backend test report
        if: failure() && (matrix.check == 'unit' || matrix.check == 'e2e')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.check }}-failure-report-${{ github.sha }}
          path: backend/test-results/${{ matrix.check }}.json
          if-no-files-found: warn
          retention-days: 14

  frontend-checks:
    name: frontend / ${{ matrix.check }}
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: static-analysis
            command: npm run check:control-flow && npm run check:template-bindings && npm run check:rtl-logical && npm run lint:check
          - check: build
            command: npm run build
          - check: unit
            command: mkdir -p test-results && npm test -- --reporters=json --reporters=default --output-file=test-results/unit.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies without Cypress binary
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}
        working-directory: frontend
      - name: Upload failed unit report
        if: failure() && matrix.check == 'unit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-unit-failure-report-${{ github.sha }}
          path: frontend/test-results/unit.json
          if-no-files-found: warn
          retention-days: 14

  admin-checks:
    name: admin-portal / ${{ matrix.check }}
    needs: changes
    if: needs.changes.outputs.run_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: npm run lint:check
          - check: build
            command: npm run build
          - check: unit
            command: mkdir -p test-results && npm test -- --reporters=json --reporters=default --output-file=test-results/unit.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: admin-portal
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}
        working-directory: admin-portal
      - name: Upload failed unit report
        if: failure() && matrix.check == 'unit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-portal-unit-failure-report-${{ github.sha }}
          path: admin-portal/test-results/unit.json
          if-no-files-found: warn
          retention-days: 14

  constitution:
    needs: changes
    if: needs.changes.outputs.run_governance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:constitution
      - run: npm run check:agent-ui-governance
      - run: npm run check:design-sync
      - run: npm run check:design-coverage
      - name: Enforce Spartan ownership boundaries
        env:
          SPARTAN_BOUNDARY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: npm run check:spartan-boundaries
      - name: Enforce full-tree Spartan adoption
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run check:spartan-full-tree 2>&1 | tee test-results/spartan-full-tree.txt
      - name: Upload full-tree Spartan failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spartan-full-tree-failure-${{ github.sha }}
          path: test-results/spartan-full-tree.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce component-system convergence
        run: npm run check:component-system
      - name: Prevent new legacy primitive adoption
        env:
          LEGACY_PRIMITIVE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: npm run check:legacy-primitive-delta
      - name: Enforce design-sync drift on pull requests
        if: github.event_name == 'pull_request'
        env:
          DESIGN_SYNC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:design-sync-drift
      - run: node scripts/check-conflict-markers.mjs
      - name: Enforce admin audit append-only integrity
        run: node scripts/check-admin-audit-integrity.mjs
      - name: Enforce append-only, collision-free migration changes
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/check-migration-delta.mjs

  database:
    name: database / clean-reset
    needs: changes
    if: needs.changes.outputs.run_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect database-sensitive changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          run_database=false
          zero_sha=0000000000000000000000000000000000000000

          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "$zero_sha" ]; then
            run_database=true
          elif git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
            .github/workflows/ci.yml \
            scripts/prepare-supabase-clean-replay.mjs \
            supabase/ \
            backend/src/supabase/ \
            | grep -q .; then
            run_database=true
          fi

          echo "run_database=$run_database" >> "$GITHUB_OUTPUT"
          echo "Database verification required: $run_database"

      - name: Setup Node.js for pinned Supabase CLI
        if: steps.changes.outputs.run_database == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Initialize deterministic local Supabase configuration
        if: steps.changes.outputs.run_database == 'true'
        run: npx --yes supabase@2.114.0 init --force

      - name: Prepare deterministic replay of legacy migration corpus
        if: steps.changes.outputs.run_database == 'true'
        run: |
          set -euo pipefail
          mkdir -p test-results
          mv supabase/migrations supabase/migrations-source
          node scripts/prepare-supabase-clean-replay.mjs \
            supabase/migrations-source \
            supabase/migrations \
            test-results/migration-replay-map.json

      - name: Start local Supabase database
        id: supabase-start
        if: steps.changes.outputs.run_database == 'true'
        run: |
          set -euo pipefail
          mkdir -p test-results
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            attempt_log="test-results/supabase-start-attempt-${attempt}.log"
            echo "Supabase database start attempt ${attempt}/${max_attempts}"
            if npx --yes supabase@2.114.0 db start 2>&1 | tee "$attempt_log" | tee -a test-results/supabase-start.log; then
              exit 0
            fi

            if grep -Eq 'SQLSTATE|At statement:' "$attempt_log"; then
              echo "Deterministic migration failure detected; refusing to retry."
              exit 1
            fi

            if ! grep -Eiq 'toomanyrequests|rate exceeded|HTTP 429|TLS handshake timeout|connection reset|i/o timeout|temporarily unavailable|unexpected EOF' "$attempt_log"; then
              echo "Non-transient Supabase startup failure detected; refusing to retry."
              exit 1
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Supabase database failed to start after ${max_attempts} transient attempts."
              exit 1
            fi
            npx --yes supabase@2.114.0 stop --no-backup || true
            sleep $((attempt * 20))
          done

      - name: Upload Supabase startup failure log
        if: failure() && steps.changes.outputs.run_database == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supabase-start-failure-${{ github.sha }}
          path: test-results/supabase-start.log
          if-no-files-found: warn
          retention-days: 14

      - name: Rebuild database from zero using repository migration SQL
        if: steps.changes.outputs.run_database == 'true'
        run: npx --yes supabase@2.114.0 db reset

      - name: Generate schema-derived TypeScript evidence
        if: steps.changes.outputs.run_database == 'true'
        run: |
          set -euo pipefail
          max_attempts=3
          postgres_meta_version="v0.97.0"
          for attempt in $(seq 1 "$max_attempts"); do
            attempt_log="test-results/supabase-typegen-attempt-${attempt}.log"
            attempt_output="test-results/database.types.attempt-${attempt}.ts"
            echo "Supabase type generation attempt ${attempt}/${max_attempts}"

            if npx --yes supabase@2.114.0 gen types typescript --local > "$attempt_output" 2> "$attempt_log"; then
              if ! test -s "$attempt_output" || ! grep -q 'export type Database' "$attempt_output"; then
                echo "Supabase type generation returned malformed output; refusing to retry."
                cat "$attempt_log"
                exit 1
              fi
              mv "$attempt_output" test-results/database.types.ts
              exit 0
            fi

            cat "$attempt_log"
            rm -f "$attempt_output"

            # The pinned Supabase CLI fetches postgres-meta from public ECR.
            # Its anonymous data quota is occasionally exhausted for GitHub
            # runners. Supabase publishes the byte-identical multi-arch image
            # on GHCR, so seed the expected local tag before retrying.
            if grep -Fq 'public.ecr.aws/supabase/postgres-meta' "$attempt_log" \
              && grep -Eiq 'toomanyrequests|data limit exceeded' "$attempt_log"; then
              mirror_image="ghcr.io/supabase/postgres-meta:${postgres_meta_version}"
              expected_image="public.ecr.aws/supabase/postgres-meta:${postgres_meta_version}"
              echo "Public ECR quota exhausted; seeding $expected_image from Supabase GHCR mirror."
              docker pull "$mirror_image"
              docker tag "$mirror_image" "$expected_image"
            fi

            if ! grep -Eiq 'toomanyrequests|rate exceeded|HTTP 429|TLS handshake timeout|connection reset|i/o timeout|temporarily unavailable|unexpected EOF' "$attempt_log"; then
              echo "Non-transient Supabase type-generation failure detected; refusing to retry."
              exit 1
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Supabase type generation failed after ${max_attempts} transient attempts."
              exit 1
            fi

            sleep $((attempt * 20))
          done

      - name: Enforce generated Supabase type drift baseline
        if: steps.changes.outputs.run_database == 'true'
        run: |
          set -euo pipefail
          expected=$(node -p "require('./supabase/database-types.snapshot.json').sha256")
          actual=$(sha256sum test-results/database.types.ts | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Generated Supabase database types drifted from the committed snapshot."
            echo "expected=$expected"
            echo "actual=$actual"
            echo "Regenerate against a clean replay, review the schema change, then update supabase/database-types.snapshot.json in the same PR."
            exit 1
          fi
          echo "Generated Supabase types match snapshot: $actual"

      - name: Upload clean-database evidence
        if: steps.changes.outputs.run_database == 'true' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supabase-clean-reset-evidence-${{ github.sha }}
          path: |
            test-results/database.types.ts
            test-results/migration-replay-map.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop local Supabase stack
        if: always() && steps.changes.outputs.run_database == 'true'
        run: npx --yes supabase@2.114.0 stop --no-backup

  factory:
    needs: changes
    if: needs.changes.outputs.run_factory == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: automation/uv.lock
      - name: Install frozen Factory dependencies
        run: uv sync --frozen --extra development
        working-directory: automation
      - run: uv run --frozen ruff format --check .
        working-directory: automation
      - run: uv run --frozen ruff check openhands_factory tests
        working-directory: automation
      - run: uv run --frozen mypy openhands_factory
        working-directory: automation
      - run: uv run --frozen pytest
        working-directory: automation

  required-gate:
    name: CI / required
    if: always()
    needs: [changes, backend-checks, frontend-checks, admin-checks, constitution, database, factory]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize canonical CI groups
        env:
          IMPACT_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend-checks.result }}
          ADMIN_RESULT: ${{ needs.admin-checks.result }}
          CONSTITUTION_RESULT: ${{ needs.constitution.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
          RUN_BACKEND: ${{ needs.changes.outputs.run_backend }}
          RUN_FRONTEND: ${{ needs.changes.outputs.run_frontend }}
          RUN_ADMIN: ${{ needs.changes.outputs.run_admin }}
          RUN_GOVERNANCE: ${{ needs.changes.outputs.run_governance }}
          RUN_DATABASE: ${{ needs.changes.outputs.run_database }}
          RUN_FACTORY: ${{ needs.changes.outputs.run_factory }}
        run: |
          group_ok() {
            result="$1"
            required="$2"
            if [ "$required" = "true" ]; then
              [ "$result" = "success" ]
            else
              [ "$result" = "success" ] || [ "$result" = "skipped" ]
            fi
          }

          failed=0
          [ "$IMPACT_RESULT" = "success" ] || failed=$((failed + 1))
          group_ok "$BACKEND_RESULT" "$RUN_BACKEND" || failed=$((failed + 1))
          group_ok "$FRONTEND_RESULT" "$RUN_FRONTEND" || failed=$((failed + 1))
          group_ok "$ADMIN_RESULT" "$RUN_ADMIN" || failed=$((failed + 1))
          group_ok "$CONSTITUTION_RESULT" "$RUN_GOVERNANCE" || failed=$((failed + 1))
          group_ok "$DATABASE_RESULT" "$RUN_DATABASE" || failed=$((failed + 1))
          group_ok "$FACTORY_RESULT" "$RUN_FACTORY" || failed=$((failed + 1))

          {
            echo "### Canonical CI summary"
            echo
            echo "| Group | Required for this PR | Result |"
            echo "| --- | --- | --- |"
            echo "| impact-classification | true | $IMPACT_RESULT |"
            echo "| backend | $RUN_BACKEND | $BACKEND_RESULT |"
            echo "| frontend | $RUN_FRONTEND | $FRONTEND_RESULT |"
            echo "| admin | $RUN_ADMIN | $ADMIN_RESULT |"
            echo "| constitution | $RUN_GOVERNANCE | $CONSTITUTION_RESULT |"
            echo "| database | $RUN_DATABASE | $DATABASE_RESULT |"
            echo "| factory | $RUN_FACTORY | $FACTORY_RESULT |"
            echo
            echo "Failing canonical groups: **$failed**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require every relevant canonical CI group to pass
        env:
          IMPACT_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend-checks.result }}
          ADMIN_RESULT: ${{ needs.admin-checks.result }}
          CONSTITUTION_RESULT: ${{ needs.constitution.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
          RUN_BACKEND: ${{ needs.changes.outputs.run_backend }}
          RUN_FRONTEND: ${{ needs.changes.outputs.run_frontend }}
          RUN_ADMIN: ${{ needs.changes.outputs.run_admin }}
          RUN_GOVERNANCE: ${{ needs.changes.outputs.run_governance }}
          RUN_DATABASE: ${{ needs.changes.outputs.run_database }}
          RUN_FACTORY: ${{ needs.changes.outputs.run_factory }}
        run: |
          group_ok() {
            result="$1"
            required="$2"
            if [ "$required" = "true" ]; then
              [ "$result" = "success" ]
            else
              [ "$result" = "success" ] || [ "$result" = "skipped" ]
            fi
          }

          failed=0
          [ "$IMPACT_RESULT" = "success" ] || failed=1
          group_ok "$BACKEND_RESULT" "$RUN_BACKEND" || failed=1
          group_ok "$FRONTEND_RESULT" "$RUN_FRONTEND" || failed=1
          group_ok "$ADMIN_RESULT" "$RUN_ADMIN" || failed=1
          group_ok "$CONSTITUTION_RESULT" "$RUN_GOVERNANCE" || failed=1
          group_ok "$DATABASE_RESULT" "$RUN_DATABASE" || failed=1
          group_ok "$FACTORY_RESULT" "$RUN_FACTORY" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "Canonical CI did not fully pass for the relevant change groups."
            echo "impact-classification=$IMPACT_RESULT required=true"
            echo "backend=$BACKEND_RESULT required=$RUN_BACKEND"
            echo "frontend=$FRONTEND_RESULT required=$RUN_FRONTEND"
            echo "admin=$ADMIN_RESULT required=$RUN_ADMIN"
            echo "constitution=$CONSTITUTION_RESULT required=$RUN_GOVERNANCE"
            echo "database=$DATABASE_RESULT required=$RUN_DATABASE"
            echo "factory=$FACTORY_RESULT required=$RUN_FACTORY"
            exit 1
          fi

          echo "All relevant canonical CI groups passed."
