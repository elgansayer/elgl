name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - directory: backend
            node-version: '20'
          - directory: frontend
            node-version: '22'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.directory }}

      - name: Verify frontend
        if: matrix.directory == 'frontend'
        run: npm run check:control-flow && npm run check:template-bindings && npm run check:rtl-logical && npm run lint:check && npm run build && npm test
        working-directory: ${{ matrix.directory }}

      - name: Verify backend
        if: matrix.directory == 'backend'
        run: npm run lint:check && npm run build && npm test && npm run test:e2e
        working-directory: ${{ matrix.directory }}

  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:constitution
      - run: node scripts/check-conflict-markers.mjs

  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install './automation[development]'
      - run: ruff check openhands_factory tests
        working-directory: automation
      - run: mypy openhands_factory
        working-directory: automation
      - run: pytest
        working-directory: automation
