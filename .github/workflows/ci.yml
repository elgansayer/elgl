name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: ${{ matrix.directory }} / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: backend
            check: lint
            command: npm run lint:check
          - directory: backend
            check: build
            command: npm run build
          - directory: backend
            check: unit
            command: npm test
          - directory: backend
            check: e2e
            command: npm run test:e2e
          - directory: frontend
            check: static-analysis
            command: npm run check:control-flow && npm run check:template-bindings && npm run check:rtl-logical && npm run lint:check
          - directory: frontend
            check: build
            command: npm run build
          - directory: frontend
            check: unit
            command: npm test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.directory }}

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.directory }}

  constitution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:constitution
      - run: node scripts/check-conflict-markers.mjs

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install './automation[development]'
      - run: ruff check openhands_factory tests
        working-directory: automation
      - run: mypy openhands_factory
        working-directory: automation
      - run: pytest
        working-directory: automation

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - application-checks
      - constitution
      - factory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPLICATION_RESULT: ${{ needs.application-checks.result }}
      CONSTITUTION_RESULT: ${{ needs.constitution.result }}
      FACTORY_RESULT: ${{ needs.factory.result }}
    steps:
      - name: Require all canonical CI checks
        run: |
          set -euo pipefail
          printf 'application-checks=%s\nconstitution=%s\nfactory=%s\n' \
            "$APPLICATION_RESULT" "$CONSTITUTION_RESULT" "$FACTORY_RESULT"
          if [[ "$APPLICATION_RESULT" != "success" || \
                "$CONSTITUTION_RESULT" != "success" || \
                "$FACTORY_RESULT" != "success" ]]; then
            echo "One or more canonical CI jobs did not succeed."
            exit 1
          fi
