name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: ${{ matrix.directory }} / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSFER_SECRET: ci-test-transfer-secret
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: backend
            check: lint
            command: npm run lint:check
          - directory: backend
            check: build
            command: npm run build
          - directory: backend
            check: unit
            command: mkdir -p test-results && npm run test:cov -- --reporter=default --reporter=github-actions --reporter=json --outputFile=test-results/unit.json
          - directory: backend
            check: e2e
            command: mkdir -p test-results && npm run test:e2e -- --reporter=default --reporter=github-actions --reporter=json --outputFile=test-results/e2e.json
          - directory: frontend
            check: static-analysis
            command: npm run check:control-flow && npm run check:template-bindings && npm run check:rtl-logical && npm run lint:check
          - directory: frontend
            check: build
            command: npm run build
          - directory: frontend
            check: unit
            command: mkdir -p test-results && npm test -- --reporters=json --reporters=default --output-file=test-results/unit.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.directory }}

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.directory }}

      - name: Upload backend coverage
        if: success() && matrix.directory == 'backend' && matrix.check == 'unit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed backend test report
        if: failure() && matrix.directory == 'backend' && (matrix.check == 'unit' || matrix.check == 'e2e')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.check }}-failure-report-${{ github.sha }}
          path: backend/test-results/${{ matrix.check }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed frontend unit report
        if: failure() && matrix.directory == 'frontend' && matrix.check == 'unit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-unit-failure-report-${{ github.sha }}
          path: frontend/test-results/unit.json
          if-no-files-found: warn
          retention-days: 14

  constitution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:constitution
      - run: node scripts/check-conflict-markers.mjs
      - name: Enforce append-only, collision-free migration changes
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-migration-delta.mjs

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install './automation[development]'
      - run: ruff check openhands_factory tests
        working-directory: automation
      - run: mypy openhands_factory
        working-directory: automation
      - run: pytest
        working-directory: automation

  required-gate:
    name: CI / required
    if: always()
    needs: [application-checks, constitution, factory]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize canonical CI groups
        env:
          APPLICATION_CHECKS_RESULT: ${{ needs.application-checks.result }}
          CONSTITUTION_RESULT: ${{ needs.constitution.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
        run: |
          failed=0
          for result in "$APPLICATION_CHECKS_RESULT" "$CONSTITUTION_RESULT" "$FACTORY_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=$((failed + 1))
            fi
          done

          {
            echo "### Canonical CI summary"
            echo
            echo "| Group | Result |"
            echo "| --- | --- |"
            echo "| application-checks | $APPLICATION_CHECKS_RESULT |"
            echo "| constitution | $CONSTITUTION_RESULT |"
            echo "| factory | $FACTORY_RESULT |"
            echo
            echo "Failing canonical groups: **$failed**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require every canonical CI group to pass
        env:
          APPLICATION_CHECKS_RESULT: ${{ needs.application-checks.result }}
          CONSTITUTION_RESULT: ${{ needs.constitution.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
        run: |
          failed=0
          for result in "$APPLICATION_CHECKS_RESULT" "$CONSTITUTION_RESULT" "$FACTORY_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Canonical CI did not fully pass."
            echo "application-checks=$APPLICATION_CHECKS_RESULT"
            echo "constitution=$CONSTITUTION_RESULT"
            echo "factory=$FACTORY_RESULT"
            exit 1
          fi

          echo "All canonical CI groups passed."
