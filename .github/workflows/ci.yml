name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: ${{ matrix.directory }} / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSFER_SECRET: ci-test-transfer-secret
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: backend
            check: lint
            command: npm run lint:check
          - directory: backend
            check: build
            command: npm run build
          - directory: backend
            check: unit
            command: mkdir -p test-results && npm run test:cov -- --reporter=default --reporter=github-actions --reporter=json --outputFile=test-results/unit.json
          - directory: backend
            check: e2e
            command: mkdir -p test-results && npm run test:e2e -- --reporter=default --reporter=github-actions --reporter=json --outputFile=test-results/e2e.json
          - directory: frontend
            check: static-analysis
            command: npm run check:control-flow && npm run check:template-bindings && npm run check:rtl-logical && npm run lint:check
          - directory: frontend
            check: build
            command: npm run build
          - directory: frontend
            check: unit
            command: mkdir -p test-results && npm test -- --reporters=json --reporters=default --output-file=test-results/unit.json
          - directory: admin-portal
            check: lint
            command: npm run lint:check
          - directory: admin-portal
            check: spartan
            command: npm run check:spartan-info
          - directory: admin-portal
            check: build
            command: npm run build
          - directory: admin-portal
            check: unit
            command: mkdir -p test-results && npm test -- --reporters=json --reporters=default --output-file=test-results/unit.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.directory }}

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.directory }}

      - name: Upload backend coverage
        if: success() && matrix.directory == 'backend' && matrix.check == 'unit'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed test report
        if: failure() && (matrix.check == 'unit' || matrix.check == 'e2e')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.directory }}-${{ matrix.check }}-failure-report-${{ github.sha }}
          path: ${{ matrix.directory }}/test-results/${{ matrix.check }}.json
          if-no-files-found: warn
          retention-days: 14

  constitution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:constitution
      - run: npm run check:agent-ui-governance
      - run: npm run check:design-sync
      - run: npm run check:admin-ui-contract
      - run: npm run check:admin-security-contract
      - run: npm run check:product-contracts
      - run: npm run check:docs-source
      - name: Enforce Spartan ownership boundaries
        env:
          SPARTAN_BOUNDARY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:spartan-boundaries
      - name: Enforce component-system convergence
        run: npm run check:component-system
      - name: Prevent new legacy primitive adoption
        env:
          LEGACY_PRIMITIVE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:legacy-primitive-delta
      - name: Enforce design-sync drift on pull requests
        if: github.event_name == 'pull_request'
        env:
          DESIGN_SYNC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:design-sync-drift
      - run: node scripts/check-conflict-markers.mjs
      - name: Enforce admin audit append-only integrity
        run: node scripts/check-admin-audit-integrity.mjs
      - name: Enforce append-only, collision-free migration changes
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-migration-delta.mjs

  frontend-e2e:
    name: frontend / browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx cypress install
        working-directory: frontend
      - run: npm run e2e:ci
        working-directory: frontend
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-e2e-diagnostics-${{ github.sha }}
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

  visual-regression:
    name: frontend / visual contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx cypress install
        working-directory: frontend
      - run: npm run visual:capture:ci
        working-directory: frontend
      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-visual-diagnostics-${{ github.sha }}
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: automation/uv.lock
      - name: Install frozen Factory dependencies
        run: uv sync --frozen --extra development
        working-directory: automation
      - run: uv run --frozen ruff check openhands_factory tests
        working-directory: automation
      - run: uv run --frozen mypy openhands_factory
        working-directory: automation
      - run: uv run --frozen pytest
        working-directory: automation

  required-gate:
    name: CI / required
    if: always()
    needs: [application-checks, constitution, frontend-e2e, visual-regression, factory]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize canonical CI groups
        env:
          APPLICATION_CHECKS_RESULT: ${{ needs.application-checks.result }}
          CONSTITUTION_RESULT: ${{ needs.constitution.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          VISUAL_REGRESSION_RESULT: ${{ needs.visual-regression.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
        run: |
          failed=0
          for result in "$APPLICATION_CHECKS_RESULT" "$CONSTITUTION_RESULT" "$FRONTEND_E2E_RESULT" "$VISUAL_REGRESSION_RESULT" "$FACTORY_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=$((failed + 1))
            fi
          done

          {
            echo "### Canonical CI summary"
            echo
            echo "| Group | Result |"
            echo "| --- | --- |"
            echo "| application-checks | $APPLICATION_CHECKS_RESULT |"
            echo "| constitution | $CONSTITUTION_RESULT |"
            echo "| frontend-e2e | $FRONTEND_E2E_RESULT |"
            echo "| visual-regression | $VISUAL_REGRESSION_RESULT |"
            echo "| factory | $FACTORY_RESULT |"
            echo
            echo "Failing canonical groups: **$failed**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require every canonical CI group to pass
        env:
          APPLICATION_CHECKS_RESULT: ${{ needs.application-checks.result }}
          CONSTITUTION_RESULT: ${{ needs.constitution.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          VISUAL_REGRESSION_RESULT: ${{ needs.visual-regression.result }}
          FACTORY_RESULT: ${{ needs.factory.result }}
        run: |
          for result in "$APPLICATION_CHECKS_RESULT" "$CONSTITUTION_RESULT" "$FRONTEND_E2E_RESULT" "$VISUAL_REGRESSION_RESULT" "$FACTORY_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Canonical CI did not fully pass."
              echo "application-checks=$APPLICATION_CHECKS_RESULT"
              echo "constitution=$CONSTITUTION_RESULT"
              echo "frontend-e2e=$FRONTEND_E2E_RESULT"
              echo "visual-regression=$VISUAL_REGRESSION_RESULT"
              echo "factory=$FACTORY_RESULT"
              exit 1
            fi
          done

          echo "All canonical CI groups passed."
