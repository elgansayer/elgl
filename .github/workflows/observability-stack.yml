name: Observability Stack Contract

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker-compose.prod.yml'
      - 'prometheus/**'
      - 'grafana/**'
      - 'config/centrifugo/**'
      - 'scripts/verify-observability-stack*'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.prod.yml'
      - 'prometheus/**'
      - 'grafana/**'
      - 'config/centrifugo/**'
      - 'scripts/verify-observability-stack*'
      - 'package.json'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: observability-stack-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: observability / contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run observability regression tests
        run: node --test scripts/verify-observability-stack.test.mjs

      - name: Verify production observability configuration
        run: node scripts/verify-observability-stack.mjs
