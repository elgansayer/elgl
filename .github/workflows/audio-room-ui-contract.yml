name: Audio Room UI Contract

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/src/app/components/audio-room/**'
      - 'frontend/src/app/services/audio-rooms.store.ts'
      - 'scripts/verify-audio-room-ui-contract.test.mjs'
      - '.github/workflows/audio-room-ui-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/app/components/audio-room/**'
      - 'frontend/src/app/services/audio-rooms.store.ts'
      - 'scripts/verify-audio-room-ui-contract.test.mjs'
      - '.github/workflows/audio-room-ui-contract.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: audio-room-ui-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  audio-room-ui-contract:
    name: frontend / audio-room-ui-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify Audio Room UI contract
        run: node --test scripts/verify-audio-room-ui-contract.test.mjs
