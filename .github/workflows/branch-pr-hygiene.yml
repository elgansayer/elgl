name: Branch PR Hygiene

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: branch-pr-hygiene
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BASE_BRANCH: main
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit branches without creating pull requests
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          mapfile -t branches < <(
            gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          )

          orphaned=0
          integrated=0
          active_pr=0

          echo "### Branch PR hygiene audit" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is intentionally read-only. Branch existence alone must not create a pull request." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | Ahead of main | Open PR | Classification |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"

          for branch in "${branches[@]}"; do
            [[ -z "$branch" || "$branch" == "$BASE_BRANCH" ]] && continue

            remote_ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              continue
            fi

            ahead=$(git rev-list --count "origin/${BASE_BRANCH}..${remote_ref}")
            existing=$(gh pr list \
              --repo "$REPOSITORY" \
              --head "$branch" \
              --state open \
              --json number \
              --jq 'length')

            if [[ "$ahead" -eq 0 ]]; then
              classification="integrated/no unique commits"
              ((integrated += 1))
            elif [[ "$existing" -gt 0 ]]; then
              classification="active PR"
              ((active_pr += 1))
            else
              classification="orphan branch: review only; do not auto-open PR"
              ((orphaned += 1))
            fi

            printf '| `%s` | %s | %s | %s |\n' \
              "$branch" "$ahead" "$existing" "$classification" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Orphan branches requiring explicit task ownership: $orphaned" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branches with active PRs: $active_pr" >> "$GITHUB_STEP_SUMMARY"
          echo "- Integrated/no-unique-commit branches: $integrated" >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::Branch hygiene is audit-only; no pull requests were created or modified."
