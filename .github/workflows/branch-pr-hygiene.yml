name: Branch PR Hygiene

on:
  push:
    branches-ignore:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: branch-pr-hygiene
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BASE_BRANCH: main
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconcile branches with pull requests
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          if [[ "${{ github.event_name }}" == "push" ]]; then
            branches=("${GITHUB_REF_NAME}")
          else
            mapfile -t branches < <(
              gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" \
                --jq '.[].name'
            )
          fi

          open_pr_count() {
            gh pr list \
              --repo "$REPOSITORY" \
              --head "$1" \
              --state open \
              --json number \
              --jq 'length'
          }

          created=0
          skipped=0
          failed=0

          for branch in "${branches[@]}"; do
            [[ -z "$branch" || "$branch" == "$BASE_BRANCH" ]] && continue

            remote_ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              echo "::notice::Skipping deleted branch: $branch"
              ((skipped += 1))
              continue
            fi

            ahead=$(git rev-list --count "origin/${BASE_BRANCH}..${remote_ref}")
            if [[ "$ahead" -eq 0 ]]; then
              echo "::notice::No unmerged commits on $branch"
              ((skipped += 1))
              continue
            fi

            existing=$(open_pr_count "$branch")

            # A push normally comes from a producer that is about to open its own PR.
            # Give that producer a small bounded window before the hygiene fallback
            # creates a bot-authored draft. Scheduled/manual reconciliation skips this
            # grace period because any orphan found there already missed its producer.
            if [[ "$existing" -eq 0 && "${{ github.event_name }}" == "push" ]]; then
              for attempt in 1 2 3; do
                echo "::notice::Waiting for producer PR for $branch (attempt $attempt/3)"
                sleep 5
                existing=$(open_pr_count "$branch")
                [[ "$existing" -gt 0 ]] && break
              done
            fi

            if [[ "$existing" -gt 0 ]]; then
              echo "PR already exists for $branch"
              ((skipped += 1))
              continue
            fi

            title="chore: review ${branch}"
            printf -v body '%s\n\n%s\n\n%s' \
              "Automated branch-hygiene PR for \`${branch}\`." \
              "This branch is ahead of \`${BASE_BRANCH}\` and had no open pull request. The repository-wide branch hygiene workflow opened this draft PR so unmerged work remains visible to CI, review, and merge automation." \
              "Commits ahead when detected: ${ahead}."

            if gh pr create \
              --repo "$REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --draft \
              --title "$title" \
              --body "$body"; then
              echo "Created draft PR for $branch"
              ((created += 1))
            else
              echo "::error::Failed to create PR for $branch"
              ((failed += 1))
            fi
          done

          echo "### Branch PR hygiene" >> "$GITHUB_STEP_SUMMARY"
          echo "- Created: $created" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skipped: $skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: $failed" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -gt 0 ]]; then
            exit 1
          fi
