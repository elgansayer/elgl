name: Temporary workflow timeout replay

on:
  push:
    branches: [ci/workflow-timeouts-current-main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/workflow-timeouts-current-main
      - name: Apply exact timeout bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              '.github/workflows/admin-backlog-governance.yml': ('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 20\n'),
              '.github/workflows/architect.yml': ('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 90\n'),
              '.github/workflows/auto-dispatcher.yml': ('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 15\n'),
              '.github/workflows/daily-wiki-update.yml': ('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 30\n'),
              '.github/workflows/factory-merge.yml': ('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 15\n'),
              '.github/workflows/openhands.yml': ('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 90\n'),
              '.github/workflows/pr-reviewer.yml': ('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 90\n'),
              '.github/workflows/wiki-sync.yml': ('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 15\n'),
          }

          for name, (needle, replacement) in edits.items():
              path = Path(name)
              text = path.read_text()
              if 'timeout-minutes:' in text.split('steps:', 1)[0]:
                  continue
              if text.count(needle) != 1:
                  raise SystemExit(f'expected exactly one runs-on in {name}')
              path.write_text(text.replace(needle, replacement, 1))
          PY
          git rm .github/workflows/tmp-apply-workflow-timeouts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: bound remaining workflow jobs with explicit timeouts'
          git push