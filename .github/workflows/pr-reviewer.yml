name: AI PR Reviewer & Fixer

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review_and_fix:
    # This job has privileged repository credentials and may push fixes or queue merges.
    # Never run that path against a fork-controlled checkout or Dependabot PRs. Dependabot
    # events intentionally do not receive repository Actions secrets, so every AI tier would
    # fail authentication while deterministic CI/workflow checks remain available.
    if: >
      github.actor != 'claude-code[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # ── TIER 1: Claude Code ────────────────────────────────────────────────
      - name: Tier 1 - Claude Code (Claude Pro via OAuth)
        id: primary
        continue-on-error: true
        # anthropics/claude-code-action v1.0.193
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            You are the AI PR Reviewer and Fixer.
            Pull Request #${{ github.event.pull_request.number }} has been opened or updated.

            1. Review the code changes in this branch.
            2. Run the local tests and linters to verify the code is correct.
            3. Check for merge conflicts with `main`. If there are conflicts, resolve them.
            4. If tests fail or the code is substandard, write the fixes, commit, and push them to this branch.
            5. CRITICAL: Once local verification passes, queue a protected squash merge with:
               gh pr merge ${{ github.event.pull_request.number }} --auto --squash
               Never use --admin or otherwise bypass required GitHub checks or branch protection.
               If auto-merge cannot be enabled, leave the PR open for normal protected-branch merging.

      # Auto-skip: check if Claude actually merged the PR
      - name: Check if Claude merged the PR
        id: check_claude
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          STATE=$(gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" --json state -q '.state' 2>/dev/null || echo "OPEN")
          echo "pr_state=$STATE"
          if [ "$STATE" = "MERGED" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "PR already merged by Claude."
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "PR not merged — falling through to Tier 2."
          fi

      # ── TIER 2: DeepSeek V3 Chat (paid, heavy lifting) ────────────────────
      - name: Tier 2 - OpenHands (DeepSeek V3 — paid heavy fallback)
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.check_claude.outputs.merged == 'false'
        continue-on-error: true
        # xinbenlv/openhands-action v1.0.1
        uses: xinbenlv/openhands-action@fd1a7b376a5a86c29e3d1a331c75d0ea99b06e04
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "deepseek/deepseek-v4-pro"
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            You are the AI PR Reviewer and Fixer.
            Pull Request #${{ github.event.pull_request.number }} has been opened or updated.

            1. Review the code changes in this branch.
            2. Run the local tests and linters to verify the code is correct.
            3. Check for merge conflicts with `main`. If there are conflicts, resolve them.
            4. If tests fail or the code is substandard, write the fixes, commit, and push them to this branch.
            5. CRITICAL: Once local verification passes, queue a protected squash merge with:
               gh pr merge ${{ github.event.pull_request.number }} --auto --squash
               Never use --admin or otherwise bypass required GitHub checks or branch protection.
               If auto-merge cannot be enabled, leave the PR open for normal protected-branch merging.
          cli_args: "--max-iterations 50"

      # ── TIER 3: Gemini 3.6 Flash (lightweight last resort) ────────────────
      - name: Tier 3 - OpenHands (Gemini 3.6 Flash — last resort)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        # xinbenlv/openhands-action v1.0.1
        uses: xinbenlv/openhands-action@fd1a7b376a5a86c29e3d1a331c75d0ea99b06e04
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.5-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            You are the AI PR Reviewer and Fixer.
            Pull Request #${{ github.event.pull_request.number }} has been opened or updated.

            1. Review the code changes in this branch.
            2. Run local tests. Fix any failures, commit, and push.
            3. CRITICAL: Queue a protected squash merge with:
               gh pr merge ${{ github.event.pull_request.number }} --auto --squash
               Never use --admin or bypass required GitHub checks or branch protection.
               If auto-merge cannot be enabled, leave the PR open for normal protected-branch merging.
          cli_args: "--max-iterations 30"
