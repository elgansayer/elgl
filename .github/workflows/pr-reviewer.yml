name: AI PR Reviewer & Fixer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review_and_fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Tier 1 - Claude Code (Claude Pro)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-base-action@beta
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          prompt: >
            You are the AI PR Reviewer and Fixer. 
            Pull Request #${{ github.event.pull_request.number }} has been opened or updated.
            
            1. Review the code changes in this branch.
            2. Run the local tests and linters to verify the code is correct.
            3. Check for merge conflicts with `main`. If there are conflicts, resolve them.
            4. If tests fail or the code is substandard, write the fixes, commit, and push them to this branch.
            5. Once the code is perfect and all tests pass locally, you have the final authority to merge it. Use the command `gh pr merge ${{ github.event.pull_request.number }} --admin --squash` to merge it.

      - name: Tier 2 - OpenHands (Gemini 3.6 Flash Fallback)
        id: secondary
        if: steps.primary.outcome == 'failure'
        continue-on-error: true
        uses: xinbenlv/openhands-action@main
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.6-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: >
            You are the AI PR Reviewer and Fixer. 
            Pull Request #${{ github.event.pull_request.number }} has been opened or updated.
            
            1. Review the code changes in this branch.
            2. Run the local tests and linters to verify the code is correct.
            3. Check for merge conflicts with `main`. If there are conflicts, resolve them.
            4. If tests fail or the code is substandard, write the fixes, commit, and push them to this branch.
            5. Once the code is perfect and all tests pass locally, you have the final authority to merge it. Use the command `gh pr merge ${{ github.event.pull_request.number }} --admin --squash` to merge it.
          cli_args: "--max-iterations 30"

      - name: Tier 3 - OpenHands (DeepSeek Coder Fallback)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@main
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "litellm_proxy/deepseek-coder"
          llm_api_key: ${{ secrets.LITELLM_API_KEY }}
          additional_env: '{"LLM_BASE_URL": "${{ secrets.LITELLM_GATEWAY_URL }}"}'
          prompt: >
            You are the AI PR Reviewer and Fixer. 
            Pull Request #${{ github.event.pull_request.number }} has been opened or updated.
            
            1. Review the code changes in this branch.
            2. Run the local tests and linters to verify the code is correct.
            3. Check for merge conflicts with `main`. If there are conflicts, resolve them.
            4. If tests fail or the code is substandard, write the fixes, commit, and push them to this branch.
            5. Once the code is perfect and all tests pass locally, you have the final authority to merge it. Use the command `gh pr merge ${{ github.event.pull_request.number }} --admin --squash` to merge it.
          cli_args: "--max-iterations 50"
