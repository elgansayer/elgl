name: AI PR Reviewer & Fixer

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review_and_fix:
    # Guard: only skip if the PR reviewer itself pushed the commit (true self-review loop).
    # AI-created PRs (openhands-agent, jules, etc.) MUST be reviewed and merged.
    # WARNING: Do NOT block all [bot] actors — that prevents all AI PRs from being reviewed!
    if: github.actor != 'claude-code[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # ── TIER 1: Claude Code ────────────────────────────────────────────────
      - name: Tier 1 - Claude Code (Claude Pro via OAuth)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            You are the AI PR Reviewer and Fixer.
            Pull Request #${{ github.event.pull_request.number }} has been opened or updated.

            MANDATORY GATE — you MUST verify the code is correct before merging:

            1. Review the code changes in this branch.
            2. Run the FULL verification suite:
               - Backend: cd backend && npm run lint && npm run build && npm test
               - Frontend: cd frontend && npm run lint && npx ng build && npm test -- --watch=false
            3. If ANY build fails or ANY test fails, write the fixes, commit, and push them to this branch.
               Then re-run verification from step 2. Do NOT proceed until everything passes.
            4. Check for merge conflict markers (<<<<<<<, =======, >>>>>>>) in ALL files.
               If found, resolve the markers properly and re-run verification from step 2.
            5. Resolve any merge conflicts with `main` properly.
            6. CRITICAL: Only when ALL checks pass, execute:
               gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
               If GitHub blocks the merge because checks are still running:
               gh pr checks ${{ github.event.pull_request.number }} --watch
               Then retry: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch

            NEVER merge a PR with failing builds or tests. Fix everything first.

      # Auto-skip: check if Claude actually merged the PR
      - name: Check if Claude merged the PR
        id: check_claude
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state -q '.state' 2>/dev/null || echo "OPEN")
          echo "pr_state=$STATE"
          if [ "$STATE" = "MERGED" ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "PR already merged by Claude."
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "PR not merged — falling through to Tier 2."
          fi

      # ── TIER 2: DeepSeek V3 Chat (paid, heavy lifting) ────────────────────
      - name: Tier 2 - OpenHands (DeepSeek V3 — paid heavy fallback)
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.check_claude.outputs.merged == 'false'
        continue-on-error: true
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: 'deepseek/deepseek-v4-pro'
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          openhands_image: 'ghcr.io/all-hands-ai/openhands:0.32'
          runtime_image: 'ghcr.io/all-hands-ai/runtime:0.32-nikolaik'
          prompt: >
            You are the AI PR Reviewer and Fixer.
            Pull Request #${{ github.event.pull_request.number }}.

            MANDATORY before merging:
            1. Review code. 2. Run backend: cd backend && npm run build && npm test
            3. Run frontend: cd frontend && npx ng build && npm test -- --watch=false
            4. Fix any failures, re-run until all pass.
            5. Remove all conflict markers. Resolve merge conflicts properly.
            6. Only when ALL pass: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
            7. If blocked by checks: gh pr checks ${{ github.event.pull_request.number }} --watch, then retry merge.
            HARD RULE: Do NOT merge unless all builds+tests pass. Fix, commit, push to same PR, re-run. Repeat until green.
          cli_args: '--max-iterations 50'

      # ── TIER 3: Gemini 3.6 Flash (lightweight last resort) ────────────────
      - name: Tier 3 - OpenHands (Gemini 3.6 Flash — last resort)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: 'gemini/gemini-3.5-flash'
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          openhands_image: 'ghcr.io/all-hands-ai/openhands:0.32'
          runtime_image: 'ghcr.io/all-hands-ai/runtime:0.32-nikolaik'
          prompt: >
            PR #${{ github.event.pull_request.number }}. MANDATORY:
            1. Review code. 2. cd backend && npm run build && npm test
            3. cd frontend && npx ng build && npm test -- --watch=false
            4. Fix all failures, remove conflict markers.
            5. gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
            NEVER merge broken code.
          cli_args: '--max-iterations 30'
