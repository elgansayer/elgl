name: Guardian - Build Health Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            node-version: '20'
            dir: backend
          - name: frontend
            node-version: '22.22.3'
            dir: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.dir }}

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
        working-directory: ${{ matrix.dir }}

      - name: Test
        id: test
        continue-on-error: true
        run: npm test
        working-directory: ${{ matrix.dir }}

      - name: Revert breaking commits and notify
        if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh label create "guardian-alert" --color "B60205" --force --repo ${{ github.repository }} || true
          STAGE=""
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            STAGE="build"
          fi
          if [ "${{ steps.test.outcome }}" = "failure" ]; then
            STAGE="${STAGE}$([ -n "$STAGE" ] && echo ' + ' || echo '')test"
          fi

          TITLE="Guardian: ${{ matrix.name }} $STAGE failure on main"

          EXISTING=$(gh issue list --repo ${{ github.repository }} \
            --state open --search "Guardian: ${{ matrix.name }} $STAGE failure" \
            --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open for this failure."
            exit 0
          fi

          echo "Build/test failure detected on main. Finding breaking commits..."

          RECENT_MERGES=$(git log origin/main --merges --since="2 hours ago" --format="%H %s" 2>/dev/null || echo "")

          if [ -z "$RECENT_MERGES" ]; then
            RECENT_MERGES=$(git log origin/main --max-count=5 --format="%H %s" 2>/dev/null || echo "")
          fi

          REVERTED_PRS=""
          REVERT_COUNT=0

          while IFS=' ' read -r COMMIT_HASH COMMIT_MSG; do
            [ -z "$COMMIT_HASH" ] && continue

            echo "Attempting to revert: $COMMIT_HASH $COMMIT_MSG"

            if git revert "$COMMIT_HASH" --no-edit 2>/dev/null; then
              REVERT_COUNT=$((REVERT_COUNT + 1))
              PR_NUM=$(echo "$COMMIT_MSG" | grep -oP '#\K\d+' | head -1 || echo "")
              if [ -n "$PR_NUM" ]; then
                REVERTED_PRS="$REVERTED_PRS #$PR_NUM"
              fi
            else
              echo "Revert conflict for $COMMIT_HASH — skipping (needs manual fix)"
              git revert --abort 2>/dev/null || true
            fi
          done <<< "$RECENT_MERGES"

          if [ "$REVERT_COUNT" -eq 0 ]; then
            echo "No commits could be cleanly reverted. Creating issue for manual investigation."
            BODY="The ${{ matrix.name }} $STAGE is failing on main.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Automatic revert failed (conflicts). Manual investigation required."
            gh issue create \
              --repo ${{ github.repository }} \
              --title "$TITLE" \
              --body "$BODY" \
              --label "guardian-alert"
            exit 0
          fi

          echo "Reverted $REVERT_COUNT commit(s). Pushing revert to main..."
          git push origin HEAD:main

          BODY="The ${{ matrix.name }} $STAGE failed on main.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Action taken
          $REVERT_COUNT commit(s) reverted to keep main green.

          ## Reverted PRs
          $REVERTED_PRS

          Original PR branches still exist. The PR reviewer will re-verify and re-merge them once fixed inline."

          ISSUE=$(gh issue create \
            --repo ${{ github.repository }} \
            --title "$TITLE" \
            --body "$BODY" \
            --label "guardian-alert")

          echo "Created issue: $ISSUE"

          for PR_NUM in $(echo "$REVERTED_PRS" | grep -oP '\d+'); do
            gh pr comment "$PR_NUM" --repo ${{ github.repository }} \
              --body "This PR was reverted from main because ${{ matrix.name }} $STAGE failed after merge. Please fix the issue in this branch. The PR reviewer will re-verify and re-merge when green. See: $ISSUE" 2>/dev/null || true
          done
