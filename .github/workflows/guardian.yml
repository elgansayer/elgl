name: Guardian - Build Health Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            node-version: '20'
            dir: backend
          - name: frontend
            node-version: '22'
            dir: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.dir }}

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
        working-directory: ${{ matrix.dir }}

      - name: Test
        id: test
        continue-on-error: true
        run: npm test
        working-directory: ${{ matrix.dir }}

      - name: Report failure to swarm
        if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STAGE=""
          LOG=""
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            STAGE="build"
            LOG="$LOG\n\n### Build Output\n\`\`\`\nSee workflow run logs for full output\n\`\`\`"
          fi
          if [ "${{ steps.test.outcome }}" = "failure" ]; then
            STAGE="${STAGE}$([ -n "$STAGE" ] && echo ' + ' || echo '')test"
          fi

          TITLE="Guardian: ${{ matrix.name }} $STAGE failure on main"

          # Check if a similar issue is already open
          EXISTING=$(gh issue list --repo ${{ github.repository }} \
            --state open --search "Guardian: ${{ matrix.name }} $STAGE failure" \
            --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open for this failure - updating."
            gh issue comment "$EXISTING" --repo ${{ github.repository }} \
              --body "Re-occurred in [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Still failing."
          else
            BODY="The **${{ matrix.name }}** $STAGE is failing on \`main\`.

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Error details:** See the workflow logs for the full build/test output.

          /openhands-fix please investigate the workflow logs and fix the $STAGE failure."

            ISSUE=$(gh issue create \
              --repo ${{ github.repository }} \
              --title "$TITLE" \
              --body "$BODY" \
              --label "priority:high,ai-agent-task")

            echo "Created issue: $ISSUE"
          fi
