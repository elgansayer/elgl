name: Swarm Auto-Dispatcher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ["AI Auto-Resolver"]
    types:
      - completed

concurrency:
  group: swarm-dispatcher
  cancel-in-progress: false

jobs:
  dispatch_and_plan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Find Next Task
        env:
          # Use PAT_TOKEN so we can see runs triggered by PAT (not just GITHUB_TOKEN runs)
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Allow up to 3 concurrent resolvers to match per-issue parallelism
          RUNNING=$(gh run list --repo ${{ github.repository }} \
            --workflow openhands.yml --status in_progress \
            --json databaseId -q 'length' 2>/dev/null || echo "0")

          if [ "$RUNNING" -ge 3 ]; then
            echo "3 resolvers already running. Waiting for a slot."
            exit 0
          fi

          # Ensure priority labels exist
          gh label create "swarm-active"   --color "0E8A16" --force --repo ${{ github.repository }} || true
          gh label create "ai-agent-task"  --color "1D76DB" --force --repo ${{ github.repository }} || true
          gh label create "priority:high"  --color "B60205" --force --repo ${{ github.repository }} || true
          gh label create "priority:medium" --color "E4E669" --force --repo ${{ github.repository }} || true
          gh label create "priority:low"   --color "C2E0C6" --force --repo ${{ github.repository }} || true

          # Pick next issue: priority:high first, then any unlabelled, then priority:medium
          ISSUE_NUM=$(gh issue list --repo ${{ github.repository }} \
            --state open --label "priority:high" \
            --search "-label:swarm-active sort:created-asc" \
            --limit 1 --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" = "null" ]; then
            ISSUE_NUM=$(gh issue list --repo ${{ github.repository }} \
              --state open \
              --search "-label:swarm-active -label:priority:high -label:priority:medium -label:priority:low sort:created-asc" \
              --limit 1 --json number -q '.[0].number' 2>/dev/null || echo "")
          fi

          if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" = "null" ]; then
            ISSUE_NUM=$(gh issue list --repo ${{ github.repository }} \
              --state open --label "priority:medium" \
              --search "-label:swarm-active sort:created-asc" \
              --limit 1 --json number -q '.[0].number' 2>/dev/null || echo "")
          fi

          if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" = "null" ]; then
            echo "Queue is empty — nothing to dispatch."
            exit 0
          fi

          echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_ENV
          gh issue edit $ISSUE_NUM --add-label "swarm-active" --repo ${{ github.repository }}
          echo "Dispatching issue #$ISSUE_NUM"

      - name: Hand off to Builder (OpenHands)
        if: env.ISSUE_NUM != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh issue comment ${{ env.ISSUE_NUM }} --body "/openhands-fix" --repo ${{ github.repository }}

          # Move issue to In Progress on the Project Board
          OWNER="${{ github.repository_owner }}"
          NAME="${{ github.event.repository.name }}"
          sleep 1

          ITEM_JSON=$(gh api graphql \
            -F issueNum=${{ env.ISSUE_NUM }} -F owner="$OWNER" -F name="$NAME" \
            -f query='
              query($owner: String!, $name: String!, $issueNum: Int!) {
                repository(owner: $owner, name: $name) {
                  issue(number: $issueNum) {
                    projectItems(first: 1) {
                      nodes { id project { id } }
                    }
                  }
                }
              }' --jq '.data.repository.issue.projectItems.nodes[0]' || echo "")

          ITEM_ID=$(echo "$ITEM_JSON" | jq -r '.id // empty' 2>/dev/null || echo "")
          PROJECT_ID=$(echo "$ITEM_JSON" | jq -r '.project.id // empty' 2>/dev/null || echo "")

          if [ -n "$ITEM_ID" ] && [ -n "$PROJECT_ID" ] && [ "$ITEM_ID" != "null" ]; then
            FIELD_JSON=$(gh api graphql -F projectId=$PROJECT_ID -f query='
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                  }
                }
              }' --jq '.data.node.field' || echo "")

            FIELD_ID=$(echo "$FIELD_JSON" | jq -r '.id // empty' 2>/dev/null || echo "")
            OPTION_ID=$(echo "$FIELD_JSON" | jq -r '.options[]? | select(.name | ascii_downcase == "in progress") | .id // empty' 2>/dev/null || echo "")

            if [ -n "$FIELD_ID" ] && [ -n "$OPTION_ID" ] && [ "$FIELD_ID" != "null" ]; then
              echo "Moving Issue #${{ env.ISSUE_NUM }} to In Progress in Project"
              gh project item-edit --id $ITEM_ID --field-id $FIELD_ID --project-id $PROJECT_ID --single-select-option-id $OPTION_ID || true
            fi
          fi
