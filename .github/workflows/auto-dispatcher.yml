name: Swarm Auto-Dispatcher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'
  workflow_run:
    workflows: ["AI Auto-Resolver"]
    types:
      - completed

concurrency:
  group: swarm-dispatcher
  cancel-in-progress: false

jobs:
  dispatch_and_plan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Batch dispatch all available issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          MAX_CONCURRENT=100

          RUNNING=$(gh run list --repo ${{ github.repository }} \
            --workflow openhands.yml --status in_progress \
            --json databaseId -q 'length' 2>/dev/null || echo "0")

          SLOTS=$((MAX_CONCURRENT - RUNNING))
          if [ "$SLOTS" -le 0 ]; then
            echo "$RUNNING resolvers already running (max $MAX_CONCURRENT). No slots."
            exit 0
          fi

          echo "Available slots: $SLOTS (running: $RUNNING, max: $MAX_CONCURRENT)"

          gh label create "swarm-active"   --color "0E8A16" --force --repo ${{ github.repository }} || true
          gh label create "ai-agent-task"  --color "1D76DB" --force --repo ${{ github.repository }} || true
          gh label create "priority:high"  --color "B60205" --force --repo ${{ github.repository }} || true
          gh label create "priority:medium" --color "E4E669" --force --repo ${{ github.repository }} || true
          gh label create "priority:low"   --color "C2E0C6" --force --repo ${{ github.repository }} || true

          HIGH=$(gh issue list --repo ${{ github.repository }} \
            --state open --label "priority:high" \
            --search "-label:swarm-active sort:created-asc" \
            --limit "$SLOTS" --json number -q '.[].number' 2>/dev/null || echo "")

          UNLABELLED=$(gh issue list --repo ${{ github.repository }} \
            --state open \
            --search "-label:swarm-active -label:priority:high -label:priority:medium -label:priority:low sort:created-asc" \
            --limit "$SLOTS" --json number -q '.[].number' 2>/dev/null || echo "")

          MEDIUM=$(gh issue list --repo ${{ github.repository }} \
            --state open --label "priority:medium" \
            --search "-label:swarm-active sort:created-asc" \
            --limit "$SLOTS" --json number -q '.[].number' 2>/dev/null || echo "")

          LOW=$(gh issue list --repo ${{ github.repository }} \
            --state open --label "priority:low" \
            --search "-label:swarm-active sort:created-asc" \
            --limit "$SLOTS" --json number -q '.[].number' 2>/dev/null || echo "")

          ALL_ISSUES=$(printf '%s\n' $HIGH $UNLABELLED $MEDIUM $LOW | sort -u | head -n "$SLOTS")
          COUNT=$(echo "$ALL_ISSUES" | grep -c . 2>/dev/null || echo "0")

          if [ "$COUNT" -eq 0 ]; then
            echo "Queue is empty - nothing to dispatch."
            exit 0
          fi

          echo "Dispatching $COUNT issues..."
          DISPATCHED=0
          for ISSUE_NUM in $ALL_ISSUES; do
            [ -z "$ISSUE_NUM" ] && continue
            gh issue edit "$ISSUE_NUM" --add-label "swarm-active" --repo ${{ github.repository }} || true
            gh issue comment "$ISSUE_NUM" --body "/openhands-fix" --repo ${{ github.repository }} || true
            DISPATCHED=$((DISPATCHED + 1))
            echo "  [$DISPATCHED/$COUNT] Dispatched #$ISSUE_NUM"
          done
          echo "Batch dispatch complete: $DISPATCHED issues."
