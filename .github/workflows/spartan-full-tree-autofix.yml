name: Spartan full-tree autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'audit/ux-full-tree-spartan-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Generate missing Spartan interaction families
        working-directory: frontend
        run: |
          set -euo pipefail
          for component in native-select checkbox radio-group combobox autocomplete; do
            target="src/app/components/ui/${component}"
            if [ -d "$target" ]; then
              echo "${component} already owned"
              continue
            fi
            npx ng g @spartan-ng/cli:ui "$component"
          done

      - name: Apply owned Spartan control migrations
        run: |
          node scripts/migrate-spartan-owned-controls.mjs
          node scripts/migrate-spartan-native-selects.mjs

      - name: Commit migration when needed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "No Spartan generation or owned-control migration changes remain."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "refactor(ui): migrate remaining owned Spartan control families"
          git push origin "HEAD:${HEAD_BRANCH}"
