name: Temporary issue 1296 formatter

on:
  push:
    branches: [fix/1296-clean-lint-contract]

permissions:
  contents: write

jobs:
  format-backend:
    if: github.repository == 'elgansayer/elgl' && github.ref == 'refs/heads/fix/1296-clean-lint-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/1296-clean-lint-contract

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Apply canonical backend lint fixes
        working-directory: backend
        run: npm run lint

      - name: Commit canonical lint output when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- backend)" ]; then
            echo "Backend is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(backend): apply canonical lint fixes"
          git push origin HEAD:fix/1296-clean-lint-contract
