name: Truthful runtime branch patch

on:
  push:
    branches:
      - feat/truthful-runtime-failures
    paths:
      - .github/workflows/truthful-runtime-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/truthful-runtime-failures
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove the synthetic upload success URL
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'frontend/src/app/components/voice-recorder/voice-recorder.component.ts';
          let source = fs.readFileSync(file, 'utf8');
          const lines = source.split('\n');
          const targetIndex = lines.findIndex((line) => line.includes('/uploads/mock-'));
          if (targetIndex === -1) {
            throw new Error('Synthetic voice-recorder upload URL was not found');
          }

          const indent = lines[targetIndex].match(/^\s*/)?.[0] ?? '';
          lines.splice(
            targetIndex,
            1,
            `${indent}// Keep the recording local; a failed upload is not a sent recording.`,
            `${indent}return;`,
          );
          source = lines.join('\n');
          if (source.includes('/uploads/mock-')) {
            throw new Error('Synthetic upload URL remained after the patch');
          }
          fs.writeFileSync(file, source);

          const packagePath = 'package.json';
          const manifest = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          manifest.scripts['check:no-runtime-fallbacks'] =
            'node scripts/verify-no-runtime-fallbacks.mjs';
          if (!manifest.scripts.verify.includes('check:no-runtime-fallbacks')) {
            manifest.scripts.verify = manifest.scripts.verify.replace(
              'npm run check:no-aws-sdk &&',
              'npm run check:no-aws-sdk && npm run check:no-runtime-fallbacks &&',
            );
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Install and verify the affected applications
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd frontend
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write src/app/components/voice-recorder/voice-recorder.component.ts
          npm run build
          cd ../backend
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx prettier --write \
            src/notifications/notifications.service.ts \
            src/notifications/notifications.service.spec.ts \
            src/discovery/discovery.service.ts \
            src/discovery/discovery.service.spec.ts \
            src/users/users.service.ts \
            src/users/users.service.spec.ts
          npm run build
          npx vitest run \
            src/notifications/notifications.service.spec.ts \
            src/discovery/discovery.service.spec.ts \
            src/users/users.service.spec.ts
          cd ..
          node scripts/verify-no-runtime-fallbacks.mjs

      - name: Commit the truthful failure migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json frontend/src/app/components/voice-recorder/voice-recorder.component.ts backend/src scripts/verify-no-runtime-fallbacks.mjs
          git commit -m 'fix(correctness): remove fictional runtime fallbacks'
          git push origin HEAD:feat/truthful-runtime-failures
