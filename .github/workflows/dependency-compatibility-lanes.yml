name: Dependency Compatibility Lanes

on:
  workflow_run:
    workflows: ['Dependency review']
    types: [completed]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: dependency-compatibility-lanes
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Verify compatibility lane classifier
        run: node --test scripts/dependency-compatibility-lanes.test.mjs

      - name: Reconcile major dependency lanes
        run: node scripts/dependency-compatibility-lanes.mjs
