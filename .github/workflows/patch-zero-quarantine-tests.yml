name: Patch zero-quarantine branch tests

on:
  push:
    branches:
      - perf/factory-zero-quarantine-autoretry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'elgansayer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/factory-zero-quarantine-autoretry
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply focused retry/test migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          jobs_path = Path('automation/openhands_factory/jobs.py')
          jobs = jobs_path.read_text(encoding='utf-8')
          old = '''            previous_jobs = self._load()\n            for task_id, job in jobs.items():\n                previous = previous_jobs.get(task_id)\n                if job.last_error and job.attempts > 0:\n'''
          new = '''            previous_jobs = self._load()\n            now = datetime.now(UTC)\n            for task_id, job in jobs.items():\n                previous = previous_jobs.get(task_id)\n                if job.state is JobState.QUARANTINED:\n                    self._resume_legacy_quarantine(job, now)\n                    continue\n                if job.last_error and job.attempts > 0:\n'''
          if old not in jobs:
              raise SystemExit('save() migration anchor not found')
          jobs = jobs.replace(old, new, 1)

          old = '''            previous = jobs.get(job.task.identifier)\n            if job.last_error and job.attempts > 0:\n                if self._retry_transition_changed(previous, job):\n                    self._apply_retry_policy(previous, job)\n            elif previous is not None and self._made_meaningful_progress(previous, job):\n'''
          new = '''            previous = jobs.get(job.task.identifier)\n            if job.state is JobState.QUARANTINED:\n                self._resume_legacy_quarantine(job, datetime.now(UTC))\n            elif job.last_error and job.attempts > 0:\n                if self._retry_transition_changed(previous, job):\n                    self._apply_retry_policy(previous, job)\n            elif previous is not None and self._made_meaningful_progress(previous, job):\n'''
          if old not in jobs:
              raise SystemExit('save_job() migration anchor not found')
          jobs = jobs.replace(old, new, 1)
          jobs_path.write_text(jobs, encoding='utf-8')

          tests_path = Path('automation/tests/test_pipeline.py')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_function(name: str, source: str) -> None:
              global tests
              pattern = re.compile(rf'^def {re.escape(name)}\(.*?(?=^def |\Z)', re.M | re.S)
              updated, count = pattern.subn(source.rstrip() + '\n\n', tests, count=1)
              if count != 1:
                  raise SystemExit(f'test function anchor not found: {name}')
              tests = updated

          replace_function(
              'test_refresh_preserves_labels_backed_by_durable_quarantine',
              '''def test_refresh_migrates_durable_quarantine_and_clears_stale_label(tmp_path: Path) -> None:
              github = GitHub()
              pipeline = FactoryPipeline(config(tmp_path), github=github)  # type: ignore[arg-type]
              job = pipeline.jobs.reconcile(github.tasks)["42"]
              job.state = JobState.QUARANTINED
              job.attempts = 3
              job.last_error = "Repeated deterministic task failure"
              job.failure_counts = {"task": 3}
              job.last_failure_kind = "task"
              job.last_failure_fingerprint = "legacy-task-failure"
              job.repeated_failure_count = 3
              job.quarantine_reason = "Repeated deterministic task failure"
              job.quarantined_at = datetime.now(UTC)
              pipeline.jobs.save_job(job)
              github.quarantined_issues = [42]

              refreshed = pipeline.refresh()

              assert refreshed["42"].state is JobState.DISCOVERED
              assert refreshed["42"].next_attempt_at is not None
              assert refreshed["42"].quarantine_reason is None
              assert refreshed["42"].quarantined_at is None
              assert github.requeued_quarantines == [([42], False)]
              assert github.quarantined_issues == []''',
          )

          replace_function(
              'test_repeated_identical_task_failure_opens_recoverable_quarantine',
              '''def test_repeated_identical_task_failure_escalates_autonomous_backoff(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              github = GitHub()
              pipeline = FactoryPipeline(
                  config(tmp_path),
                  github=github,  # type: ignore[arg-type]
                  conversations=FailingConversations(),  # type: ignore[arg-type]
              )
              job = pipeline.refresh()["42"]
              job.state = JobState.IMPLEMENTING
              pipeline.jobs.save({"42": job})
              _seed_prompts(pipeline.config.worktree_dir / "issue-42" / "automation/prompts")
              monkeypatch.setattr(GitWorkflow, "change_fingerprint", lambda workflow: "unchanged")

              first = pipeline.run_job("42")
              second = pipeline.run_job("42")
              third = pipeline.run_job("42")

              assert first is not None and first.attempts == 1
              assert second is not None and second.attempts == 2
              assert third is not None and third.attempts == 3
              assert third.state is JobState.IMPLEMENTING
              assert third.next_attempt_at is not None
              assert third.next_attempt_at > datetime.now(UTC) + timedelta(minutes=29)
              assert third.quarantine_reason is None
              assert third.quarantined_at is None
              assert not third.quarantine_notification_pending
              assert (42, ("factory-quarantined",)) not in github.labels
              assert not any("manually requeue" in body.lower() for _, body in github.comments)''',
          )

          replace_function(
              'test_no_change_task_failure_is_bounded_without_disabling_provider',
              '''def test_no_change_task_failure_is_bounded_without_disabling_provider(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              github = GitHub()
              pipeline = FactoryPipeline(
                  config(tmp_path),
                  github=github,  # type: ignore[arg-type]
                  conversations=Conversations(),  # type: ignore[arg-type]
              )
              job = pipeline.refresh()["42"]
              job.state = JobState.IMPLEMENTING
              pipeline.jobs.save({"42": job})
              _seed_prompts(pipeline.config.worktree_dir / "issue-42" / "automation/prompts")
              monkeypatch.setattr(GitWorkflow, "change_fingerprint", lambda workflow: "unchanged")
              monkeypatch.setattr(GitWorkflow, "remove_worktree", lambda workflow, path, **kwargs: None)

              first = pipeline.run_job("42")
              second = pipeline.run_job("42")
              third = pipeline.run_job("42")

              assert first is not None and first.attempts == 1
              assert second is not None and second.attempts == 2
              assert third is not None and third.attempts == 3
              assert third.state is JobState.IMPLEMENTING
              assert third.next_attempt_at is not None
              assert third.next_attempt_at > datetime.now(UTC) + timedelta(minutes=29)
              assert [entry.get("failure_classification") for entry in third.provider_history[-3:]] == [
                  "task_failure",
                  "task_failure",
                  "task_failure",
              ]
              assert github.closed == []
              assert (42, ("factory-quarantined",)) not in github.labels
              assert not any("manually requeue" in body.lower() for _, body in github.comments)
              assert not any("already satisfied" in body for _, body in github.comments)''',
          )

          replace_function(
              'test_refresh_preserves_a_quarantined_job_whose_issue_is_still_open',
              '''def test_refresh_preserves_backing_off_failed_job_whose_issue_is_still_open(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              github = GitHub()
              pipeline = FactoryPipeline(
                  config(tmp_path),
                  github=github,  # type: ignore[arg-type]
                  conversations=FailingConversations(),  # type: ignore[arg-type]
              )
              job = pipeline.refresh()["42"]
              job.state = JobState.IMPLEMENTING
              pipeline.jobs.save({"42": job})
              _seed_prompts(pipeline.config.worktree_dir / "issue-42" / "automation/prompts")
              monkeypatch.setattr(GitWorkflow, "change_fingerprint", lambda workflow: "unchanged")

              for _ in range(4):
                  pipeline.run_job("42")

              refreshed = pipeline.refresh()

              assert refreshed["42"].state is JobState.IMPLEMENTING
              assert refreshed["42"].last_error == "Conversation exceeded the maximum task duration"
              assert refreshed["42"].next_attempt_at is not None
              assert refreshed["42"].next_attempt_at > datetime.now(UTC) + timedelta(minutes=59)
              assert refreshed["42"].quarantine_reason is None
              assert refreshed["42"].quarantined_at is None''',
          )

          replace_function(
              'test_security_review_repeated_task_failure_opens_quarantine',
              '''def test_security_review_repeated_task_failure_escalates_autonomous_backoff(
              tmp_path: Path,
          ) -> None:
              github = GitHub()
              pipeline = FactoryPipeline(
                  config(tmp_path),
                  github=github,  # type: ignore[arg-type]
                  conversations=FailingConversations(),  # type: ignore[arg-type]
              )
              job = pipeline.refresh()["42"]
              job.state = JobState.SECURITY_REVIEW
              pipeline.jobs.save({"42": job})

              first = pipeline.run_job("42")
              second = pipeline.run_job("42")
              third = pipeline.run_job("42")

              assert first is not None and first.attempts == 1
              assert second is not None and second.attempts == 2
              assert third is not None and third.attempts == 3
              assert third.state is JobState.SECURITY_REVIEW
              assert third.next_attempt_at is not None
              assert third.next_attempt_at > datetime.now(UTC) + timedelta(minutes=29)
              assert third.quarantine_reason is None
              assert third.quarantined_at is None''',
          )

          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "factory-efficiency-audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/openhands_factory/jobs.py automation/tests/test_pipeline.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(factory): align pipeline coverage with autonomous retry"
          git push origin HEAD:perf/factory-zero-quarantine-autoretry
