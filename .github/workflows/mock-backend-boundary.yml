name: Mock Backend Production Boundary

on:
  pull_request:
    # Start from every path, exclude Factory-only surfaces the verifier does not
    # inspect, then re-include every production-artifact marker it recognizes.
    # Ordering matters: later positive patterns re-include matches after `!`.
    paths:
      - '**'
      - '!automation/**/*.py'
      - '!automation/prompts/**'
      - '!factory-dashboard/**'
      - '!config/factory/**'
      - '!config/systemd/**'
      - '!docs/**'
      - '**/*[Dd][Oo][Cc][Kk][Ee][Rr][Ff][Ii][Ll][Ee]*'
      - '**/*[Dd][Oo][Cc][Kk][Ee][Rr][Ff][Ii][Ll][Ee]*/**'
      - '**/*[Dd][Oo][Cc][Kk][Ee][Rr]-[Cc][Oo][Mm][Pp][Oo][Ss][Ee]*'
      - '**/*[Dd][Oo][Cc][Kk][Ee][Rr]-[Cc][Oo][Mm][Pp][Oo][Ss][Ee]*/**'
      - '**/*.[Pp][Rr][Oo][Dd][Uu][Cc][Tt][Ii][Oo][Nn]*'
      - '**/*.[Pp][Rr][Oo][Dd][Uu][Cc][Tt][Ii][Oo][Nn]*/**'
      - '**/*.[Pp][Rr][Oo][Dd].*'
      - '**/*.[Pp][Rr][Oo][Dd].*/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mock-backend-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production fixture boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test boundary verifier
        run: node --test scripts/verify-mock-backend-boundary.test.mjs
      - name: Verify production cannot activate fixtures
        run: node scripts/verify-mock-backend-boundary.mjs
