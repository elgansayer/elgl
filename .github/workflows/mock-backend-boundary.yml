name: Mock Backend Production Boundary

on:
  pull_request:
    # The verifier reads application/deployment inputs and all workflow files, but
    # Factory-only Python/config/docs cannot change its result. Avoid allocating a
    # runner or holding CI convergence open for those autonomous maintenance PRs.
    paths-ignore:
      - 'automation/**'
      - 'config/factory/**'
      - 'config/systemd/**'
      - 'docs/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mock-backend-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production fixture boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test boundary verifier
        run: node --test scripts/verify-mock-backend-boundary.test.mjs
      - name: Verify production cannot activate fixtures
        run: node scripts/verify-mock-backend-boundary.mjs
