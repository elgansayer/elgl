name: Format zero-quarantine branch tests

on:
  push:
    branches:
      - perf/factory-zero-quarantine-autoretry

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'elgansayer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/factory-zero-quarantine-autoretry
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.5'
      - name: Format focused test file
        working-directory: automation
        run: uvx ruff@0.16.3 format tests/test_pipeline.py
      - name: Commit formatting
        run: |
          git config user.name "factory-efficiency-audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/tests/test_pipeline.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(factory): format autonomous retry tests"
          git push origin HEAD:perf/factory-zero-quarantine-autoretry
