name: AI Fast Resolver

on:
  issue_comment:
    types: [created]

concurrency:
  group: fast-resolver-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    if: contains(github.event.comment.body, '/fast-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check SKIP_CLAUDE
        id: skip
        run: |
          if [ "${{ vars.SKIP_CLAUDE || 'false' }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Tier 1 - Claude Code
        if: steps.skip.outputs.skip != 'true'
        id: primary
        continue-on-error: true
        timeout-minutes: 5
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            Fix issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".

            ## INLINE FIX PROTOCOL - check first:
            Check if an open PR already references this issue:
              gh pr list --repo ${{ github.repository }} --search "Fixes #${{ github.event.issue.number }} in:body" --state open --json number,headRefName
            If an existing PR is found: checkout its branch, fix inline, commit+push to that branch. Do NOT create a duplicate PR.
            If no PR exists: create one at the final step.

            MANDATORY before pushing:
            1. Write the fix.
            2. cd backend && npm run build && npm test
            3. cd frontend && npx ng build && npm test -- --watch=false
            4. If ANYTHING fails, FIX IT and re-run from step 2.
            5. Remove all conflict markers (<<<<<<<, =======, >>>>>>>).
            6. Only when EVERYTHING passes: commit and push.
            7. If no existing PR: create one.
            HARD RULE: Do NOT push unless all builds+tests pass.

      - name: Check PR
        id: check
        if: github.event.issue.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ISSUE="${{ github.event.issue.number }}"
          COUNT=$(gh pr list --repo ${{ github.repository }} --search "Fixes #${ISSUE} in:body" --state open --json number -q 'length' 2>/dev/null || echo "0")
          if [ "$COUNT" -gt 0 ]; then echo "pr_exists=true" >> $GITHUB_OUTPUT; echo "PR exists.";
          else echo "pr_exists=false" >> $GITHUB_OUTPUT; echo "No PR yet."; fi

      - name: Tier 2 - DeepSeek
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.primary.outcome == 'skipped' || steps.check.outputs.pr_exists == 'false'
        continue-on-error: true
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: 'deepseek/deepseek-v4-pro'
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          prompt: >
            Fix issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".

            ## INLINE FIX PROTOCOL - check first:
            Check if an open PR already references this issue:
              gh pr list --repo ${{ github.repository }} --search "Fixes #${{ github.event.issue.number }} in:body" --state open --json number,headRefName
            If an existing PR is found: checkout its branch, fix inline, commit+push to that branch. Do NOT create a duplicate PR.
            If no PR exists: create one at the final step.

            MANDATORY: build + test both backend and frontend.
            Fix all failures, remove conflict markers. Commit+push when green.
            If no existing PR: gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"
          cli_args: '--max-iterations 80'
          openhands_image: 'ghcr.io/all-hands-ai/openhands:0.32'
          runtime_image: 'ghcr.io/all-hands-ai/runtime:0.32-nikolaik'

      - name: Tier 3 - Gemini
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: 'gemini/gemini-3.5-flash'
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: >
            Fix issue #${{ github.event.issue.number }}.

            ## INLINE FIX PROTOCOL - check first:
            Check if an open PR already references this issue.
            If yes: checkout its branch, fix inline, commit+push. Do NOT create a duplicate.
            If no: create a new PR.

            Build, test, fix failures, commit+push.
            If no existing PR: gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"
          cli_args: '--max-iterations 40'
          openhands_image: 'ghcr.io/all-hands-ai/openhands:0.32'
          runtime_image: 'ghcr.io/all-hands-ai/runtime:0.32-nikolaik'
