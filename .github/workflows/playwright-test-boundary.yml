name: Playwright Test Boundary

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'e2e/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'e2e/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
  merge_group:

permissions:
  contents: read

concurrency:
  group: playwright-test-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Playwright test isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run boundary regression tests
        run: node --test scripts/verify-playwright-test-boundary.test.mjs

      - name: Verify tracked Playwright invocations
        run: node scripts/verify-playwright-test-boundary.mjs
