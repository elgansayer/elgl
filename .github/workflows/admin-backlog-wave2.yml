name: Seed advanced admin backlog wave 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-backlog-wave2.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: admin-backlog-wave2
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Create advanced admin issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'elgl-admin-wave2-seeder',
          }

          domains = [
              'Coordinated Harassment', 'Ban Evasion', 'Impersonation & Identity Abuse',
              'Scams & Phishing', 'Raids & Brigading', 'Account Takeover Response',
              'Safety Appeals', 'Moderator Quality Assurance', 'Evidence Preservation',
              'Trust Signals & Risk Scoring', 'Social Graph Integrity', 'Follow & Invite Abuse',
              'Group Safety Operations', 'Direct Message Safety', 'Live Room Safety',
              'Livestream Operations', 'Content Quarantine', 'Viral Content Response',
              'Policy Labels & Context', 'Child Safety Escalations', 'Teen Safety Operations',
              'Creator & Influencer Operations', 'Community Governance', 'User Verification Operations',
              'AI Safety Operations', 'AI Model Governance', 'AI Cost & Usage', 'Prompt Governance',
              'AI Evaluation & Red Teaming', 'AI Moderation Review', 'Language Content Operations',
              'Tutor Quality Operations', 'Dictionary & Vocabulary Corrections', 'Reading Content Operations',
              'Classroom Operations', 'Language Party Operations', 'Pronunciation & Audio Review',
              'Search Integrity', 'Recommendation Integrity', 'Trending & Discovery Integrity',
              'Distributed Tracing', 'Error & Exception Management', 'SLO & Error Budgets',
              'Dependency Health', 'Deployment & Rollback Operations', 'Schema & Migration Control',
              'Queue & Worker Operations', 'CDN & Media Delivery', 'WebSocket & Centrifugo Operations',
              'LiveKit Operations', 'Privacy Incident Response', 'Data Residency', 'Consent Governance',
              'Legal Holds', 'Investigation Workspaces', 'Case Management', 'Operator Notifications',
              'Admin Accessibility', 'Admin Command Palette', 'Just-In-Time Privileged Access',
              'Break Glass Access', 'Admin Device Trust', 'Admin Session Security',
              'Operational Runbooks', 'Platform Kill Switches', 'Abuse Experimentation Controls'
          ]

          actions = [
              ('Build dedicated admin dashboard and triage queue', 'Provide an operator-focused dashboard with prioritized work, saved filters, bounded pagination and clear ownership state.'),
              ('Add investigation detail view with linked evidence', 'Create a safe investigation view that correlates relevant entities, events and evidence while redacting unrelated sensitive data.'),
              ('Add backend capability set and policy enforcement', 'Define granular server-side capabilities for read, investigate, mutate, approve and export operations in this domain.'),
              ('Add automated detection and explainable signals', 'Produce explainable risk signals with confidence, provenance and tunable thresholds; automation must never bypass policy checks.'),
              ('Add reversible intervention actions', 'Support domain-specific reversible interventions with reason codes, expiry, restoration and explicit state transitions.'),
              ('Add high-risk action approval and step-up flow', 'Require recent strong authentication and independent approval for selected high-impact or privacy-sensitive actions.'),
              ('Add immutable audit and correlation events', 'Record actor, target, action, reason, result, correlation ID and relevant policy version without storing secrets.'),
              ('Add bulk operations with preview and dry run', 'Allow bounded bulk operations only after previewing targets, exclusions, expected effects and maximum batch size.'),
              ('Add anomaly metrics alerts and SLOs', 'Expose sanitized metrics, anomaly alerts, latency/failure indicators and service-level objectives suitable for operations.'),
              ('Add retention redaction and export policy', 'Implement minimization, retention, deletion, legal-hold and export rules appropriate to the sensitivity of this domain.'),
              ('Add failure recovery idempotency and concurrency tests', 'Cover retries, duplicate requests, races, partial failures and recovery while preventing conflicting admin mutations.'),
              ('Add OpenAPI contract typed client and end-to-end tests', 'Document stable APIs, generate typed admin client support and test authorized, unauthorized, stale-session and audit behavior end to end.')
          ]

          def request(method, url, payload=None, retries=10):
              data = None if payload is None else json.dumps(payload).encode()
              for attempt in range(retries):
                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          raw = resp.read()
                          return resp.status, json.loads(raw) if raw else None
                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode(errors='replace')
                      if exc.code in (403, 429, 500, 502, 503, 504) and attempt + 1 < retries:
                          retry_after = exc.headers.get('Retry-After')
                          delay = float(retry_after) if retry_after else min(90, 2 ** attempt)
                          print(f'retry {exc.code} in {delay}s: {raw[:240]}')
                          time.sleep(delay)
                          continue
                      raise RuntimeError(f'GitHub API {exc.code}: {raw}') from exc

          existing = set()
          page = 1
          while True:
              _, rows = request('GET', f'{api}/issues?state=all&per_page=100&page={page}')
              if not rows:
                  break
              existing.update(x.get('title', '') for x in rows)
              if len(rows) < 100:
                  break
              page += 1

          target = 600
          created = skipped = 0
          for domain in domains:
              for action, detail in actions:
                  title = f'Advanced Admin {domain}: {action}'
                  if title in existing:
                      skipped += 1
                      continue
                  body = f'''## Goal\nBuild a production-grade **{domain}** capability for the dedicated admin platform.\n\n## Scope\n{detail}\n\n## Security and safety requirements\n- Backend authorization is authoritative; hiding UI is never an access-control mechanism.\n- Apply least privilege and return only data required for the operator task.\n- Never expose passwords, authentication secrets, provider keys or raw service-role credentials.\n- Require structured reason codes for sensitive mutations and preserve tamper-evident audit events.\n- Prefer reversible, time-bounded interventions and explicit restoration paths.\n- Require stronger authentication/approval for destructive, privacy-sensitive or unusually broad actions.\n- Build accessibility for keyboard, screen reader, high zoom and colour-independent state cues into the admin frontend.\n- Add automated tests for success, denial, cross-scope access, stale sessions, concurrency, failure recovery and audit behavior.\n\n## Deliverables\n- NestJS `/api/admin/v1` backend support where applicable.\n- Dedicated `admin-portal/` UI where operator interaction is required.\n- Stable OpenAPI/error semantics and observability hooks.\n'''
                  _, issue = request('POST', f'{api}/issues', {'title': title, 'body': body})
                  created += 1
                  existing.add(title)
                  print(f"created #{issue.get('number')}: {title}")
                  if created >= target:
                      print(f'completed wave2 target: created={created}, skipped={skipped}')
                      raise SystemExit(0)
                  time.sleep(1.05)

          if created < target:
              raise SystemExit(f'Only generated {created}; target was {target}')
          PY
# wave2-trigger: 2
