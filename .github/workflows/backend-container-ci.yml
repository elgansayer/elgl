name: Backend container CI

on:
  pull_request:
    branches: [main]
    paths:
      - backend/Dockerfile
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/backend-container-ci.yml
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: backend-container-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: backend-container / production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production backend image
        run: docker build --target production --tag "elgl-api-ci:${GITHUB_SHA}" backend

      - name: Diagnose Angular packages in production image
        run: |
          docker run --rm "elgl-api-ci:${GITHUB_SHA}" sh -ec '
            echo "=== npm dependency tree ==="
            npm ls @angular/compiler @angular/compiler-cli @angular/core @angular/platform-browser @angular/platform-browser-dynamic @angular/router --all || true
            echo "=== physical Angular package directories ==="
            find node_modules/@angular -maxdepth 2 -type f -name package.json -print 2>/dev/null || true
            echo "=== installed Angular versions ==="
            for package in compiler compiler-cli core platform-browser platform-browser-dynamic router; do
              if [ -f "node_modules/@angular/${package}/package.json" ]; then
                node -e "const p=require(\"./node_modules/@angular/${package}/package.json\"); console.log(p.name, p.version)"
              fi
            done
            echo "=== hidden npm lock Angular entries ==="
            if [ -f node_modules/.package-lock.json ]; then
              grep -n '"'"'node_modules/@angular/'"'"' node_modules/.package-lock.json || true
            fi
          '

      - name: Scan production backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "elgl-api-ci:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m0s
