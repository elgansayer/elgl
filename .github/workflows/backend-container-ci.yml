name: Backend container CI

on:
  pull_request:
    branches: [main]
    paths:
      - backend/Dockerfile
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/backend-container-ci.yml
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: backend-container-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: backend-container / production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production backend image
        run: docker build --pull --target production --tag "elgl-api-ci:${GITHUB_SHA}" backend

      # Released images up to 82f20b959 built to dist/src/main.js while CMD runs
      # dist/main, so they could not start. Prove the entrypoint loads: without
      # production configuration the app must reach its own fail-closed check.
      - name: Verify production entrypoint starts
        run: |
          set -euo pipefail
          image="elgl-api-ci:${GITHUB_SHA}"
          test "$(docker inspect --format '{{json .Config.Cmd}}' "$image")" = '["node","dist/main"]'
          docker run --rm "$image" test -f dist/main.js
          output=$(docker run --rm -e NODE_ENV=production "$image" 2>&1 || true)
          if ! grep -q 'Production environment is missing required variables' <<<"$output"; then
            echo "Production entrypoint did not reach configuration validation:"
            echo "$output" | tail -20
            exit 1
          fi

      - name: Diagnose Angular packages in production image
        run: |
          docker run --rm "elgl-api-ci:${GITHUB_SHA}" sh -ec '
            echo "=== npm dependency tree ==="
            npm ls @angular/compiler @angular/compiler-cli @angular/core @angular/platform-browser @angular/platform-browser-dynamic @angular/router --all || true
            echo "=== physical Angular package directories ==="
            find node_modules/@angular -maxdepth 2 -type f -name package.json -print 2>/dev/null || true
            echo "=== installed Angular versions ==="
            for package in compiler compiler-cli core platform-browser platform-browser-dynamic router; do
              if [ -f "node_modules/@angular/${package}/package.json" ]; then
                node -e "const p=require(\"./node_modules/@angular/${package}/package.json\"); console.log(p.name, p.version)"
              fi
            done
            echo "=== hidden npm lock Angular entries ==="
            if [ -f node_modules/.package-lock.json ]; then
              grep -n '"'"'node_modules/@angular/'"'"' node_modules/.package-lock.json || true
            fi
          '

      - name: Scan production backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "elgl-api-ci:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m
