name: PR 7585 backend lint autofix

on:
  push:
    branches:
      - docs/6192-external-profile-spartan-audit

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: docs/6192-external-profile-spartan-audit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Apply deterministic backend lint fixes
        working-directory: backend
        run: npm run lint

      - name: Verify backend lint
        working-directory: backend
        run: npm run lint:check

      - name: Commit lint fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend; then
            echo "No backend lint changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(backend): apply lint fixes"
          git push origin HEAD:docs/6192-external-profile-spartan-audit
