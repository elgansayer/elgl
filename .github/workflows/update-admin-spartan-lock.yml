name: Update admin Spartan lock

on:
  push:
    branches: [hardening/complete-repo-audit-20260816]
    paths:
      - admin-portal/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/complete-repo-audit-20260816
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json
      - name: Regenerate admin lockfile
        working-directory: admin-portal
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-portal/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(admin): refresh Spartan dependency lock"
          git push origin HEAD:hardening/complete-repo-audit-20260816
