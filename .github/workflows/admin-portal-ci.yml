name: Admin portal CI

on:
  pull_request:
    paths:
      - 'admin-portal/**'
      - 'backend/src/admin/**'
      - '.github/workflows/admin-portal-ci.yml'
  push:
    branches: [main]
    paths:
      - 'admin-portal/**'
      - 'backend/src/admin/**'
      - '.github/workflows/admin-portal-ci.yml'

permissions:
  contents: read

jobs:
  admin-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json
      - name: Install admin portal dependencies
        working-directory: admin-portal
        run: npm ci
      - name: Lint admin portal
        working-directory: admin-portal
        run: npm run lint:check
      - name: Test admin portal
        working-directory: admin-portal
        run: npm test
      - name: Build admin portal
        working-directory: admin-portal
        run: npm run build

  backend-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
      - name: Lint admin backend
        working-directory: backend
        run: npm run lint:check -- src/admin
      - name: Test admin backend
        working-directory: backend
        run: npm test -- src/admin
      - name: Build backend
        working-directory: backend
        run: npm run build
