name: Factory PR convergence patch once

on:
  push:
    branches:
      - perf/factory-pr-convergence-payload
    paths:
      - .github/workflows/factory-pr-convergence-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/factory-pr-convergence-payload
          fetch-depth: 0
      - name: Apply focused convergence payload optimisation
        run: python scripts/factory_pr_convergence_patch_once.py
      - name: Commit final focused diff
        run: |
          rm .github/workflows/factory-pr-convergence-patch-once.yml
          rm scripts/factory_pr_convergence_patch_once.py
          git config user.name factory-efficiency-audit
          git config user.email factory-efficiency-audit@users.noreply.github.com
          git add automation/openhands_factory/github.py automation/tests/test_github.py docs/factory/AUDIT-2026-08-29-PR-CONVERGENCE.md .github/workflows/factory-pr-convergence-patch-once.yml scripts/factory_pr_convergence_patch_once.py
          git diff --cached --check
          git commit -m 'perf(factory): trim PR convergence payload'
          git push origin HEAD:perf/factory-pr-convergence-payload
