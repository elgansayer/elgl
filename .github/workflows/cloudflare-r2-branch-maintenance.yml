name: Cloudflare R2 branch maintenance

on:
  push:
    branches:
      - feat/cloudflare-native-r2-gateway
    paths:
      - backend/package.json
      - .github/workflows/cloudflare-r2-branch-maintenance.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-native-r2-gateway
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply targeted source and configuration migrations
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const audioPath = 'backend/src/audio-rooms/audio-rooms.service.ts';
          const audioSource = fs.readFileSync(audioPath, 'utf8');
          const oldRecordingBlock = [
            '    const recordingUrl =',
            '      egressRecordingUrl ||',
            '      dto.recording_url ||',
            '      `https://r2.hellotalk.mock/archive/${room.room_name}.webm`;',
            '',
            '    // Generate full transcript using speech‑to‑text (implemented via LiveKit egress or external STT)',
            '    let transcriptText =',
            '      await this.transcriptEgress.generateTranscriptFromAudioUrl(recordingUrl);',
          ].join('\n');
          const newRecordingBlock = [
            '    const recordingUrl = egressRecordingUrl || dto.recording_url || null;',
            '',
            '    // Generate a transcript only when an authoritative recording exists.',
            '    let transcriptText = recordingUrl',
            '      ? await this.transcriptEgress.generateTranscriptFromAudioUrl(',
            '          recordingUrl,',
            '        )',
            "      : '';",
          ].join('\n');

          if (!audioSource.includes(oldRecordingBlock)) {
            throw new Error('Expected audio-room recording fallback was not found');
          }
          fs.writeFileSync(
            audioPath,
            audioSource.replace(oldRecordingBlock, newRecordingBlock),
          );

          const envPath = '.env.example';
          const envSource = fs.readFileSync(envPath, 'utf8');
          const oldEnvBlock = [
            '# --- Cloudflare R2 ---',
            'CLOUDFLARE_R2_ENDPOINT=https://your-account-id.r2.cloudflarestorage.com',
            'CLOUDFLARE_R2_ACCESS_KEY_ID=your-r2-access-key',
            'CLOUDFLARE_R2_SECRET_ACCESS_KEY=your-r2-secret-key',
            'CLOUDFLARE_R2_BUCKET=hellotalk-media',
            'CLOUDFLARE_R2_PUBLIC_DOMAIN=https://media.yourdomain.com',
          ].join('\n');
          const newEnvBlock = [
            '# --- Cloudflare R2 Worker gateway ---',
            'CLOUDFLARE_R2_GATEWAY_URL=https://elgl-r2-gateway.example.workers.dev',
            'CLOUDFLARE_R2_SIGNING_SECRET=replace-with-at-least-32-random-characters',
            'CLOUDFLARE_R2_SERVICE_TOKEN=replace-with-a-different-32-character-secret',
            'CLOUDFLARE_R2_PUBLIC_URL=https://media.yourdomain.com',
            'CLOUDFLARE_R2_SOURCE_HOSTS=your-livekit-host.example.com',
            'CLOUDFLARE_R2_UPLOAD_TTL_SECONDS=3600',
            'CLOUDFLARE_R2_MAX_SINGLE_UPLOAD_BYTES=26214400',
            'CLOUDFLARE_R2_MAX_MULTIPART_PART_BYTES=104857600',
            'CLOUDFLARE_R2_SOURCE_FETCH_TIMEOUT_MS=30000',
            '',
            '# Temporary LiveKit Egress R2 compatibility only.',
            'CLOUDFLARE_R2_ENDPOINT=https://your-account-id.r2.cloudflarestorage.com',
            'CLOUDFLARE_R2_ACCESS_KEY_ID=your-egress-only-r2-access-key',
            'CLOUDFLARE_R2_SECRET_ACCESS_KEY=your-egress-only-r2-secret-key',
            'CLOUDFLARE_R2_BUCKET=hellotalk-recordings',
            'CLOUDFLARE_R2_PUBLIC_DOMAIN=https://media.yourdomain.com',
          ].join('\n');

          if (!envSource.includes(oldEnvBlock)) {
            throw new Error('Expected root R2 environment block was not found');
          }
          fs.writeFileSync(envPath, envSource.replace(oldEnvBlock, newEnvBlock));
          NODE

      - name: Regenerate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated migration output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json backend/src/audio-rooms/audio-rooms.service.ts .env.example
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'chore(storage): complete Cloudflare-native R2 migration'
          git push origin HEAD:feat/cloudflare-native-r2-gateway
