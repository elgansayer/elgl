name: Temporary main CI repair

on:
  push:
    branches:
      - ci/repair-main-chat-archive-20260828

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/repair-main-chat-archive-20260828
          fetch-depth: 0
      - name: Patch stale chat room member database typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/supabase/supabase.service.ts')
          text = path.read_text()
          if "          is_archived: boolean;\n          archived_at: string | null;" in text:
              raise SystemExit(0)
          replacements = [
              (
                  "          is_locked: boolean;\n          created_at?: string;",
                  "          is_locked: boolean;\n          is_archived: boolean;\n          archived_at: string | null;\n          created_at?: string;",
              ),
              (
                  "          is_locked?: boolean;\n          created_at?: string;\n        }>;\n        Update:",
                  "          is_locked?: boolean;\n          is_archived?: boolean;\n          archived_at?: string | null;\n          created_at?: string;\n        }>;\n        Update:",
              ),
              (
                  "          is_locked?: boolean;\n          created_at?: string;\n        }>;\n        Relationships:",
                  "          is_locked?: boolean;\n          is_archived?: boolean;\n          archived_at?: string | null;\n          created_at?: string;\n        }>;\n        Relationships:",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected database type fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify repair diff
        run: |
          git diff --check
          git diff -- backend/src/supabase/supabase.service.ts
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/supabase/supabase.service.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ci): align chat archive database types"
          git push origin HEAD:ci/repair-main-chat-archive-20260828
