name: Native motion platform patch

on:
  push:
    branches:
      - feat/native-view-transition-motion
    paths:
      - .github/workflows/native-motion-platform-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/native-view-transition-motion
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove deprecated provider and wire the motion guard
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const configPath = 'frontend/src/app/app.config.ts';
          let config = fs.readFileSync(configPath, 'utf8');
          config = config.replace(
            "import { provideAnimations } from '@angular/platform-browser/animations';\n",
            '',
          );
          config = config.replace('    provideAnimations(),\n', '');
          if (
            config.includes('provideAnimations') ||
            config.includes('@angular/platform-browser/animations')
          ) {
            throw new Error('Deprecated Angular animation provider remains');
          }
          fs.writeFileSync(configPath, config);

          const packagePath = 'package.json';
          const manifest = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          manifest.scripts['check:native-motion-platform'] =
            'node scripts/verify-native-motion-platform.mjs';
          if (!manifest.scripts.verify.includes('check:native-motion-platform')) {
            const anchor = 'npm run check:loading-platform &&';
            if (!manifest.scripts.verify.includes(anchor)) {
              throw new Error('Loading-platform verification anchor is missing');
            }
            manifest.scripts.verify = manifest.scripts.verify.replace(
              anchor,
              `${anchor} npm run check:native-motion-platform &&`,
            );
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Remove deprecated and duplicate dependencies
        working-directory: frontend
        run: npm uninstall @angular/animations ngx-lottie --save --legacy-peer-deps

      - name: Format and verify frontend motion
        run: |
          cd frontend
          npx prettier --write \
            src/app/app.config.ts \
            src/app/core/motion/*.ts
          npm run lint:check
          npm run build
          npm test
          cd ..
          node scripts/verify-native-motion-platform.mjs
          node scripts/verify-loading-platform.mjs
          node scripts/verify-content-security-boundaries.mjs

      - name: Commit the native motion migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json frontend/package.json frontend/package-lock.json frontend/src docs/native-motion-and-view-transitions.md scripts/verify-native-motion-platform.mjs
          git commit -m 'refactor(motion): use native view and CSS transition platform'
          git push origin HEAD:feat/native-view-transition-motion
