name: Factory storage pressure patch

on:
  push:
    branches:
      - perf/factory-storage-pressure-reconciliation

permissions:
  contents: write

concurrency:
  group: factory-storage-pressure-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply focused Factory pressure-reconciliation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "automation/openhands_factory/pipeline.py",
              "    def refresh(self, protected_task_ids: set[str] | None = None) -> dict[str, Job]:\n",
              "    def refresh(\n"
              "        self,\n"
              "        protected_task_ids: set[str] | None = None,\n"
              "        *,\n"
              "        storage_pressure: bool = False,\n"
              "    ) -> dict[str, Job]:\n",
          )

          replace_once(
              "automation/openhands_factory/pipeline.py",
              "                if dirty:\n"
              "                    recovery = self.config.recovery_dir / (\n"
              "                        f\"issue-{task_id}-{datetime.now(UTC).strftime('%Y%m%dT%H%M%SZ')}\"\n"
              "                    )\n"
              "                    workflow.archive_worktree(worktree, recovery)\n"
              "                workflow.remove_worktree(worktree, force=dirty)\n",
              "                if dirty and storage_pressure:\n"
              "                    LOGGER.warning(\n"
              "                        \"Preserving dirty stale worktree for task %s while storage is below \"\n"
              "                        \"the scheduling reserve\",\n"
              "                        task_id,\n"
              "                    )\n"
              "                    continue\n"
              "                if dirty:\n"
              "                    recovery = self.config.recovery_dir / (\n"
              "                        f\"issue-{task_id}-{datetime.now(UTC).strftime('%Y%m%dT%H%M%SZ')}\"\n"
              "                    )\n"
              "                    workflow.archive_worktree(worktree, recovery)\n"
              "                workflow.remove_worktree(worktree, force=dirty)\n",
          )

          replace_once(
              "automation/openhands_factory/daemon.py",
              "def refresh_jobs(\n"
              "    pipeline: FactoryPipeline,\n"
              "    protected_task_ids: set[str],\n"
              "    now: float,\n"
              "    cooldown_seconds: int,\n"
              ") -> tuple[dict[str, Job], float]:\n"
              "    \"\"\"Refresh GitHub work without turning a control-plane outage into a crash.\"\"\"\n\n"
              "    try:\n"
              "        return pipeline.refresh(protected_task_ids), now + cooldown_seconds\n",
              "def refresh_jobs(\n"
              "    pipeline: FactoryPipeline,\n"
              "    protected_task_ids: set[str],\n"
              "    now: float,\n"
              "    cooldown_seconds: int,\n"
              "    *,\n"
              "    storage_pressure: bool = False,\n"
              ") -> tuple[dict[str, Job], float]:\n"
              "    \"\"\"Refresh GitHub work without turning a control-plane outage into a crash.\"\"\"\n\n"
              "    try:\n"
              "        if storage_pressure:\n"
              "            jobs = pipeline.refresh(protected_task_ids, storage_pressure=True)\n"
              "        else:\n"
              "            jobs = pipeline.refresh(protected_task_ids)\n"
              "        return jobs, now + cooldown_seconds\n",
          )

          replace_once(
              "automation/openhands_factory/daemon.py",
              "                if not self.paused() and storage_ready and capacity > 0:\n",
              "                if not self.paused() and not storage_ready:\n"
              "                    now = time.monotonic()\n"
              "                    if now >= next_refresh_at:\n"
              "                        pressure_refresh_seconds = max(self.config.cooldown_seconds, 900)\n"
              "                        refresh_future = control.submit(\n"
              "                            refresh_jobs,\n"
              "                            self.pipeline,\n"
              "                            active_task_ids,\n"
              "                            now,\n"
              "                            pressure_refresh_seconds,\n"
              "                            storage_pressure=True,\n"
              "                        )\n"
              "                        _, next_refresh_at = await_refresh(\n"
              "                            refresh_future,\n"
              "                            lambda: self._write_daemon_state(\n"
              "                                \"running\", active, active_started_at\n"
              "                            ),\n"
              "                        )\n"
              "                        LOGGER.warning(\n"
              "                            \"Storage reserve blocked scheduling; ran pressure-safe \"\n"
              "                            \"control-plane reconciliation without starting providers\"\n"
              "                        )\n"
              "                if not self.paused() and storage_ready and capacity > 0:\n",
          )

          replace_once(
              "automation/openhands_factory/gated_daemon.py",
              "        available = self.issue_admission.available_slots(now or datetime.now(UTC))\n",
              "        if getattr(self, \"storage_blocked\", False):\n"
              "            # Cached issue discovery is normally enough while admission is full, but under\n"
              "            # storage pressure we need authoritative closure evidence so clean stale issue\n"
              "            # worktrees can be reclaimed without admitting or executing new work.\n"
              "            return original(limit)\n"
              "        available = self.issue_admission.available_slots(now or datetime.now(UTC))\n",
          )

          pipeline_tests = '''\n\ndef test_refresh_under_storage_pressure_reclaims_clean_closed_worktree(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    github = GitHub()\n    pipeline = FactoryPipeline(config(tmp_path), github=github)  # type: ignore[arg-type]\n    job = pipeline.refresh()[\"42\"]\n    job.state = JobState.IMPLEMENTING\n    pipeline.jobs.save({\"42\": job})\n    worktree = pipeline.config.worktree_dir / \"issue-42\"\n    worktree.mkdir(parents=True)\n    removed: list[Path] = []\n    monkeypatch.setattr(GitWorkflow, \"has_changes\", lambda workflow: False)\n    monkeypatch.setattr(\n        GitWorkflow, \"remove_worktree\", lambda workflow, path, **kwargs: removed.append(path)\n    )\n    github.tasks = []\n\n    refreshed = pipeline.refresh(storage_pressure=True)\n\n    assert refreshed[\"42\"].state is JobState.DONE\n    assert refreshed[\"42\"].last_error == \"Issue closed before pull request creation\"\n    assert removed == [worktree]\n\n\ndef test_refresh_under_storage_pressure_preserves_dirty_closed_worktree(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    github = GitHub()\n    pipeline = FactoryPipeline(config(tmp_path), github=github)  # type: ignore[arg-type]\n    job = pipeline.refresh()[\"42\"]\n    job.state = JobState.IMPLEMENTING\n    pipeline.jobs.save({\"42\": job})\n    worktree = pipeline.config.worktree_dir / \"issue-42\"\n    worktree.mkdir(parents=True)\n    archived: list[Path] = []\n    removed: list[Path] = []\n    monkeypatch.setattr(GitWorkflow, \"has_changes\", lambda workflow: True)\n    monkeypatch.setattr(\n        GitWorkflow, \"archive_worktree\", lambda workflow, path, recovery: archived.append(path)\n    )\n    monkeypatch.setattr(\n        GitWorkflow, \"remove_worktree\", lambda workflow, path, **kwargs: removed.append(path)\n    )\n    github.tasks = []\n\n    refreshed = pipeline.refresh(storage_pressure=True)\n\n    assert refreshed[\"42\"].state is JobState.IMPLEMENTING\n    assert archived == []\n    assert removed == []\n    assert worktree.exists()\n'''
          replace_once(
              "automation/tests/test_pipeline.py",
              "\n\ndef test_refresh_does_not_remove_a_closed_issue_while_its_worker_is_active(\n",
              pipeline_tests
              + "\n\ndef test_refresh_does_not_remove_a_closed_issue_while_its_worker_is_active(\n",
          )

          daemon_test = '''\n\ndef test_refresh_jobs_propagates_storage_pressure_mode() -> None:\n    calls: list[tuple[set[str], bool]] = []\n\n    def refresh(\n        protected: set[str], *, storage_pressure: bool = False\n    ) -> dict[str, Job]:\n        calls.append((protected, storage_pressure))\n        return {\"42\": job(\"42\", 0)}\n\n    pipeline = SimpleNamespace(\n        refresh=refresh,\n        jobs=SimpleNamespace(load=lambda: {}),\n    )\n\n    refreshed, retry_at = refresh_jobs(\n        pipeline, set(), 10.0, 900, storage_pressure=True  # type: ignore[arg-type]\n    )\n\n    assert set(refreshed) == {\"42\"}\n    assert retry_at == 910.0\n    assert calls == [(set(), True)]\n'''
          replace_once(
              "automation/tests/test_daemon.py",
              "\n\ndef test_await_refresh_publishes_heartbeat_while_control_plane_is_busy() -> None:\n",
              daemon_test
              + "\n\ndef test_await_refresh_publishes_heartbeat_while_control_plane_is_busy() -> None:\n",
          )

          gated_test = '''\n\ndef test_issue_refresh_hits_github_under_storage_pressure_when_admission_is_full() -> None:\n    daemon = object.__new__(MainCiGatedFactoryDaemon)\n    fresh_issue = _task(\"303\", \"github-issue\")\n    daemon.issue_admission = AdmissionSlots(0)\n    daemon.storage_blocked = True\n    daemon.pipeline = SimpleNamespace(\n        tasks=SimpleNamespace(cached=lambda: [_task(\"101\", \"github-issue\")])\n    )\n    collector = IssueCollector([fresh_issue])\n\n    tasks = daemon._collect_open_issues_for_refresh(\n        collector,\n        limit=777,\n        now=datetime(2026, 9, 12, tzinfo=UTC),\n    )\n\n    assert tasks == [fresh_issue]\n    assert collector.calls == [777]\n'''
          replace_once(
              "automation/tests/test_gated_daemon.py",
              "\n\ndef test_issue_refresh_hits_github_when_admission_slot_opens() -> None:\n",
              gated_test
              + "\n\ndef test_issue_refresh_hits_github_when_admission_slot_opens() -> None:\n",
          )

          Path("docs/factory/AUDIT-2026-09-12-STORAGE-PRESSURE-RECONCILIATION.md").write_text(
              '''# Factory storage-pressure reconciliation audit — 2026-09-12\n\n## Finding\n\nThe live Factory control panel showed a healthy daemon and watchdog but zero active jobs while 2,350 jobs were runnable. The Factory-state volume had 3.9 GiB free against the 5 GiB scheduling reserve. Existing recovery-archive and host/container cleanup correctly run outside the scheduling gate, but GitHub refresh and stale-worktree reconciliation still ran only when the storage gate was already green.\n\nThat left a circular recovery gap: clean worktrees belonging to issues or pull requests that had since closed could be one of the causes of low free space, while low free space prevented the reconciliation pass that proves those worktrees stale and removes them.\n\n## Change\n\n- While storage is below reserve, the daemon performs a deterministic control-plane reconciliation at most every 15 minutes. It does not start providers, implementation, review, repair, verification, merge work, or the architect cycle.\n- Pressure-mode reconciliation may remove only stale worktrees proven clean. Dirty or unreadable stale worktrees are preserved in place and are not copied into recovery storage while the filesystem is already constrained. Normal reconciliation later archives them once storage recovers.\n- The production admission-aware issue cache is bypassed during pressure reconciliation so closed issues are observed authoritatively. This does not admit new issues because scheduling remains storage-gated.\n- Active worker task IDs remain protected exactly as in normal reconciliation.\n\n## Expected efficiency and recovery impact\n\nThis change does not claim a token percentage. Its direct effect is to let the Factory reclaim provably disposable clean worktrees without any model call when storage itself is blocking all 2,350 currently runnable jobs. If stale clean worktrees account for the roughly 1.1 GiB shortfall visible on 2026-09-12, one pressure reconciliation can restore the reserve and resume useful engineering throughput. If they do not, the Factory stays fail-closed and the existing host-storage controls remain authoritative.\n\nThe 15-minute pressure cadence bounds GitHub discovery cost while still making recovery far faster than an operator-only intervention. Normal issue discovery keeps its admission-aware cache and normal scheduling cadence.\n\n## Safety\n\nNo provider routing, retry, concurrency, model, prompt, verification, security-review, independent-review, reviewed-SHA, CI, mergeability, or exact-head merge guarantee is weakened. Dirty work is never deleted to recover space, and no model-backed phase can start below the storage reserve.\n\n## Validation\n\nRegression coverage proves that pressure reconciliation removes a clean closed worktree, preserves a dirty closed worktree without creating another recovery archive, propagates the pressure mode through the daemon control-plane helper, and forces authoritative issue discovery during storage pressure even when new-issue admission is full. Canonical GitHub CI remains authoritative for Ruff, mypy, pytest, workflow policy, and repository-wide checks.\n''',
              encoding="utf-8",
          )
          PY
      - name: Syntax and whitespace validation
        shell: bash
        run: |
          python3 -m compileall -q \
            automation/openhands_factory/daemon.py \
            automation/openhands_factory/gated_daemon.py \
            automation/openhands_factory/pipeline.py \
            automation/tests/test_daemon.py \
            automation/tests/test_gated_daemon.py \
            automation/tests/test_pipeline.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            automation/openhands_factory/daemon.py \
            automation/openhands_factory/gated_daemon.py \
            automation/openhands_factory/pipeline.py \
            automation/tests/test_daemon.py \
            automation/tests/test_gated_daemon.py \
            automation/tests/test_pipeline.py \
            docs/factory/AUDIT-2026-09-12-STORAGE-PRESSURE-RECONCILIATION.md
          git commit -m "perf(factory): reconcile clean worktrees under storage pressure"
          git push origin HEAD:perf/factory-storage-pressure-reconciliation
