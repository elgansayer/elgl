name: Clean project lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    # Canonical CI already runs the shared fail-open impact classifier. This
    # standalone lint workflow is not a required merge status, so allocating a
    # second Ubuntu runner just to rediscover that a Factory/docs-only PR cannot
    # affect backend/frontend lint is pure control-plane churn. Mixed or unknown
    # diffs still run because paths-ignore only suppresses PRs whose every path is
    # in this proven non-application set.
    paths-ignore:
      - 'automation/**'
      - 'config/factory/**'
      - 'config/systemd/**'
      - 'docs/**'
      - '.github/dependabot.yml'
      - '.github/workflows/factory-merge.yml'
      - '.github/workflows/factory-format-evidence.yml'
      - '.github/workflows/on-failure.yml'
      - '.github/workflows/branch-pr-hygiene.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: clean-project-lint-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: clean lint / impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_application: ${{ steps.impact.outputs.run_application }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect application impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" \
              | bash scripts/classify-ci-impact.sh "$GITHUB_OUTPUT"
          else
            echo "run_application=true" >> "$GITHUB_OUTPUT"
            echo "Clean project lint required: true"
          fi

  lint-contract:
    name: lint contract guard
    needs: impact
    if: needs.impact.outputs.run_application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify repository lint contract
        run: npm run check:lint-contract

  clean-lint:
    name: ${{ matrix.project }} / npm run lint clean tree
    needs: [impact, lint-contract]
    if: always() && needs.impact.outputs.run_application == 'true' && needs.lint-contract.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.project }}

      - name: Run project lint command
        run: npm run lint
        working-directory: ${{ matrix.project }}

      - name: Assert lint leaves the tracked project clean
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- "$PROJECT")"
          if [ -n "$changes" ]; then
            echo "::error title=Dirty lint output::npm run lint modified tracked or created project files. Run it locally and commit the resulting fixes."
            git status --short -- "$PROJECT"
            git diff -- "$PROJECT"
            exit 1
          fi
          echo "npm run lint completed with a clean $PROJECT working tree."
