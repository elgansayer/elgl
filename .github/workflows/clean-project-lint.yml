name: Clean project lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: write

concurrency:
  group: clean-project-lint-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  lint-contract:
    name: lint contract guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify repository lint contract
        run: npm run check:lint-contract

  clean-lint:
    name: ${{ matrix.project }} / npm run lint clean tree
    needs: lint-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.project }}

      - name: Run project lint command
        run: npm run lint
        working-directory: ${{ matrix.project }}

      - name: Commit deterministic backend lint fixes
        if: matrix.project == 'backend' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backend; then
            echo "No backend lint changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(backend): apply lint fixes"
          git push origin "HEAD:${PR_BRANCH}"

      - name: Assert lint leaves the tracked project clean
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- "$PROJECT")"
          if [ -n "$changes" ]; then
            echo "::error title=Dirty lint output::npm run lint modified tracked or created project files. Run it locally and commit the resulting fixes."
            git status --short -- "$PROJECT"
            git diff -- "$PROJECT"
            exit 1
          fi
          echo "npm run lint completed with a clean $PROJECT working tree."
