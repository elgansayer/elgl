name: Dependency review

on:
  pull_request:
    branches:
      - main
    # Dependency Review is valuable when dependency graph inputs or workflow
    # action references can change. Factory Python, its tests/prompts, deployment
    # configuration and documentation do not change a manifest/lockfile and were
    # still allocating a runner for an inevitably empty dependency diff. Do not
    # ignore automation/pyproject.toml or automation/uv.lock, and do not ignore
    # workflows, so real Python or GitHub Actions dependency changes still run.
    paths-ignore:
      - 'automation/openhands_factory/**'
      - 'automation/tests/**'
      - 'automation/prompts/**'
      - 'config/factory/**'
      - 'config/systemd/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Block vulnerable dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          comment-summary-in-pr: always
