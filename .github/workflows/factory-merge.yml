name: Factory Merge Gate

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read

concurrency:
  group: factory-merge-gate
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge eligible factory pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_REVIEW_ACTOR: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --label factory-reviewed --json number,isDraft,headRefName,headRefOid,mergeStateStatus,reviewDecision,statusCheckRollup \
            --jq '.[] | select(
              .isDraft == false
              and .mergeStateStatus == "CLEAN"
              and .reviewDecision != "CHANGES_REQUESTED"
              and ([.statusCheckRollup[]? | select((.context // .name) == "CI / required")] | length) >= 1
              and ([.statusCheckRollup[]? | select((.context // .name) == "CI / required" and (((.state == "SUCCESS") or (.conclusion == "SUCCESS")) | not))] | length) == 0
              and ([.statusCheckRollup[]? | select((.context // .name) != "factory/independent-review") | select(((.status == "COMPLETED") and ((.conclusion // "") | IN("SUCCESS", "NEUTRAL", "SKIPPED"))) or .state == "SUCCESS")] | length) == ([.statusCheckRollup[]? | select((.context // .name) != "factory/independent-review")] | length)
            ) | "\(.number)\t\(.headRefOid)"' \
            | while IFS=$'\t' read -r number head_sha; do
                if [ -z "$number" ] || [ -z "$head_sha" ]; then
                  continue
                fi

                latest_review_marker="$(
                  gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" \
                    --jq ".[] | select(.user.login == \"${FACTORY_REVIEW_ACTOR}\") | .body | split(\"\\n\")[0] | select(contains(\"head=${head_sha} -->\"))" \
                    | tail -n 1
                )"
                expected_marker="<!-- factory/independent-review state=approved head=${head_sha} -->"
                if [ "$latest_review_marker" != "$expected_marker" ]; then
                  echo "PR #${number}: no current-head Factory approval comment; skipping"
                  continue
                fi

                gh pr merge "$number" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch --match-head-commit "$head_sha"
              done
