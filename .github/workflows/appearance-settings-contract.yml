name: Appearance Settings Contract

on:
  pull_request:
    paths:
      - 'frontend/src/app/routes/settings.routes.ts'
      - 'frontend/src/app/pages/settings/appearance-settings/**'
      - 'frontend/src/app/components/settings/settings.component.ts'
      - 'frontend/src/app/components/settings/settings.component.html'
      - 'frontend/src/app/services/chat-settings.service.ts'
      - 'frontend/src/app/services/i18n.service.ts'
      - 'frontend/public/assets/i18n/en-GB.json'
      - 'backend/src/chat/dto/chat-settings.dto.ts'
      - 'backend/src/chat/chat-settings.service.ts'
      - 'scripts/appearance-settings-contract.test.mjs'
      - 'docs/appearance-settings.md'
      - '.github/workflows/appearance-settings-contract.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/src/app/routes/settings.routes.ts'
      - 'frontend/src/app/pages/settings/appearance-settings/**'
      - 'frontend/src/app/components/settings/settings.component.ts'
      - 'frontend/src/app/components/settings/settings.component.html'
      - 'frontend/src/app/services/chat-settings.service.ts'
      - 'frontend/src/app/services/i18n.service.ts'
      - 'frontend/public/assets/i18n/en-GB.json'
      - 'backend/src/chat/dto/chat-settings.dto.ts'
      - 'backend/src/chat/chat-settings.service.ts'
      - 'scripts/appearance-settings-contract.test.mjs'
      - 'docs/appearance-settings.md'
      - '.github/workflows/appearance-settings-contract.yml'
  merge_group:

permissions:
  contents: read

jobs:
  appearance-settings-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Appearance Settings product contract
        run: node --test scripts/appearance-settings-contract.test.mjs
