name: Admin CI fix once

on:
  push:
    branches:
      - ci/admin-portal-lockfile-20260815

permissions:
  contents: write

jobs:
  fix-admin-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/admin-portal-lockfile-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add DOM test environment
        working-directory: admin-portal
        run: npm install --save-dev jsdom --no-audit --no-fund
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
      - name: Fix admin backend lint errors
        working-directory: backend
        run: npx --no-install eslint "src/admin/**/*.ts" --fix
      - name: Commit deterministic fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-portal/package.json admin-portal/package-lock.json backend/src/admin
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(ci): repair admin test environment and lint debt"
          git push origin HEAD:ci/admin-portal-lockfile-20260815
