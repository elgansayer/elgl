name: Scheduled PR Fixer

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  fix_all_stale_prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run parallel PR fixer
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          MAX_PARALLEL_PR_FIXER: "20"
        run: |
          chmod +x scripts/fix-rejected-prs.sh
          bash scripts/fix-rejected-prs.sh
