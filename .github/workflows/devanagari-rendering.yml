name: Devanagari and complex-script rendering

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/devanagari-complex-script-rendering.md'
      - 'docs/devanagari-complex-script-rendering-verification.md'
      - 'frontend/src/app/services/i18n.service.ts'
      - 'frontend/src/app/services/i18n.devanagari.spec.ts'
      - 'frontend/scripts/check-devanagari-rendering.test.mjs'
      - 'frontend/scripts/check-multilingual-typography.mjs'
      - '.github/workflows/devanagari-rendering.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: devanagari-rendering-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify complex-script structural contract
        run: node scripts/check-multilingual-typography.mjs
      - name: Verify Devanagari and complex-script regression contract
        run: node --test scripts/check-devanagari-rendering.test.mjs
