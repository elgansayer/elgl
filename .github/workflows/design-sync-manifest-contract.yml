name: Design Sync Manifest Contract

on:
  pull_request:
    paths:
      - 'design-sync.manifest.json'
      - 'docs/design-sync-manifest.schema.json'
      - 'docs/design-sync-manifest-schema.md'
      - 'scripts/verify-design-sync-manifest.mjs'
      - 'scripts/verify-design-sync-manifest.test.mjs'
      - '.github/workflows/design-sync-manifest-contract.yml'
  push:
    branches: [main, develop]
    paths:
      - 'design-sync.manifest.json'
      - 'docs/design-sync-manifest.schema.json'
      - 'docs/design-sync-manifest-schema.md'
      - 'scripts/verify-design-sync-manifest.mjs'
      - 'scripts/verify-design-sync-manifest.test.mjs'
      - '.github/workflows/design-sync-manifest-contract.yml'
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: Verify manifest provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run manifest regression tests
        run: node --test scripts/verify-design-sync-manifest.test.mjs
      - name: Verify repository manifest
        run: node scripts/verify-design-sync-manifest.mjs
