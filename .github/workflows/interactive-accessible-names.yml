name: Interactive Accessible Names

on:
  pull_request:
    paths:
      - 'frontend/src/app/**'
      - 'admin-portal/src/app/**'
      - 'scripts/verify-interactive-accessible-names.mjs'
      - 'scripts/verify-interactive-accessible-names.test.mjs'
      - 'package.json'
      - '.github/workflows/interactive-accessible-names.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/src/app/**'
      - 'admin-portal/src/app/**'
      - 'scripts/verify-interactive-accessible-names.mjs'
      - 'scripts/verify-interactive-accessible-names.test.mjs'
      - 'package.json'
      - '.github/workflows/interactive-accessible-names.yml'

permissions:
  contents: read

concurrency:
  group: interactive-accessible-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify interactive accessible names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify accessible-name contract
        run: npm run check:interactive-accessible-names
