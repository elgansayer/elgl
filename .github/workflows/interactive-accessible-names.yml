name: Interactive Accessible Names

on:
  pull_request:
    paths:
      - 'frontend/src/app/**'
      - 'admin-portal/src/app/**'
      - 'scripts/verify-interactive-accessible-names.mjs'
      - 'scripts/verify-interactive-accessible-names.test.mjs'
      - 'package.json'
      - '.github/workflows/interactive-accessible-names.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/src/app/**'
      - 'admin-portal/src/app/**'
      - 'scripts/verify-interactive-accessible-names.mjs'
      - 'scripts/verify-interactive-accessible-names.test.mjs'
      - 'package.json'
      - '.github/workflows/interactive-accessible-names.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: interactive-accessible-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify interactive accessible names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify accessible-name contract
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run check:interactive-accessible-names > accessible-name-report.txt 2>&1
          status=$?
          cat accessible-name-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish verifier diagnostics
        if: github.event_name == 'pull_request' && steps.verify.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Accessible-name verifier diagnostics'
            echo
            echo '```text'
            cat accessible-name-report.txt
            echo '```'
          } | gh pr comment "${{ github.event.pull_request.number }}" --body-file -

      - name: Fail when the contract is violated
        if: steps.verify.outputs.status != '0'
        run: exit 1
