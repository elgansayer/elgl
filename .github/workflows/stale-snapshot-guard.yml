name: Stale snapshot guard

# Blocks pull requests whose branches roll files back to older versions of the
# base branch (whole-tree snapshots of stale sandboxes). See
# scripts/check-stale-snapshot.py. Measured on history: flags all 19 snapshot
# merges of 2026-10-20 and none of 150 ordinary merges (2026-08-26..09-28).
# Advisory until an operator adds it to the required checks.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: stale-snapshot-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stale-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify guard regression suite
        run: bash scripts/check-stale-snapshot.test.sh

      - name: Detect rollbacks to older base versions
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          INTENTIONAL_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'intentional-revert') }}
        run: |
          set -euo pipefail
          allow=()
          if [ "$INTENTIONAL_REVERT" = "true" ]; then allow=(--allow); fi
          python3 scripts/check-stale-snapshot.py --base "origin/$BASE_REF" --head HEAD "${allow[@]}"
