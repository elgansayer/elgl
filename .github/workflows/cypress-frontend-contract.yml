name: Cypress Frontend Contract

on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/cypress.config.ts'
      - 'frontend/cypress/**'
      - 'frontend/scripts/verify-cypress-setup.mjs'
      - 'frontend/scripts/verify-cypress-setup.test.mjs'
      - '.github/workflows/cypress-frontend-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/cypress.config.ts'
      - 'frontend/cypress/**'
      - 'frontend/scripts/verify-cypress-setup.mjs'
      - 'frontend/scripts/verify-cypress-setup.test.mjs'
      - '.github/workflows/cypress-frontend-contract.yml'
  merge_group:

permissions:
  contents: read

jobs:
  cypress-setup:
    name: Cypress installation and product smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Cypress binary
        run: npx cypress verify

      - name: Verify Cypress installation and configuration contract
        run: node scripts/verify-cypress-setup.mjs

      - name: Test Cypress setup verifier
        run: node --test scripts/verify-cypress-setup.test.mjs

      - name: Run Cypress setup, app and Moments smoke tests
        run: >-
          npx start-server-and-test start http://localhost:4200
          "cypress run --spec 'cypress/e2e/cypress-setup.cy.ts,cypress/e2e/app.cy.ts,cypress/e2e/moments-flow.cy.ts' --browser electron"
