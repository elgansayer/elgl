name: Cypress Frontend Contract

on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/cypress.config.ts'
      - 'frontend/cypress/**'
      - '.github/workflows/cypress-frontend-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/cypress.config.ts'
      - 'frontend/cypress/**'
      - '.github/workflows/cypress-frontend-contract.yml'
  merge_group:

permissions:
  contents: read

jobs:
  cypress-setup:
    name: Cypress installation and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Cypress binary
        run: npx cypress verify

      - name: Verify Cypress configuration and smoke spec
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = fs.readFileSync('cypress.config.ts', 'utf8');
          const failures = [];

          if (!pkg.devDependencies?.cypress) failures.push('cypress must be a frontend devDependency');
          if (!pkg.scripts?.['cypress:open']) failures.push('missing cypress:open script');
          if (!pkg.scripts?.e2e?.includes('cypress run')) failures.push('e2e must execute cypress run');
          if (!pkg.scripts?.['e2e:ci']?.includes('start-server-and-test')) failures.push('e2e:ci must start the Angular app before Cypress');

          const requiredConfig = [
            "defineConfig",
            "baseUrl: 'http://localhost:4200'",
            "supportFile: 'cypress/support/e2e.ts'",
            "specPattern: 'cypress/e2e/**/*.cy.ts'",
          ];
          for (const marker of requiredConfig) {
            if (!config.includes(marker)) failures.push(`cypress.config.ts missing: ${marker}`);
          }

          if (!fs.existsSync('cypress/support/e2e.ts')) failures.push('missing Cypress support file');
          if (!fs.existsSync('cypress/e2e/app.cy.ts')) failures.push('missing Cypress app smoke spec');

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Cypress frontend installation/configuration contract passed.');
          NODE

      - name: Run Cypress app smoke test
        run: npx start-server-and-test start http://localhost:4200 "cypress run --spec cypress/e2e/app.cy.ts --browser electron"
