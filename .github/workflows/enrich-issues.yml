name: Enrich issue specifications

on:
  workflow_dispatch:
    inputs:
      state:
        description: Issue state to enrich
        required: true
        default: open
        type: choice
        options: [open, all]
      max_issues:
        description: Maximum issues to update in this run (0 = no explicit limit)
        required: true
        default: '0'
  push:
    branches: [main]
    paths:
      - .github/workflows/enrich-issues.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: enrich-issue-specifications
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUESTED_STATE: ${{ inputs.state || 'open' }}
      MAX_ISSUES: ${{ inputs.max_issues || '0' }}
    steps:
      - name: Enrich issue bodies
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request
          token = os.environ['GH_TOKEN']; repo = os.environ['REPOSITORY']; state = os.environ.get('REQUESTED_STATE','open'); max_issues = int(os.environ.get('MAX_ISSUES','0'))
          api=f'https://api.github.com/repos/{repo}'; marker='<!-- elgl-spec-enrichment:v1 -->'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'elgl-issue-spec-enricher'}
          def request(method,url,payload=None,retries=10):
              data=None if payload is None else json.dumps(payload).encode()
              for attempt in range(retries):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers,method=method),timeout=60) as resp:
                          raw=resp.read(); return resp.status,json.loads(raw) if raw else None
                  except urllib.error.HTTPError as exc:
                      raw=exc.read().decode(errors='replace')
                      if exc.code in (403,429,500,502,503,504) and attempt+1<retries:
                          delay=float(exc.headers.get('Retry-After') or min(120,2**attempt)); print(f'retry {exc.code} in {delay}s'); time.sleep(delay); continue
                      raise RuntimeError(f'GitHub API {exc.code}: {raw}') from exc
          def classify(title,body):
              text=f'{title}\n{body}'.lower()
              if any(x in text for x in ('admin','moderation','trust & safety','trust and safety','abuse','fraud','audit')): return 'admin / trust & safety'
              if any(x in text for x in ('frontend','angular','component','design','accessibility')): return 'frontend / product UI'
              if any(x in text for x in ('backend','nestjs','api','database','migration','postgres','redis')): return 'backend / platform'
              if any(x in text for x in ('deploy','docker','podman','ci','workflow','factory','queue','worker','observability')): return 'infrastructure / delivery'
              if any(x in text for x in ('test','coverage','e2e','performance','benchmark')): return 'quality / testing'
              return 'product / engineering'
          def enrichment(issue):
              title=issue.get('title','').strip(); body=issue.get('body') or ''; domain=classify(title,body); admin=domain=='admin / trust & safety'
              security='- Enforce authorization server-side and test denied/cross-scope access.\n- Minimize sensitive data returned to clients and never expose credentials or secrets.\n- Audit privileged reads/mutations with actor, target, reason, outcome and correlation ID.\n- Prefer reversible/time-bounded actions; require stronger authentication/approval for high-impact operations.' if admin else '- Preserve existing authentication/authorization boundaries and validate all untrusted input.\n- Avoid logging credentials, tokens, private content or unnecessary personal data.\n- Consider abuse, rate-limit and permission failure paths where the feature exposes a user- or operator-triggered action.'
              return f'''\n\n{marker}\n## Implementation specification\n\n### Outcome\nDeliver **{title}** as a production-ready {domain} change with explicit behavior, failure handling, tests, observability and documentation. Preserve existing behavior unless this issue intentionally changes it.\n\n### Discovery before implementation\n- Identify current code paths, data model, APIs, UI surfaces, background jobs and tests before changing behavior.\n- Reuse established repository patterns and shared services/components rather than creating parallel abstractions without a clear reason.\n- Record assumptions in the PR when existing behavior or product rules are ambiguous.\n- Check for overlapping issues/PRs and coordinate shared schema, authorization and API-contract changes.\n\n### Functional requirements\n- Define the happy path and externally visible state transitions.\n- Define empty, loading, unavailable, unauthorized, validation and partial-failure behavior where applicable.\n- Keep API contracts typed and stable; use bounded pagination/filtering for collection endpoints.\n- Make mutations idempotent where retries are possible and guard against conflicting concurrent updates.\n- Preserve backward compatibility or include an explicit migration/rollout plan.\n\n### Security, privacy and abuse resistance\n{security}\n\n### Data and migration requirements\n- Document schema/index changes and expected query patterns before migrations.\n- Migrations must be safe to retry and deploy with mixed application versions when feasible.\n- Define retention/deletion behavior for new persisted data.\n- Avoid unbounded scans and N+1 query patterns.\n\n### Observability and operations\n- Add structured, sanitized logs for important failures and state changes.\n- Add metrics/tracing for latency, failures and unusual volume where useful.\n- Ensure failures can be correlated without direct database access.\n- Document rollback/recovery behavior for production-state changes.\n\n### Accessibility and UX\n- Keyboard operation, visible focus, semantic labels, screen-reader compatibility and high-zoom/reflow are required for UI.\n- Do not communicate important state by colour alone.\n- Destructive/high-impact actions need clear confirmation, consequence text and success/failure feedback.\n\n### Testing requirements\n- Unit-test core business rules and permission decisions.\n- Add integration/API tests for persistence, validation, authorization and failure behavior where applicable.\n- Add frontend/component/E2E coverage for critical flows where applicable.\n- Include regression coverage for the missing behavior this issue addresses.\n- Test retries/concurrency for non-trivial mutations and background processing.\n\n### Definition of done\n- Implementation and migrations are merged with relevant automated tests passing.\n- Authorization, privacy, accessibility and failure paths have been reviewed.\n- API/schema/configuration changes are documented and generated clients/contracts updated where used.\n- Logs/metrics can diagnose production failures without exposing sensitive information.\n- No placeholder/mock privileged behavior remains in production paths.\n- The PR links this issue and explains verification plus rollout/rollback steps.\n'''
          issues=[]; page=1
          while True:
              _,rows=request('GET',f'{api}/issues?state={urllib.parse.quote(state)}&per_page=100&page={page}&sort=created&direction=asc')
              if not rows: break
              issues.extend(x for x in rows if 'pull_request' not in x)
              if len(rows)<100: break
              page+=1
          updated=skipped=0
          for issue in issues:
              if max_issues and updated>=max_issues: break
              body=issue.get('body') or ''
              if marker in body: skipped+=1; continue
              new_body=(body.rstrip()+enrichment(issue)).strip()+'\n'
              if len(new_body.encode())>64000: print(f"skip #{issue['number']}: too large"); skipped+=1; continue
              request('PATCH',f"{api}/issues/{issue['number']}",{'body':new_body}); updated+=1; print(f"updated #{issue['number']}: {issue['title']}"); time.sleep(0.85)
          print(f'complete: candidates={len(issues)} updated={updated} skipped={skipped}')
          PY
# enrichment-trigger: 2
