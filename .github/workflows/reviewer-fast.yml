name: AI PR Fast Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: fast-reviewer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review_and_fix:
    if: github.actor != 'claude-code[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fast-path check wait
        if: github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          CHECKS=$(gh pr checks "$PR" --repo ${{ github.repository }} --json state,conclusion,name 2>/dev/null || echo "[]")
          if [ "$CHECKS" = "[]" ]; then echo "No checks. Proceeding."; exit 0; fi
          PENDING=$(echo "$CHECKS" | jq '[.[] | select(.state=="IN_PROGRESS" or .state=="PENDING" or .state=="QUEUED")] | length')
          if [ "$PENDING" -eq 0 ]; then echo "All checks done. Fast path."; echo "$CHECKS" | jq -r '.[] | "  \(.name): \(.conclusion // .state)"'; exit 0; fi
          echo "$PENDING check(s) running. Waiting (max 5 min)..."
          for i in $(seq 1 30); do
            CHECKS=$(gh pr checks "$PR" --repo ${{ github.repository }} --json state,conclusion,name 2>/dev/null || echo "[]")
            PENDING=$(echo "$CHECKS" | jq '[.[] | select(.state=="IN_PROGRESS" or .state=="PENDING" or .state=="QUEUED")] | length')
            if [ "$PENDING" -eq 0 ]; then echo "All done."; break; fi
            echo "[$i/30] $PENDING pending"
            sleep 10
          done

      - name: Safe merge with main
        if: github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git fetch origin main
          git config user.email "swarm@hellotalk.ai"
          git config user.name "AI Swarm"
          if git merge origin/main --no-edit 2>/dev/null; then
            echo "Clean merge."
          else
            echo "Conflicts - accepting markers (both sides preserved)."
            git add . && git commit -m "merge: conflict markers for AI resolution" 2>/dev/null || true
            git push origin HEAD 2>/dev/null || true
          fi

      - name: Tier 1 - Claude Code
        id: primary
        continue-on-error: true
        timeout-minutes: 5
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            You are the AI PR Reviewer. PR #${{ github.event.pull_request.number }}.

            CRITICAL: If merge conflicts exist, read BOTH sides and merge ALL changes. NEVER discard anything.

            1. Review code. Run tests: `npm test` in backend/, `npm test -- --watch=false` in frontend/.
            2. Fix failures. Commit + push.
            3. gh pr checks ${{ github.event.pull_request.number }} --watch
            4. If green: gh pr merge ${{ github.event.pull_request.number }} --admin --squash
            5. DO NOT FINISH until merged.

      - name: Check merged
        id: check_claude
        if: github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state -q '.state' 2>/dev/null || echo "OPEN")
          if [ "$STATE" = "MERGED" ]; then echo "merged=true" >> $GITHUB_OUTPUT; echo "Merged by Claude.";
          else echo "merged=false" >> $GITHUB_OUTPUT; echo "Falling to DeepSeek."; fi

      - name: Tier 2 - DeepSeek
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.check_claude.outputs.merged == 'false'
        continue-on-error: true
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "deepseek/deepseek-v4-pro"
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            Review PR #${{ github.event.pull_request.number }}.

            CRITICAL: If merge conflicts, read BOTH sides. NEVER discard changes. Merge intelligently.

            1. Review code. Run tests + lint.
            2. Fix failures, commit, push.
            3. gh pr checks ${{ github.event.pull_request.number }} --watch
            4. If green: gh pr merge ${{ github.event.pull_request.number }} --admin --squash
            5. DO NOT FINISH until merged or 3 fix cycles exhausted.
          cli_args: "--max-iterations 80"

      - name: Tier 3 - Gemini
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.5-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
          prompt: >
            Review PR #${{ github.event.pull_request.number }}. Fix failures. Merge conflicts: NEVER discard changes.
            gh pr checks ${{ github.event.pull_request.number }} --watch
            gh pr merge ${{ github.event.pull_request.number }} --admin --squash
          cli_args: "--max-iterations 40"

  fix_stale_prs:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix stale PRs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          MAX_PARALLEL_PR_FIXER: "20"
        run: |
          chmod +x scripts/fix-rejected-prs.sh
          bash scripts/fix-rejected-prs.sh
