name: AI PR Fast Reviewer

on:
  pull_request:
    types: [synchronize]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: fast-reviewer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review_and_fix:
    if: github.actor != 'claude-code[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fast-path check wait
        if: github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          CHECKS=$(gh pr checks "$PR" --repo ${{ github.repository }} --json state,conclusion,name 2>/dev/null || echo "[]")
          if [ "$CHECKS" = "[]" ]; then echo "No checks. Proceeding."; exit 0; fi
          PENDING=$(echo "$CHECKS" | jq '[.[] | select(.state=="IN_PROGRESS" or .state=="PENDING" or .state=="QUEUED")] | length')
          if [ "$PENDING" -eq 0 ]; then echo "All checks done. Fast path."; echo "$CHECKS" | jq -r '.[] | "  \(.name): \(.conclusion // .state)"'; exit 0; fi
          echo "$PENDING check(s) running. Waiting (max 5 min)..."
          for i in $(seq 1 30); do
            CHECKS=$(gh pr checks "$PR" --repo ${{ github.repository }} --json state,conclusion,name 2>/dev/null || echo "[]")
            PENDING=$(echo "$CHECKS" | jq '[.[] | select(.state=="IN_PROGRESS" or .state=="PENDING" or .state=="QUEUED")] | length')
            if [ "$PENDING" -eq 0 ]; then echo "All done."; break; fi
            echo "[$i/30] $PENDING pending"
            sleep 10
          done

      - name: Safe merge with main
        if: github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git fetch origin main
          git config user.email "swarm@hellotalk.ai"
          git config user.name "AI Swarm"
          if git merge origin/main --no-edit 2>/dev/null; then
            echo "Clean merge."
            git push origin HEAD 2>/dev/null || true
          else
            echo "Conflicts detected - aborting merge. NEVER committing conflict markers."
            git merge --abort 2>/dev/null || true
            echo "Leaving branch as-is for the AI reviewer to resolve."
          fi

      - name: Check SKIP_CLAUDE
        id: skip
        run: |
          if [ "${{ vars.SKIP_CLAUDE || 'false' }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "SKIP_CLAUDE=true - bypassing Claude, going straight to DeepSeek."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Tier 1 - Claude Code
        if: steps.skip.outputs.skip != 'true'
        id: primary
        continue-on-error: true
        timeout-minutes: 5
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            You are the AI PR Reviewer. PR #${{ github.event.pull_request.number }}.

            CRITICAL: If merge conflicts exist, read BOTH sides and resolve properly.
            HARD RULE: Do NOT merge unless all builds+tests pass. Fix, commit, push, re-run. Repeat until green.

            MANDATORY GATE:
            1. Review code changes thoroughly.
            2. cd backend && npm run lint && npm run build && npm test
            3. cd frontend && npm run lint && npx ng build && npm test -- --watch=false
            4. If ANY build or test fails, FIX IT. Commit + push. Re-run from step 2.
            5. Remove ALL conflict markers from every file.
            6. Only when EVERYTHING passes: timeout 600 gh pr checks ${{ github.event.pull_request.number }} --watch 2>/dev/null || true
            7. If green: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
            8. DO NOT FINISH until merged. Never merge broken code.

      - name: Check merged
        id: check_claude
        if: github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state -q '.state' 2>/dev/null || echo "OPEN")
          if [ "$STATE" = "MERGED" ]; then echo "merged=true" >> $GITHUB_OUTPUT; echo "Merged by Claude.";
          else echo "merged=false" >> $GITHUB_OUTPUT; echo "Falling to DeepSeek."; fi

      - name: Tier 2 - DeepSeek
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.primary.outcome == 'skipped' || steps.check_claude.outcome == 'failure' || steps.check_claude.outputs.merged != 'true'
        continue-on-error: true
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: 'deepseek/deepseek-v4-pro'
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          openhands_image: 'ghcr.io/all-hands-ai/openhands:0.32'
          runtime_image: 'ghcr.io/all-hands-ai/runtime:0.32-nikolaik'
          prompt: >
            Review PR #${{ github.event.pull_request.number }}.

            MANDATORY: run \`npm run lint\`, build, and test both backend and frontend. Fix all failures.
            Remove conflict markers. Only merge when green.
            timeout 600 gh pr checks ${{ github.event.pull_request.number }} --watch 2>/dev/null || true
            gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
          cli_args: '--max-iterations 80'

      - name: Tier 3 - Gemini
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: 'gemini/gemini-3.5-flash'
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          openhands_image: 'ghcr.io/all-hands-ai/openhands:0.32'
          runtime_image: 'ghcr.io/all-hands-ai/runtime:0.32-nikolaik'
          prompt: >
            Review PR #${{ github.event.pull_request.number }}. Run \`npm run lint\`, build, test, fix, merge.
            timeout 600 gh pr checks ${{ github.event.pull_request.number }} --watch 2>/dev/null || true
            gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
          cli_args: '--max-iterations 40'

      - name: Hard failure gate - PR still open after all tiers
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state -q '.state' 2>/dev/null || echo "OPEN")
          if [ "$STATE" = "OPEN" ]; then
            echo "All AI reviewer tiers exhausted. PR still open."
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
              --body "All AI reviewer tiers (Claude, DeepSeek, Gemini) exhausted without merging. This PR needs manual review."
          elif [ "$STATE" = "MERGED" ]; then
            echo "PR merged successfully."
          fi

  fix_stale_prs:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix stale PRs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          MAX_PARALLEL_PR_FIXER: '20'
        run: |
          chmod +x scripts/fix-rejected-prs.sh
          bash scripts/fix-rejected-prs.sh
