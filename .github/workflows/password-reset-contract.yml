name: Password Reset Contract

on:
  pull_request:
    paths:
      - 'frontend/src/app/routes/auth.routes.ts'
      - 'frontend/src/app/components/forgot-password/**'
      - 'frontend/src/app/services/auth.service.ts'
      - 'backend/src/password-reset/**'
      - 'backend/src/email/email.service.ts'
      - 'scripts/password-reset-contract.test.mjs'
      - 'docs/password-reset.md'
      - '.github/workflows/password-reset-contract.yml'
  push:
    branches: [main, develop]
    paths:
      - 'frontend/src/app/routes/auth.routes.ts'
      - 'frontend/src/app/components/forgot-password/**'
      - 'frontend/src/app/services/auth.service.ts'
      - 'backend/src/password-reset/**'
      - 'backend/src/email/email.service.ts'
      - 'scripts/password-reset-contract.test.mjs'
      - 'docs/password-reset.md'
      - '.github/workflows/password-reset-contract.yml'
  merge_group:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate password recovery contract
        run: node --test scripts/password-reset-contract.test.mjs
