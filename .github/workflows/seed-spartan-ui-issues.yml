name: Seed Spartan UI migration backlog

on:
  push:
    branches:
      - main
    paths:
      - scripts/seed-spartan-ui-issues.mjs
      - .github/workflows/seed-spartan-ui-issues.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: seed-spartan-ui-migration-backlog
  cancel-in-progress: false

jobs:
  seed:
    name: Create numbered Spartan UI migration issues
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Seed migration backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/seed-spartan-ui-issues.mjs

      - name: Verify complete numbered migration backlog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const [owner, repo] = process.env.GH_REPOSITORY.split('/');
          const token = process.env.GH_TOKEN;
          const seen = new Set();
          let page = 1;

          while (true) {
            const response = await fetch(
              `https://api.github.com/repos/${owner}/${repo}/issues?state=all&per_page=100&page=${page}`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'elgl-spartan-ui-backlog-verifier',
                },
              },
            );
            if (!response.ok) {
              throw new Error(`GitHub issue verification failed with HTTP ${response.status}`);
            }
            const items = await response.json();
            for (const item of items) {
              if (item.pull_request) continue;
              const match = /^\[Spartan UI (\d{4})\]/.exec(item.title);
              if (match) seen.add(Number(match[1]));
            }
            if (items.length < 100) break;
            page += 1;
          }

          const missing = [];
          for (let id = 1; id <= 1050; id += 1) {
            if (!seen.has(id)) missing.push(String(id).padStart(4, '0'));
          }

          if (missing.length) {
            throw new Error(
              `Spartan UI backlog is incomplete: ${missing.length} IDs missing: ${missing.slice(0, 40).join(', ')}${missing.length > 40 ? ', ...' : ''}. Re-run this job to resume the idempotent seeder.`,
            );
          }

          console.log('Verified all Spartan UI tickets 0001 through 1050 exist with no numbered gaps.');
          NODE
