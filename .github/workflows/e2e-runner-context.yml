name: E2E Runner Context

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: e2e-runner-context-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-discovery:
    name: e2e / playwright-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Verify test runner ownership
        run: node --test scripts/verify-test-runner-contexts.test.mjs && node scripts/verify-test-runner-contexts.mjs

      - name: Install E2E dependencies
        run: npm ci --legacy-peer-deps
        working-directory: e2e

      - name: Verify Playwright test discovery from E2E package
        run: npm test -- --list
        working-directory: e2e
