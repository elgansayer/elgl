name: UI visual capture

on:
  pull_request:
    branches: [main]
    paths:
      - 'design-sync.manifest.json'
      - 'visual-contract.matrix.json'
      - 'frontend/package.json'
      - 'frontend/design-preview/**'
      - 'frontend/cypress/visual/**'
      - 'frontend/cypress.visual.config.ts'
      - 'frontend/scripts/serve-design-preview.mjs'
      - 'scripts/verify-visual-contract-matrix.mjs'
      - '.github/workflows/ui-visual-capture.yml'
  push:
    branches: [main]
    paths:
      - 'design-sync.manifest.json'
      - 'visual-contract.matrix.json'
      - 'frontend/package.json'
      - 'frontend/design-preview/**'
      - 'frontend/cypress/visual/**'
      - 'frontend/cypress.visual.config.ts'
      - 'frontend/scripts/serve-design-preview.mjs'
      - 'scripts/verify-visual-contract-matrix.mjs'
      - '.github/workflows/ui-visual-capture.yml'

permissions:
  contents: read

concurrency:
  group: ui-visual-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Validate visual contract matrix
        run: node scripts/verify-visual-contract-matrix.mjs
      - name: Capture deterministic visual states
        run: npm run visual:capture:ci
        working-directory: frontend
      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-visual-captures-${{ github.sha }}
          path: frontend/cypress/visual-artifacts
          if-no-files-found: warn
          retention-days: 14
