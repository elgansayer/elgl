name: Add workflow timeouts once

on:
  push:
    branches:
      - ci/add-missing-timeouts-20260815

permissions:
  contents: write

jobs:
  add-timeouts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/add-missing-timeouts-20260815
          token: ${{ secrets.PAT_TOKEN }}
      - name: Add explicit job timeouts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              '.github/workflows/architect.yml': 90,
              '.github/workflows/openhands.yml': 90,
              '.github/workflows/pr-reviewer.yml': 90,
              '.github/workflows/auto-dispatcher.yml': 15,
              '.github/workflows/daily-wiki-update.yml': 30,
              '.github/workflows/factory-merge.yml': 15,
              '.github/workflows/admin-backlog-governance.yml': 20,
              '.github/workflows/wiki-sync.yml': 15,
          }

          for filename, timeout in targets.items():
              path = Path(filename)
              source = path.read_text()
              if 'timeout-minutes:' in source:
                  print(f'{filename}: timeout already present; leaving unchanged')
                  continue
              needle = '    runs-on: ubuntu-latest\n'
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f'{filename}: expected exactly one ubuntu job, found {count}')
              source = source.replace(
                  needle,
                  f'    runs-on: ubuntu-latest\n    timeout-minutes: {timeout}\n',
                  1,
              )
              path.write_text(source)
              print(f'{filename}: added {timeout}-minute timeout')
          PY
      - name: Commit timeout changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "ci: bound remaining workflow jobs with timeouts"
          git push origin HEAD:ci/add-missing-timeouts-20260815
