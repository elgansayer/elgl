name: Centrifugo Redis Contract

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: centrifugo-redis-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  centrifugo-redis-contract:
    name: realtime / centrifugo-redis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify Centrifugo Redis configuration
        run: node --test scripts/verify-centrifugo-redis.test.mjs
