name: AI Auto-Resolver

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: openhands-swarm
  cancel-in-progress: false

jobs:
  ai-agent:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/openhands-fix')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/openhands-fix')) ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issues')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Tier 1 - OpenHands (Gemini 3.6 Flash)
        id: primary
        continue-on-error: true
        uses: xinbenlv/openhands-action@main
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.6-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: "Please review the issue or PR and solve the requested changes."
          cli_args: "--max-iterations 30"
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"

      - name: Tier 2 - OpenHands (DeepSeek Coder Fallback)
        id: secondary
        if: steps.primary.outcome == 'failure'
        uses: xinbenlv/openhands-action@main
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "deepseek/deepseek-coder"
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          prompt: "Please review the issue or PR and solve the requested changes."
          cli_args: "--max-iterations 30"
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
