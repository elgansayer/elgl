name: AI Auto-Resolver

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  # Per-issue concurrency: different issues run in parallel, same issue is serialised
  group: openhands-issue-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  ai-agent:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/openhands-fix')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/openhands-fix')) ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issues')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # ── TIER 1: Claude Code ────────────────────────────────────────────────
      - name: Tier 1 - Claude Code (Claude Pro via OAuth)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            Please resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Issue body: "${{ github.event.issue.body }}".
            1. Write the code to fix the issue completely.
            2. Run tests to verify the fix works.
            3. Commit your changes with a descriptive message.
            4. Create a PR: gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"
            CRITICAL: If GitHub rejects the merge because checks are still running, poll
            'gh pr checks <number> --watch' and retry. DO NOT FINISH until the PR is created.

      # Auto-skip: claude-code-action exits 0 even on auth/quota errors.
      # We check whether a PR was actually created for this issue instead.
      - name: Check if Claude created a PR
        id: check_claude
        if: github.event.issue.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ISSUE="${{ github.event.issue.number }}"
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          COUNT=$(gh pr list --repo ${{ github.repository }} \
            --search "Fixes #${ISSUE} in:body" \
            --state open --json number -q 'length' 2>/dev/null || echo "0")
          echo "pr_count=$COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "Claude created a PR — skipping lower tiers."
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "Claude did NOT create a PR (token exhausted or error) — falling through to Tier 2."
          fi

      # ── TIER 2: DeepSeek V3 Chat (paid, heavy lifting) ────────────────────
      - name: Tier 2 - OpenHands (DeepSeek V3 — paid heavy fallback)
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.check_claude.outputs.pr_exists == 'false'
        continue-on-error: true
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "deepseek/deepseek-v4-pro"
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          prompt: >
            Please resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Issue body: "${{ github.event.issue.body }}".
            1. Write the code to fix the issue completely.
            2. Run tests to verify the fix works.
            3. Commit your changes with a descriptive message.
            4. Create a PR: gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"
            CRITICAL: DO NOT FINISH until the PR is created and visible on GitHub.
          cli_args: "--max-iterations 50"
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"

      # ── TIER 3: Gemini 3.6 Flash (lightweight last resort) ────────────────
      - name: Tier 3 - OpenHands (Gemini 3.6 Flash — last resort)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.5-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: >
            Please resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Issue body: "${{ github.event.issue.body }}".
            1. Write the code to fix the issue completely.
            2. Commit your changes with a descriptive message.
            3. Create a PR: gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"
            CRITICAL: DO NOT FINISH until the PR is created.
          cli_args: "--max-iterations 30"
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
