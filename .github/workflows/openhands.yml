name: AI Auto-Resolver

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  # Per-issue concurrency: different issues run in parallel, same issue is serialised
  group: openhands-issue-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  ai-agent:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/openhands-fix')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/openhands-fix')) ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issues')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── TIER 1: Claude Code ────────────────────────────────────────────────
      - name: Tier 1 - Claude Code (Claude Pro via OAuth)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            Please resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Issue body: "${{ github.event.issue.body }}".

            MANDATORY VERIFICATION GATE — follow these steps IN ORDER:

            1. Write the code to fix the issue completely.
            2. Run the full verification suite. This is NOT optional:
               - Backend: cd backend && npm run lint && npm run build && npm test
               - Frontend: cd frontend && npm run lint && npx ng build && npm test -- --watch=false
               - Root: npm run check:constitution 2>/dev/null || true
            3. If ANY build fails or ANY test fails, FIX THE CODE and re-run from step 2.
               Do NOT proceed until EVERYTHING passes.
            4. Run: npm run check:control-flow 2>/dev/null || true
            5. Run: npm run check:rtl-logical 2>/dev/null || true
            6. Run: npm run check:template-bindings 2>/dev/null || true
            7. Scan ALL changed files for merge conflict markers (<<<<<<<, =======, >>>>>>>).
               If ANY are found, DELETE them and re-run verification from step 2.
            8. Only when ALL checks pass: commit with a descriptive message.
            9. Create a PR: gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"

            CRITICAL: A PR with broken builds or failing tests is UNACCEPTABLE.
            Fix everything before creating the PR. DO NOT FINISH until all checks pass and the PR is created.

      # Auto-skip: claude-code-action exits 0 even on auth/quota errors.
      # We check whether a PR was actually created for this issue instead.
      - name: Check if Claude created a PR
        id: check_claude
        if: github.event.issue.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ISSUE="${{ github.event.issue.number }}"
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          COUNT=$(gh pr list --repo ${{ github.repository }} \
            --search "Fixes #${ISSUE} in:body" \
            --state open --json number -q 'length' 2>/dev/null || echo "0")
          echo "pr_count=$COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "Claude created a PR — skipping lower tiers."
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "Claude did NOT create a PR (token exhausted or error) — falling through to Tier 2."
          fi

      # ── TIER 2: DeepSeek V3 Chat (paid, heavy lifting) ────────────────────
      - name: Tier 2 - OpenHands (DeepSeek V3 — paid heavy fallback)
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.check_claude.outputs.pr_exists == 'false'
        continue-on-error: true
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "deepseek/deepseek-v4-pro"
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          prompt: >
            Please resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Issue body: "${{ github.event.issue.body }}".

            MANDATORY: Before creating a PR, you MUST run the full verification and fix all failures:

            1. Write the code.
            2. cd backend && npm run lint && npm run build && npm test
            3. cd frontend && npm run lint && npx ng build && npm test -- --watch=false
            4. If ANYTHING fails, FIX IT and re-run from step 2.
            5. Scan for conflict markers (<<<<<<<, =======, >>>>>>>) in ALL changed files. Remove them.
            6. Only when EVERYTHING passes: commit and create PR:
               gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"
            DO NOT create a PR with broken code. Fix everything first.
          cli_args: "--max-iterations 50"
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"

      # ── TIER 3: Gemini 3.6 Flash (lightweight last resort) ────────────────
      - name: Tier 3 - OpenHands (Gemini 3.6 Flash — last resort)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: "gemini/gemini-3.5-flash"
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: >
            Please resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Issue body: "${{ github.event.issue.body }}".

            MANDATORY: Before creating a PR:
            1. Write the code.
            2. cd backend && npm run build && npm test
            3. cd frontend && npx ng build && npm test -- --watch=false
            4. Fix any failures, re-run until everything passes.
            5. Scan for and remove conflict markers (<<<<<<<, =======, >>>>>>>).
            6. Commit and create PR:
               gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"
            DO NOT create a PR with broken code. Fix everything first.
          cli_args: "--max-iterations 30"
          openhands_image: "ghcr.io/all-hands-ai/openhands:0.32"
          runtime_image: "ghcr.io/all-hands-ai/runtime:0.32-nikolaik"
