name: AI Auto-Resolver

on:
  issue_comment:
    types: [created]

concurrency:
  group: openhands-issue-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  ai-agent:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/openhands-fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tier 1 - Claude Code (Claude Pro via OAuth)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          prompt: >
            Resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Issue body: "${{ github.event.issue.body }}".

            ## INLINE FIX PROTOCOL - check first, do NOT create duplicate fix PRs

            BEFORE writing code, check if an open PR already references this issue:
              gh pr list --repo ${{ github.repository }} --search "Fixes #${{ github.event.issue.number }} in:body" --state open --json number,headRefName
            If an existing PR is found:
              - Check out that PR's branch: gh pr checkout <NUMBER>
              - If checkout fails (deleted branch): create a new PR instead
              - If checkout succeeds: apply fixes and commit to that branch, then push
              - DO NOT create a new PR — fix inline in the existing one
            If NO existing PR: proceed with creating one at the final step.

            MANDATORY VERIFICATION GATE:

            1. Write the code to fix the issue completely.
            2. Run the full verification suite:
               - Backend: cd backend && npm run lint && npm run build && npm test
               - Frontend: cd frontend && npm run lint && npx ng build && npm test -- --watch=false
            3. If ANY build or test fails, FIX IT and re-run from step 2.
            4. Run: npm run check:control-flow 2>/dev/null || true
            5. Run: npm run check:rtl-logical 2>/dev/null || true
            6. Run: npm run check:template-bindings 2>/dev/null || true
            7. Scan ALL changed files for merge conflict markers (<<<<<<<, =======, >>>>>>>).
               If ANY found, DELETE them and re-run verification from step 2.
            8. Only when ALL checks pass: commit with descriptive message, push.
               If fixing inline in an existing PR, you are done.
               If no PR exists: gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"

            HARD RULE: Do NOT call gh pr create unless ALL verification steps pass.
            A PR with failing builds is FORBIDDEN.

      - name: Check if Claude created or updated a PR
        id: check_claude
        if: github.event.issue.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ISSUE="${{ github.event.issue.number }}"
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          COUNT=$(gh pr list --repo ${{ github.repository }} \
            --search "Fixes #${ISSUE} in:body" \
            --state open --json number -q 'length' 2>/dev/null || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "PR exists (created/updated by Claude) - skipping lower tiers."
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "No PR found - falling through to Tier 2."
          fi

      - name: Tier 2 - OpenHands (DeepSeek V3)
        id: secondary
        if: steps.primary.outcome == 'failure' || steps.check_claude.outcome == 'failure' || steps.check_claude.outputs.pr_exists == 'false'
        continue-on-error: true
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: 'deepseek/deepseek-v4-pro'
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          prompt: >
            Resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Issue body: "${{ github.event.issue.body }}".

            ## INLINE FIX PROTOCOL - check first:
            Check if an open PR already references this issue:
              gh pr list --repo ${{ github.repository }} --search "Fixes #${{ github.event.issue.number }} in:body" --state open --json number,headRefName
            If an existing PR is found: checkout its branch, fix inline, commit+push to that branch. Do NOT create a duplicate.
            If no PR exists: create one at the final step.

            MANDATORY:
            1. Write the code.
            2. cd backend && npm run lint && npm run build && npm test
            3. cd frontend && npm run lint && npx ng build && npm test -- --watch=false
            4. If ANYTHING fails, FIX IT and re-run from step 2.
            5. Remove all conflict markers (<<<<<<<, =======, >>>>>>>).
            6. Commit and push.
            7. If no existing PR: gh pr create --title "Fixes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" --body "Fixes #${{ github.event.issue.number }}"
            HARD RULE: Do NOT create PR unless all commands succeed.
            Fix failures, re-run, repeat until green.
          cli_args: '--max-iterations 50'
          openhands_image: 'ghcr.io/all-hands-ai/openhands:0.32'
          runtime_image: 'ghcr.io/all-hands-ai/runtime:0.32-nikolaik'

      - name: Tier 3 - OpenHands (Gemini 3.5 Flash)
        id: tertiary
        if: steps.secondary.outcome == 'failure'
        uses: xinbenlv/openhands-action@v1.0.1
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          llm_model: 'gemini/gemini-3.5-flash'
          llm_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: >
            Resolve issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".

            ## INLINE FIX PROTOCOL - check first:
            Check if an open PR already references this issue.
            If yes: checkout its branch, fix inline, commit+push. Do NOT create a duplicate.
            If no: create a new PR.

            MANDATORY: build + test. Fix failures, remove conflict markers.
            Commit and push. If no existing PR: create one.
            HARD RULE: Do NOT create PR unless all builds+tests pass.
          cli_args: '--max-iterations 30'
          openhands_image: 'ghcr.io/all-hands-ai/openhands:0.32'
          runtime_image: 'ghcr.io/all-hands-ai/runtime:0.32-nikolaik'

      - name: Cleanup stuck swarm-active label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ISSUE="${{ github.event.issue.number }}"
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then exit 0; fi
          COUNT=$(gh pr list --repo ${{ github.repository }} --search "Fixes #${ISSUE} in:body" --state open --json number -q 'length' 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then
            echo "No open PR found for issue #$ISSUE. Removing swarm-active label to allow retry."
            gh issue edit "$ISSUE" --remove-label "swarm-active" --repo ${{ github.repository }} || true
          fi
