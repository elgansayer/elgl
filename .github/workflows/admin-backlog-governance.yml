name: Admin backlog governance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-backlog-governance.yml'
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: admin-backlog-governance
  cancel-in-progress: false

jobs:
  govern:
    if: >-
      github.event_name != 'issues' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'factory-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate admin issues until explicitly ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'elgl-admin-backlog-governance',
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          def labels_of(issue):
              return {label.get('name', '') for label in issue.get('labels', [])}

          def is_admin_issue(issue):
              title = ' '.join(str(issue.get('title', '')).split()).lower()
              return title.startswith('admin ') or title.startswith('advanced admin ')

          def ensure_label(name, color, description):
              try:
                  request('POST', f'{api}/labels', {
                      'name': name,
                      'color': color,
                      'description': description,
                  })
              except urllib.error.HTTPError as exc:
                  if exc.code != 422:
                      raise

          ensure_label(
              'admin-awaiting-ready',
              'd4c5f9',
              'Admin work is intentionally gated until factory-ready is applied.',
          )
          ensure_label('factory-skip', 'cfd3d7', 'Excluded from Factory implementation.')

          event_name = os.environ.get('EVENT_NAME', '')
          event_issue = os.environ.get('EVENT_ISSUE_NUMBER', '').strip()
          issues = []
          if event_name == 'issues' and event_issue:
              issue = request('GET', f'{api}/issues/{int(event_issue)}')
              if issue and 'pull_request' not in issue:
                  issues.append(issue)
          else:
              page = 1
              while True:
                  rows = request('GET', f'{api}/issues?state=open&per_page=100&page={page}') or []
                  if not rows:
                      break
                  issues.extend(item for item in rows if 'pull_request' not in item)
                  if len(rows) < 100:
                      break
                  page += 1

          protected_states = {
              'factory-active',
              'guardian-alert',
              'factory-epic',
              'factory-planning',
              'factory-quarantined',
              'factory-quality-blocked',
              'needs-human',
              'duplicate',
          }

          gated = promoted = unchanged = 0
          for issue in issues:
              if not is_admin_issue(issue):
                  continue

              number = int(issue['number'])
              labels = labels_of(issue)

              if 'factory-ready' in labels:
                  remove = [name for name in ('factory-skip', 'admin-awaiting-ready') if name in labels]
                  for name in remove:
                      try:
                          encoded = urllib.parse.quote(name, safe='')
                          request('DELETE', f'{api}/issues/{number}/labels/{encoded}')
                      except urllib.error.HTTPError as exc:
                          if exc.code != 404:
                              raise
                  if remove:
                      promoted += 1
                      print(f'promoted #{number}: {issue["title"]}')
                  else:
                      unchanged += 1
                  continue

              if labels.intersection(protected_states):
                  unchanged += 1
                  continue

              missing = [
                  name for name in ('factory-skip', 'admin-awaiting-ready')
                  if name not in labels
              ]
              if missing:
                  request('POST', f'{api}/issues/{number}/labels', {'labels': missing})
                  gated += 1
                  print(f'gated #{number}: {issue["title"]}')
              else:
                  unchanged += 1

          print(f'admin governance complete: gated={gated} promoted={promoted} unchanged={unchanged}')
          PY
