name: Web Security Diagnostic

on:
  pull_request:
    paths:
      - frontend/Dockerfile
      - .github/workflows/web-security-diagnostic.yml

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build production Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          file: frontend/Dockerfile
          target: production
          load: true
          tags: elgl-web-security-diagnostic:${{ github.sha }}
          cache-from: type=gha

      - name: Scan production Web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: elgl-web-security-diagnostic:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m
