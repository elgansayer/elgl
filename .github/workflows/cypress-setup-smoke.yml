name: Cypress Setup Smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: cypress-setup-smoke-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  cypress-setup:
    name: e2e / cypress-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Run Cypress setup smoke spec
        run: |
          python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/cypress-smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx cypress run --browser electron --spec cypress/e2e/cypress-setup.cy.ts
        working-directory: frontend
