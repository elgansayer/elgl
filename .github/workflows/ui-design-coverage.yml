name: UI design coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'design-sync.manifest.json'
      - 'frontend/src/app/**'
      - 'frontend/design-preview/**'
      - 'scripts/report-ui-design-coverage.mjs'
      - '.github/workflows/ui-design-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'design-sync.manifest.json'
      - 'frontend/src/app/**'
      - 'frontend/design-preview/**'
      - 'scripts/report-ui-design-coverage.mjs'
      - '.github/workflows/ui-design-coverage.yml'

permissions:
  contents: read

concurrency:
  group: ui-design-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate machine and human readable coverage reports
        run: node scripts/report-ui-design-coverage.mjs --write
      - name: Add coverage summary
        run: cat reports/ui-design-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-design-coverage-${{ github.sha }}
          path: |
            reports/ui-design-coverage.json
            reports/ui-design-coverage.md
          if-no-files-found: error
          retention-days: 30
