name: Temporary main CI repair

on:
  push:
    branches: [fix/restore-main-ci-20260824-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRANSFER_SECRET: ci-test-transfer-secret
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Apply repository backend lint autofixes
        run: npm run lint
        working-directory: backend

      - name: Commit backend lint autofixes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- backend)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend
            git commit -m "style(ci): commit backend lint autofixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify backend lint
        run: npm run lint:check
        working-directory: backend

      - name: Verify backend build
        run: npm run build
        working-directory: backend

      - name: Verify backend unit tests
        run: npm run test:cov -- --reporter=default --reporter=github-actions
        working-directory: backend

      - name: Verify backend e2e tests
        run: npm run test:e2e -- --reporter=default --reporter=github-actions
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Verify frontend static analysis
        run: npm run check:control-flow && npm run check:template-bindings && npm run check:rtl-logical && npm run lint:check
        working-directory: frontend

      - name: Verify frontend build
        run: npm run build
        working-directory: frontend

      - name: Verify frontend unit tests
        run: npm test -- --reporters=default
        working-directory: frontend

      - name: Remove temporary repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-main-ci-branch.yml
          git commit -m "chore(ci): remove temporary repair workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
