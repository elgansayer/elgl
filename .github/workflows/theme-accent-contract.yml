name: Theme Accent Contract

on:
  pull_request:
    paths:
      - 'frontend/src/app/services/theme.service.ts'
      - 'frontend/src/app/services/theme.service.spec.ts'
      - 'frontend/scripts/check-theme-accent-contract.mjs'
      - 'docs/theme-service-accent-contract.md'
      - '.github/workflows/theme-accent-contract.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/app/services/theme.service.ts'
      - 'frontend/src/app/services/theme.service.spec.ts'
      - 'frontend/scripts/check-theme-accent-contract.mjs'
      - 'docs/theme-service-accent-contract.md'
      - '.github/workflows/theme-accent-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify ThemeService and accent ownership
        run: node frontend/scripts/check-theme-accent-contract.mjs
