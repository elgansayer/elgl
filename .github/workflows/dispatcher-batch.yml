name: Swarm Batch Dispatcher

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  batch_dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Batch dispatch all available issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          MAX_CONCURRENT=100
          RUNNING=$(gh run list --repo ${{ github.repository }} \
            --workflow openhands.yml --status in_progress \
            --json databaseId -q 'length' 2>/dev/null || echo "0")
          SLOTS=$((MAX_CONCURRENT - RUNNING))
          if [ "$SLOTS" -le 0 ]; then
            echo "$RUNNING running. No slots. Exiting."
            exit 0
          fi
          echo "Slots: $SLOTS (running: $RUNNING)"

          gh label create "swarm-active" --color "0E8A16" --force --repo ${{ github.repository }} || true
          gh label create "priority:high" --color "B60205" --force --repo ${{ github.repository }} || true
          gh label create "priority:medium" --color "E4E669" --force --repo ${{ github.repository }} || true
          gh label create "priority:low" --color "C2E0C6" --force --repo ${{ github.repository }} || true

          HIGH=$(gh issue list --repo ${{ github.repository }} --state open --label "priority:high" \
            --search "-label:swarm-active sort:created-asc" --limit "$SLOTS" --json number -q '.[].number' 2>/dev/null || echo "")
          UNLABELLED=$(gh issue list --repo ${{ github.repository }} --state open \
            --search "-label:swarm-active -label:priority:high -label:priority:medium -label:priority:low sort:created-asc" \
            --limit "$SLOTS" --json number -q '.[].number' 2>/dev/null || echo "")
          MEDIUM=$(gh issue list --repo ${{ github.repository }} --state open --label "priority:medium" \
            --search "-label:swarm-active sort:created-asc" --limit "$SLOTS" --json number -q '.[].number' 2>/dev/null || echo "")
          LOW=$(gh issue list --repo ${{ github.repository }} --state open --label "priority:low" \
            --search "-label:swarm-active sort:created-asc" --limit "$SLOTS" --json number -q '.[].number' 2>/dev/null || echo "")

          ALL_ISSUES=$(printf '%s\n' $HIGH $UNLABELLED $MEDIUM $LOW | sort -u | head -n "$SLOTS")
          COUNT=$(echo "$ALL_ISSUES" | grep -c . 2>/dev/null || echo "0")
          if [ "$COUNT" -eq 0 ]; then echo "Queue empty."; exit 0; fi

          echo "Dispatching $COUNT issues..."
          D=0
          for i in $ALL_ISSUES; do
            [ -z "$i" ] && continue
            gh issue edit "$i" --add-label "swarm-active" --repo ${{ github.repository }} || true
            gh issue comment "$i" --body "/fast-fix" --repo ${{ github.repository }} || true
            D=$((D+1))
            echo "  [$D/$COUNT] #$i"
          done
          echo "Done: $D dispatched."
