name: Validate API Trivy repair

on:
  push:
    branches: [fix/ci-api-trivy-20260826]

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate backend lockfile from scratch
        working-directory: backend
        run: |
          set -euo pipefail
          rm package-lock.json
          npm install --package-lock-only --legacy-peer-deps

      - name: Verify deterministic backend install
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Verify vulnerable spreadsheet runtime is gone
        working-directory: backend
        run: |
          set -euo pipefail
          npm ls node-nlp
          if npm ls xlsx >/dev/null 2>&1; then
            echo '::error::xlsx is still present in the backend dependency tree'
            npm ls xlsx
            exit 1
          fi

      - name: Backend lint
        working-directory: backend
        run: npm run lint:check

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Backend unit tests
        working-directory: backend
        run: npm test

      - name: Build production API image
        run: docker build --target production -t elgl-api-trivy-repair:${{ github.sha }} backend

      - name: Scan production API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: elgl-api-trivy-repair:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m

      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json
          git rm .github/workflows/diagnose-api-trivy.yml
          git diff --cached --check
          git commit -m 'fix(security): regenerate backend lock without xlsx'
          git push origin HEAD:fix/ci-api-trivy-20260826
