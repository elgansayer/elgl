name: Seed comprehensive admin backlog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-backlog-seed.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: admin-backlog-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Create curated admin issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'elgl-admin-backlog-seeder',
          }

          domains = [
              'Account Security', 'User Lifecycle', 'Identity & Verification',
              'Roles & Permissions', 'Moderator Operations', 'Reports & Cases',
              'Content Moderation', 'Spam & Bots', 'Network Abuse', 'Device Abuse',
              'Groups & Communities', 'Direct Messaging', 'Live Audio & Video',
              'Media & Uploads', 'Search & Discovery', 'Feeds & Recommendations',
              'Notifications & Broadcasts', 'Payments & Marketplace', 'Privacy & DSAR',
              'Legal & Compliance', 'Audit & Forensics', 'Logs & Observability',
              'Background Jobs', 'Database Operations', 'Cache & Redis',
              'Storage & CDN', 'Email & Push Delivery', 'Feature Flags & Configuration',
              'Incident Response', 'Backups & Disaster Recovery', 'API & Integrations',
              'Admin Frontend Support', 'Analytics & Metrics', 'Child & Teen Safety',
              'Localization & Regional Policy', 'Support Operations', 'Fraud Prevention',
              'Rate Limits & Traffic Control', 'Secrets & Credentials', 'Data Retention'
          ]

          actions = [
              ('Add scoped search and filtering controls', 'Provide permission-aware search, filters, pagination and bounded query limits for this domain.'),
              ('Add detailed entity inspection API', 'Expose the minimum safe operational metadata needed for authorized investigation and support.'),
              ('Add reversible administrative action workflow', 'Support safe reversible admin mutations with reasons, expiry where applicable and restoration.'),
              ('Add bulk action preview and dry-run support', 'Provide target previews, eligibility counts, maximum batch sizes and dry-run behavior before bulk mutations.'),
              ('Add per-action capability authorization', 'Define granular backend capabilities and enforce them server-side for every privileged operation in this domain.'),
              ('Add step-up authentication for high-risk mutations', 'Require recent strong authentication before dangerous or privacy-sensitive mutations.'),
              ('Add immutable audit events for privileged access', 'Record actor, target, action, reason, result and correlation identifiers without leaking secrets.'),
              ('Add reason codes and operator notes', 'Define structured reasons and private operator notes with validation, retention and access controls.'),
              ('Add approval workflow for destructive changes', 'Require independent approval for selected irreversible or high-impact actions and prevent self-approval.'),
              ('Add temporary actions with automatic expiry', 'Support time-bounded restrictions or overrides that automatically revert safely at expiry.'),
              ('Add rollback and restoration controls', 'Preserve enough prior state to safely restore reversible admin changes and record restoration history.'),
              ('Add admin notification and confirmation hooks', 'Notify affected operators or users when policy requires it and expose delivery state to authorized admins.'),
              ('Add export controls with redaction', 'Allow bounded exports for legitimate operational needs while applying field-level redaction and access auditing.'),
              ('Add retention and deletion policy enforcement', 'Apply domain-specific retention, deletion, legal-hold and minimization rules to privileged data.'),
              ('Add anomaly detection and alerting', 'Surface unusual activity, spikes, failures or abuse patterns with explainable signals and tunable thresholds.'),
              ('Add operational dashboard metrics', 'Expose sanitized counts, rates, latency, failure and backlog metrics suitable for an admin dashboard.'),
              ('Add concurrency and idempotency safeguards', 'Prevent duplicate or conflicting mutations using idempotency keys, state validation and atomic transitions.'),
              ('Add rate limits and abuse protection for admin endpoints', 'Protect privileged APIs from accidental loops, automation mistakes and compromised admin sessions.'),
              ('Add integration and authorization test suite', 'Cover allowed, denied, cross-scope, stale-session, concurrency and audit behavior in automated tests.'),
              ('Add OpenAPI schema and typed admin client coverage', 'Document the privileged contract and generate typed frontend client support with stable error semantics.')
          ]

          def request(method, url, payload=None, retries=8):
              data = None if payload is None else json.dumps(payload).encode()
              for attempt in range(retries):
                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          raw = resp.read()
                          return resp.status, json.loads(raw) if raw else None
                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode(errors='replace')
                      if exc.code in (403, 429, 502, 503, 504) and attempt + 1 < retries:
                          wait = exc.headers.get('Retry-After')
                          delay = float(wait) if wait else min(60, 2 ** attempt)
                          print(f'retry {exc.code} in {delay}s: {raw[:200]}')
                          time.sleep(delay)
                          continue
                      raise RuntimeError(f'GitHub API {exc.code}: {raw}') from exc

          existing = set()
          page = 1
          while True:
              _, rows = request('GET', f'{api}/issues?state=all&per_page=100&page={page}')
              if not rows:
                  break
              existing.update(x.get('title', '') for x in rows)
              if len(rows) < 100:
                  break
              page += 1

          target = 520
          created = 0
          skipped = 0
          for domain in domains:
              for action, detail in actions:
                  title = f'Admin {domain}: {action}'
                  if title in existing:
                      skipped += 1
                      continue
                  body = f'''## Goal\nBuild production-grade administrative capability for **{domain}**.\n\n## Scope\n{detail}\n\n## Acceptance criteria\n- Enforce authorization on the backend; frontend visibility is never treated as security.\n- Follow least privilege and expose only data required for the operator task.\n- Require structured reasons for sensitive mutations and record tamper-evident audit events.\n- Redact passwords, tokens, secrets and unrelated sensitive personal data.\n- Prefer reversible actions; require stronger safeguards for destructive operations.\n- Add tests for authorized, unauthorized, cross-scope, failure and audit behavior.\n- Provide stable API errors suitable for the dedicated admin frontend.\n'''
                  _, issue = request('POST', f'{api}/issues', {'title': title, 'body': body})
                  created += 1
                  existing.add(title)
                  print(f"created #{issue.get('number')}: {title}")
                  if created >= target:
                      print(f'completed target: created={created}, skipped={skipped}')
                      raise SystemExit(0)
                  time.sleep(1.1)

          if created < target:
              raise SystemExit(f'Only generated {created}; target was {target}')
          PY
# seed-trigger: 2
