name: Spartan dark theme parity

on:
  pull_request:
    paths:
      - 'frontend/src/styles.scss'
      - 'frontend/scripts/check-dark-theme-parity.mjs'
      - 'docs/dark-theme-parity.md'
      - '.github/workflows/spartan-dark-theme-parity.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/styles.scss'
      - 'frontend/scripts/check-dark-theme-parity.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Verify Relay light and dark semantic token parity
        run: node scripts/check-dark-theme-parity.mjs
