name: Self-Healing Workflow Monitor

on:
  workflow_run:
    types: [completed]

permissions:
  issues: write

jobs:
  report-failure:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'Self-Healing Workflow Monitor' &&
      github.event.workflow_run.name != 'AI Auto-Resolver' &&
      github.event.workflow_run.name != 'AI PR Reviewer & Fixer' &&
      github.event.workflow_run.name != 'Swarm Auto-Dispatcher'
    steps:
      - name: Create Issue for visibility
        run: |
          gh label create "guardian-alert" --color "B60205" --force --repo ${{ github.repository }} || true

          ISSUE_URL=$(gh issue create \
            --repo ${{ github.repository }} \
            --title "Workflow Failed: ${{ github.event.workflow_run.name }}" \
            --body "The workflow **${{ github.event.workflow_run.name }}** failed.

          **Run URL:** ${{ github.event.workflow_run.html_url }}
          **Event:** ${{ github.event.workflow_run.event }}
          **Branch:** ${{ github.event.workflow_run.head_branch }}

          Please investigate the logs. If this is a PR branch, fix inline in that branch.
          Do NOT create a follow-up fix PR." \
            --label "guardian-alert")

          echo "Created issue: $ISSUE_URL"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
