name: Self-Healing Workflow Monitor

on:
  workflow_run:
    types: [completed]

jobs:
  report-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != 'Self-Healing Workflow Monitor' }}
    steps:
      - name: Create Issue and Trigger AI
        run: |
          ISSUE_URL=$(gh issue create \
            --repo ${{ github.repository }} \
            --title "🚨 Workflow Failed: ${{ github.event.workflow_run.name }}" \
            --body "The workflow **${{ github.event.workflow_run.name }}** failed!

          **Run URL:** ${{ github.event.workflow_run.html_url }}
          **Event:** ${{ github.event.workflow_run.event }}
          **Branch:** ${{ github.event.workflow_run.head_branch }}

          Please investigate the logs and fix the underlying issue.")

          echo "Created issue: $ISSUE_URL"

          gh issue comment $ISSUE_URL \
            --repo ${{ github.repository }} \
            --body "/openhands-fix please investigate the logs of this workflow run and fix the failure!"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
