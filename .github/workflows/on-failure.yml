name: Self-Healing Workflow Monitor

on:
  workflow_run:
    types: [completed]

jobs:
  report-failure:
    runs-on: ubuntu-latest
    # Exclude self, to avoid an infinite loop of failure issues.
    # Only report genuine CI/CD pipeline failures.
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'Self-Healing Workflow Monitor'
    steps:
      - name: Create issue for the factory to pick up
        run: |
          gh issue create \
            --repo ${{ github.repository }} \
            --title "🚨 Workflow Failed: ${{ github.event.workflow_run.name }}" \
            --body "The workflow **${{ github.event.workflow_run.name }}** failed!

          **Run URL:** ${{ github.event.workflow_run.html_url }}
          **Event:** ${{ github.event.workflow_run.event }}
          **Branch:** ${{ github.event.workflow_run.head_branch }}

          Please investigate the logs and fix the underlying issue." \
            --label "priority:high"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
