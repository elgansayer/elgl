name: Self-Healing Workflow Monitor

on:
  workflow_run:
    workflows:
      - CI
      - Deploy
      - Admin portal CI
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_EVENT: ${{ github.event.workflow_run.event }}
          FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Workflow failed: ${FAILED_WORKFLOW}" \
            --body "The workflow **${FAILED_WORKFLOW}** failed.

          **Run URL:** ${FAILED_RUN_URL}
          **Event:** ${FAILED_EVENT}
          **Branch:** ${FAILED_BRANCH}

          Please investigate the failing job logs and fix the underlying issue.")

          echo "Created issue: ${ISSUE_URL}"

          # Labels are useful but must never make failure reporting fail when a
          # repository label is renamed or removed.
          gh issue edit "${ISSUE_URL}" \
            --repo "${{ github.repository }}" \
            --add-label "priority:high" \
            --add-label "ai-agent-task" || true

          gh issue comment "${ISSUE_URL}" \
            --repo "${{ github.repository }}" \
            --body "/openhands-fix please investigate the logs of this workflow run and fix the failure!"
