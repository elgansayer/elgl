name: Temporary restore backend formatter

on:
  push:
    branches:
      - ci/restore-main-green-current-20260815

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/restore-main-green-current-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
      - name: Apply repository lint fixes
        working-directory: backend
        run: npm run lint
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(backend): apply canonical lint fixes"
          git push origin HEAD:ci/restore-main-green-current-20260815
