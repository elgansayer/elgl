name: Hydration Compatibility Contract

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'e2e/playwright.config.ts'
      - 'visual-contract.matrix.json'
      - 'scripts/verify-hydration-compatibility.mjs'
      - 'scripts/verify-hydration-compatibility.test.mjs'
      - 'docs/hydration-compatibility.md'
      - 'docs/hydration-compatibility-gate.md'
      - '.github/workflows/hydration-compatibility-contract.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - 'e2e/playwright.config.ts'
      - 'visual-contract.matrix.json'
      - 'scripts/verify-hydration-compatibility.mjs'
      - 'scripts/verify-hydration-compatibility.test.mjs'
      - 'docs/hydration-compatibility.md'
      - 'docs/hydration-compatibility-gate.md'
      - '.github/workflows/hydration-compatibility-contract.yml'
  merge_group:

permissions:
  contents: read

jobs:
  hydration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hydration contract tests
        run: node --test scripts/verify-hydration-compatibility.test.mjs
      - name: Verify changed frontend hydration safety
        env:
          HYDRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: node scripts/verify-hydration-compatibility.mjs
      - name: Verify light, dark, RTL and high-zoom visual states
        run: node scripts/verify-visual-contract-matrix.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production SSR bundle
        working-directory: frontend
        run: npm run build
