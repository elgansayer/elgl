name: Centrifugo Config Contract

on:
  pull_request:
    paths:
      - 'config/centrifugo/**'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - 'docker-compose.prod.yml'
      - '.env.example'
      - 'prometheus/prometheus.yml'
      - 'scripts/centrifugo-config-contract.test.mjs'
      - 'docs/centrifugo-server-config.md'
      - '.github/workflows/centrifugo-config-contract.yml'
  push:
    branches: [main, develop]
    paths:
      - 'config/centrifugo/**'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - 'docker-compose.prod.yml'
      - '.env.example'
      - 'prometheus/prometheus.yml'
      - 'scripts/centrifugo-config-contract.test.mjs'
      - 'docs/centrifugo-server-config.md'
      - '.github/workflows/centrifugo-config-contract.yml'
  merge_group:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Centrifugo and Redis configuration
        run: node --test scripts/centrifugo-config-contract.test.mjs
