name: Translation-safe component APIs

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/app/**'
      - 'scripts/verify-translation-safe-component-apis.mjs'
      - 'scripts/verify-translation-safe-component-apis.test.mjs'
      - 'package.json'
      - '.github/workflows/translation-safe-api.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: translation-safe-api-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Enforce translation-safe component API migration
        env:
          TRANSLATION_SAFE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: npm run check:translation-safe-apis
