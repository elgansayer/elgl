name: Empty State Illustrations Contract

on:
  pull_request:
    paths:
      - 'frontend/public/assets/illustrations/**'
      - 'frontend/src/app/components/primitives/empty-state/**'
      - 'frontend/src/app/components/chat-list/chat-list.component.html'
      - 'frontend/src/app/components/moments-feed/moments-feed.component.html'
      - 'frontend/src/app/components/discovery/discovery.component.html'
      - 'scripts/verify-empty-state-illustrations.mjs'
      - 'scripts/verify-empty-state-illustrations.test.mjs'
      - 'docs/empty-state-illustrations.md'
      - 'package.json'
      - '.github/workflows/empty-state-illustrations-contract.yml'
  push:
    branches: [main, develop]
    paths:
      - 'frontend/public/assets/illustrations/**'
      - 'frontend/src/app/components/primitives/empty-state/**'
      - 'frontend/src/app/components/chat-list/chat-list.component.html'
      - 'frontend/src/app/components/moments-feed/moments-feed.component.html'
      - 'frontend/src/app/components/discovery/discovery.component.html'
      - 'scripts/verify-empty-state-illustrations.mjs'
      - 'scripts/verify-empty-state-illustrations.test.mjs'
      - 'docs/empty-state-illustrations.md'
      - 'package.json'
      - '.github/workflows/empty-state-illustrations-contract.yml'
  merge_group:

permissions:
  contents: read

concurrency:
  group: empty-state-illustrations-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify empty-state illustration assets and integrations
        run: npm run check:empty-state-illustrations
