name: Simplify Text Contract

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/src/app/components/long-press-context-menu/long-press-context-menu.component.ts'
      - 'frontend/src/app/components/long-press-context-menu/long-press-context-menu.component.spec.ts'
      - 'frontend/src/app/services/nlp.service.ts'
      - 'backend/src/nlp/nlp.controller.ts'
      - 'backend/src/nlp/dto/simplify.dto.ts'
      - 'backend/src/nlp/nlp.service.ts'
      - 'scripts/verify-simplify-text-contract.test.mjs'
      - '.github/workflows/simplify-text-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/app/components/long-press-context-menu/long-press-context-menu.component.ts'
      - 'frontend/src/app/components/long-press-context-menu/long-press-context-menu.component.spec.ts'
      - 'frontend/src/app/services/nlp.service.ts'
      - 'backend/src/nlp/nlp.controller.ts'
      - 'backend/src/nlp/dto/simplify.dto.ts'
      - 'backend/src/nlp/nlp.service.ts'
      - 'scripts/verify-simplify-text-contract.test.mjs'
      - '.github/workflows/simplify-text-contract.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: simplify-text-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: frontend-backend / simplify-text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify message simplification contract
        run: node --test scripts/verify-simplify-text-contract.test.mjs
