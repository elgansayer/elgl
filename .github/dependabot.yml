version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/frontend'
      - '/backend'
      - '/admin-portal'
      - '/e2e'
      - '/tests/load'
    # Batch routine version churn so the repository pays the CI matrix once per
    # weekly update wave instead of continually refilling a large daily PR queue.
    # Dependabot security updates remain separately grouped below.
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Europe/London'
    open-pull-requests-limit: 8
    assignees:
      - 'elgansayer'
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Framework packages only work across a major at the same version, so
      # single-package majors (e.g. 11 separate @nestjs/* 12 PRs) cannot pass
      # CI alone. One PR per family stays within one compatibility lane.
      nestjs-major:
        applies-to: version-updates
        patterns:
          - '@nestjs/*'
        update-types:
          - 'major'
      angular-major:
        applies-to: version-updates
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
        update-types:
          - 'major'

  - package-ecosystem: 'pip'
    directory: '/automation'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:15'
      timezone: 'Europe/London'
    open-pull-requests-limit: 3
    assignees:
      - 'elgansayer'
    groups:
      python-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      python-routine-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:30'
      timezone: 'Europe/London'
    open-pull-requests-limit: 3
    assignees:
      - 'elgansayer'
    groups:
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      actions-routine-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directories:
      - '/frontend'
      - '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:45'
      timezone: 'Europe/London'
    open-pull-requests-limit: 5
    assignees:
      - 'elgansayer'
    groups:
      container-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      container-routine-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
