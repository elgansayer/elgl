[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "repo-factory"
version = "0.1.0"
description = "Supervised autonomous development control plane for multiple repositories"
requires-python = ">=3.12"
dependencies = [
  "filelock==3.32.3",
  "httpx==0.28.1",
  "openhands-sdk==1.42.1",
  "openhands-tools==1.42.1",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
development = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[project.scripts]
repo-factory = "openhands_factory.cli:main"
hellotalk-factory = "openhands_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openhands_factory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openhands_factory"]
