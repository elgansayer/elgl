version: '3.8'

services:
  api:
    build:
      context: ./backend
      target: production
    restart: always
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      - REDIS_URL=redis://cache:6379
      - CENTRIFUGO_URL=http://websocket:8000
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - cache
      - websocket
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:3000/api/health",r=>{let d="";r.on("data",c=>d+=c);r.on("end",()=>process.exit(d.includes("ok")?0:1))})']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      target: production
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  websocket:
    image: centrifugo/centrifugo:v5
    restart: always
    command: centrifugo -c /centrifugo/config.json
    environment:
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_SECRET}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - ./config/centrifugo:/centrifugo
    depends_on:
      - cache
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  sfu:
    image: livekit/livekit-server:latest
    restart: always
    command: --config /livekit/config.yaml
    environment:
      - 'LIVEKIT_KEYS=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_SECRET:?LIVEKIT_SECRET is required}'
      - 'LIVEKIT_TURN_ENABLED=true'
      - 'LIVEKIT_TURN_DOMAIN=${LIVEKIT_TURN_DOMAIN:?LIVEKIT_TURN_DOMAIN is required}'
      - 'LIVEKIT_TURN_TLS_PORT=443'
      - 'LIVEKIT_TURN_UDP_PORT=3478'
      - 'LIVEKIT_TURN_EXTERNAL_TLS=false'
      - 'LIVEKIT_TURN_CERT_FILE=/run/secrets/livekit_turn_cert'
      - 'LIVEKIT_TURN_KEY_FILE=/run/secrets/livekit_turn_key'
      - 'LIVEKIT_RTC_STUN_SERVERS=${LIVEKIT_RTC_STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}'
    ports:
      - '7880:7880'
      - '7881:7881'
      - '3478:3478/udp'
      - '443:443'
      - '58000-58100:58000-58100/udp'
    volumes:
      - ./config/livekit:/livekit:ro
    secrets:
      - livekit_turn_cert
      - livekit_turn_key
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:7880/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/consoles'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/tutor-profiles.rules.yml:/etc/prometheus/tutor-profiles.rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - websocket
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - '3001:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

secrets:
  livekit_turn_cert:
    file: ${LIVEKIT_TURN_CERT_FILE:?LIVEKIT_TURN_CERT_FILE is required}
  livekit_turn_key:
    file: ${LIVEKIT_TURN_KEY_FILE:?LIVEKIT_TURN_KEY_FILE is required}
