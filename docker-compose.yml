version: '3.8'

services:
  api:
    build:
      context: ./backend
      target: production
    restart: always
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - cache
      - websocket

  web:
    build:
      context: ./frontend
      target: production
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

  cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  websocket:
    image: centrifugo/centrifugo:v5
    restart: always
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./config/centrifugo:/centrifugo
    depends_on:
      - cache

  sfu:
    image: livekit/livekit-server:latest
    restart: always
    command: --config /livekit/config.yaml
    environment:
      - LIVEKIT_TURN_ENABLED=true
      - LIVEKIT_TURN_DOMAIN=${LIVEKIT_TURN_DOMAIN:-turn.example.com}
      - LIVEKIT_TURN_TLS_PORT=5349
      - LIVEKIT_TURN_UDP_PORT=3478
      - LIVEKIT_RTC_STUN_SERVERS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-60000:50000-60000/udp"
    volumes:
      - ./config/livekit:/livekit

volumes:
  redis_data:
