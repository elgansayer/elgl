version: '3.8'

services:
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://cache:6379
      - CENTRIFUGO_URL=http://websocket:8000
    depends_on:
      cache:
        condition: service_healthy
      websocket:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:3000/api/health",r=>{let d="";r.on("data",c=>d+=c);r.on("end",()=>process.exit(d.includes("ok")?0:1))})']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run start -- --host 0.0.0.0 --port 4200
    ports:
      - '4200:4200'
    environment:
      - NODE_ENV=development
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4200/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  websocket:
    image: centrifugo/centrifugo:v5
    restart: always
    command: centrifugo -c /centrifugo/config.json
    environment:
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_SECRET}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - ./config/centrifugo:/centrifugo
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  sfu:
    image: livekit/livekit-server:latest
    command: --config /livekit/config.yaml
    environment:
      - LIVEKIT_TURN_ENABLED=true
      - LIVEKIT_TURN_DOMAIN=${LIVEKIT_TURN_DOMAIN:-turn.example.com}
      - LIVEKIT_TURN_CERT_FILE=${LIVEKIT_TURN_CERT_FILE:-}
      - LIVEKIT_TURN_KEY_FILE=${LIVEKIT_TURN_KEY_FILE:-}
      - LIVEKIT_TURN_TLS_PORT=5349
      - LIVEKIT_TURN_UDP_PORT=3478
      - LIVEKIT_RTC_STUN_SERVERS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
    ports:
      - '7880:7880'
      - '7881:7881'
      - '3478:3478/udp'
      - '5349:5349'
      - '50000-60000:50000-60000/udp'
    volumes:
      - ./config/livekit:/livekit
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:7880/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_dev_data:/prometheus
    depends_on:
      - api
      - websocket
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - '3001:3000'
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_dev_data:
  prometheus_dev_data:
  grafana_dev_data:
