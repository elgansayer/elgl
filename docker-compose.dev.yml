version: '3.8'

services:
  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - cache
      - websocket

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run start -- --host 0.0.0.0 --port 4200
    ports:
      - '4200:4200'
    depends_on:
      - api

  cache:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

  websocket:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c /centrifugo/config.json
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - ./config/centrifugo:/centrifugo
    depends_on:
      - cache

  sfu:
    image: livekit/livekit-server:latest
    command: --config /livekit/config.yaml
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50000-50100:50000-50100/udp'
    volumes:
      - ./config/livekit:/livekit

volumes:
  redis_dev_data:
