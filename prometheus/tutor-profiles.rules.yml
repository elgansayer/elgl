# Prometheus alerting rules for the Tutor Profiles architecture (#2092).
#
# These rules alert on the hellotalk_tutor_profiles_* metrics exposed by the
# NestJS backend at /api/metrics. The Tutor Profiles module is planned: the
# rules remain inactive until the backend emits the documented metrics. See
# docs/tutor-profiles-monitoring.md for the full metric catalogue and
# thresholds.
#
# Rules are evaluated by Prometheus (evaluation_interval: 15s) and can be
# routed by Alertmanager once an alertmanager target is configured in
# prometheus.yml.

groups:
  - name: tutor-profiles
    rules:
      - alert: TutorProfilesCreationStalled
        expr: sum(rate(hellotalk_tutor_profiles_created_total{status="success"}[30m])) == 0
        for: 30m
        labels:
          severity: critical
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: No tutor profiles created in the last 30 minutes
          description: The tutor profile creation rate has been zero for 30 minutes. This may indicate an outage of the tutor onboarding pipeline or a metrics ingestion problem.

      - alert: TutorProfilesCreationFailureRateHigh
        expr: (sum(rate(hellotalk_tutor_profiles_created_total{status="failed"}[10m])) / clamp_min(sum(rate(hellotalk_tutor_profiles_created_total[10m])), 0.001)) * 100 > 10
        for: 5m
        labels:
          severity: critical
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: Tutor profile creation failure rate above 10%
          description: More than 10% of tutor profile creation attempts failed over the last 10 minutes. Check the creation endpoint logs, Supabase connectivity and the tutor_profiles schema.

      - alert: TutorProfilesVerificationFailuresHigh
        expr: increase(hellotalk_tutor_profiles_verification_failures_total[15m]) > 10
        for: 5m
        labels:
          severity: warning
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: High tutor verification failure volume
          description: More than 10 tutor verification failures were recorded in the last 15 minutes. Verify the identity provider integration and review recent applications for abuse patterns.

      - alert: TutorProfilesSearchLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(hellotalk_tutor_profiles_search_duration_seconds_bucket[10m]))) > 2
        for: 5m
        labels:
          severity: warning
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: Tutor search p95 latency above 2 seconds
          description: The 95th percentile tutor search latency has exceeded 2 seconds for 5 minutes. Check tutor_profiles query performance, search indexes and the Redis cache.

      - alert: TutorProfilesSearchVolumeZero
        expr: sum(rate(hellotalk_tutor_profiles_search_requests_total[30m])) == 0
        for: 30m
        labels:
          severity: critical
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: No tutor search requests in the last 30 minutes
          description: The tutor search request rate has been zero for 30 minutes. This may indicate an outage of the tutor discovery feature or a metrics pipeline issue.

      - alert: TutorProfilesSearchEmptyResultsHigh
        expr: (sum(rate(hellotalk_tutor_profiles_search_empty_results_total[1h])) / clamp_min(sum(rate(hellotalk_tutor_profiles_search_requests_total[1h])), 0.001)) * 100 > 50
        for: 10m
        labels:
          severity: warning
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: More than 50% of tutor searches return no results
          description: Over half of tutor searches returned empty results in the last hour. Check the tutor_profiles dataset and the availability and language filters.

      - alert: TutorProfilesSessionCancellationRateHigh
        expr: (sum(rate(hellotalk_tutor_profiles_sessions_cancelled_total[1h])) / clamp_min(sum(rate(hellotalk_tutor_profiles_sessions_booked_total{status="success"}[1h])), 0.001)) > 0.2
        for: 10m
        labels:
          severity: warning
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: Tutoring session cancellation rate above 20%
          description: More than 20% of booked tutoring sessions were cancelled in the last hour. Review cancellation reasons and the booking flow.

      - alert: TutorProfilesSessionRefundRateHigh
        expr: (sum(rate(hellotalk_tutor_profiles_sessions_refunded_total[1h])) / clamp_min(sum(rate(hellotalk_tutor_profiles_sessions_completed_total[1h])), 0.001)) > 0.1
        for: 10m
        labels:
          severity: warning
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: Tutoring session refund rate above 10%
          description: More than 10% of completed tutoring sessions were refunded in the last hour. Review disputes and the escrow release flow.

      - alert: TutorProfilesStaleAvailabilityHigh
        expr: hellotalk_tutor_profiles_availability_stale > 20
        for: 10m
        labels:
          severity: warning
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: Many tutor availability records are stale
          description: More than 20 tutor profiles have not refreshed their availability in over 7 days. Re-engage inactive tutors and review the availability refresh job.

      - alert: TutorProfilesApiErrorRateHigh
        expr: sum(increase(hellotalk_tutor_profiles_api_errors_total[10m])) > 20
        for: 5m
        labels:
          severity: critical
          team: tutor-profiles
          service: hellotalk
        annotations:
          summary: High volume of tutor profile API errors
          description: The tutor profiles API recorded more than 20 errors in the last 10 minutes. Inspect backend logs, Supabase connectivity and the latest deployment.
