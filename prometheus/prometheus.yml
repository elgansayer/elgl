global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'hellotalk-nestjs'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'hellotalk-api'
    scrape_interval: 10s

  - job_name: 'centrifugo'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['websocket:8001']
        labels:
          service: 'centrifugo'
    scrape_interval: 10s
