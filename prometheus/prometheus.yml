global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'hellotalk-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['api:3000']

  - job_name: 'centrifugo'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['websocket:8000']