# .aider.conf.yml
# Pinned explicitly: DEEPSEEK_API_KEY is the paid-for account for aider. GEMINI_API_KEY
# is reserved for the Antigravity CLI (Gemini Pro plan) and must never be picked up here,
# since Gemini API usage from aider bills per-token on top of the flat Gemini Pro plan.
model: deepseek/deepseek-chat

read:
  - SPEC.md
  - AGENTS.md

# Silence model proxy warnings globally
show-model-warnings: false

# Prevent Aider from stopping to ask human permission
yes-always: true

# Native Linting & Testing hooks
auto-lint: true
lint-cmd:
  - "cd frontend && npm run lint"
  - "cd backend && npm run lint"
test-cmd: "cd backend && npm test && cd ../frontend && npm test"